name: Daily dashboard

on:
  schedule:
    # Beijing time (UTC+8), every 2 hours from 07:00 through 21:00, plus 22:00.
    # GitHub cron is UTC; public-repo runs can lag by hours.
    # 07,09,11,13,15,17,19,21,22 Beijing → 23,01,03,05,07,09,11,13,14 UTC
    - cron: "0 1,3,5,7,9,11,13,14,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install opencc-python-reimplemented
      - name: Rebuild index.html
        run: python scripts/rebuild_daily.py
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "每日整合：限時情報王 + AI HOT $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push origin HEAD:main
