name: Daily dashboard

on:
  schedule:
    # Extract news all day. GitHub public-repo cron at minute 0 skipped most of
    # the old 2-hour slots (gaps of 5–7h). Hourly at :17 still lands about every
    # 1–2 hours even when GitHub drops a tick.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: pip install opencc-python-reimplemented
      - name: Rebuild index.html
        run: python scripts/rebuild_daily.py
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "每日整合：限時情報王 + AI HOT $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push origin HEAD:main
