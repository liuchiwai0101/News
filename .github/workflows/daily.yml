name: Daily dashboard

on:
  schedule:
    # Beijing time (UTC+8). GitHub cron is UTC; public-repo runs can lag by hours.
    - cron: "0 23 * * *" # 07:00 Beijing
    - cron: "0 5 * * *"  # 13:00 Beijing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild index.html
        run: python scripts/rebuild_daily.py
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes"
            exit 0
          fi
          git commit -m "每日整合：限時情报王 + AI HOT $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push origin HEAD:main
