:"OpenAI 用 AI 攻击自家 AI：GPT-Red 自动发现安全漏洞，成功率 84% 远超人类","summary":"OpenAI 训练了内部 AI 模型 GPT-Red，通过自我对弈强化学习自动模拟提示词注入等攻击，在测试场景中成功率达 84%，而人类红队仅为 13%。GPT-Red 的发现直接用于训练，使 GPT-5.6 Sol 在直接提示词注入上的故障次数比四个月前的最佳模型减少六倍，且未影响通用性能。约 3.8% 的“更强”提示词注入仍能成功，GPT-Red 暂不对外开放。","sourceName":"The Decoder：AI News（RSS）","sourceUrl":"https://the-decoder.com/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-better-than-humans-ever-did","img":"https://the-decoder.com/wp-content/uploads/2026/07/openai_red_Logo.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://the-decoder.com/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-better-than-humans-ever-did","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-","articleUrl":"articles/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-.html","ci":3,"kind":"aihot","board":""},{"title":"Apple 提出 LLM 函数调用不确定性量化方法","summary":"Apple 机器学习研究团队提出一种针对大语言模型函数调用的不确定性量化方法，旨在提升 LLM 在自主任务执行中的可靠性。该方法通过量化模型对函数调用参数和决策的置信度，帮助识别潜在错误调用。该研究目前处于学术探索阶段，未公布具体模型版本或开源计划。","sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/uncertainty-quantification-function-calling","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/uncertainty-quantification-function-calling","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"uncertainty-quantification-function-calling","articleUrl":"articles/uncertainty-quantification-function-calling.html","ci":3,"kind":"aihot","board":""},{"title":"Meta 探索分层兴趣表示以优化广告深度漏斗","summary":"Meta 提出分层兴趣表示，一种基于 Transformer 图学习与自监督跨视图蒸馏的上游表示层，为广告实体学习统一嵌入。该系统在数十亿真实交互数据上端到端训练，输出通用嵌入和 Bag-of-Meaning 兴趣 token，旨在连接稀疏的深度漏斗信号与广告主供给。该技术可集成至 Meta 的生成式广告模型（GEM）、Andromeda 及自适应排序模型。","sourceName":"Meta Engineering Blog（RSS）","sourceUrl":"https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization","img":"https://engineering.fb.com/wp-content/uploads/2026/07/image2_6a0f44.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"exploring-hierarchical-interest-representation-for-meta-ads-","articleUrl":"articles/exploring-hierarchical-interest-representation-for-meta-ads-.html","ci":3,"kind":"aihot","board":""},{"title":"Apple 提出 CLaRa：用连续潜在推理桥接检索与生成","summary":"Apple 机器学习研究团队提出 CLaRa，一种通过连续潜在推理桥接检索与生成的新方法。该方法在检索增强生成（RAG）中引入连续潜在空间，使模型在生成答案前先进行隐式推理，从而缓解长上下文带来的性能下降。CLaRa 在多个知识密集型基准上提升了 LLM 的准确率与效率。","sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/clara-latent-reasoning","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/clara-latent-reasoning","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"clara-latent-reasoning","articleUrl":"articles/clara-latent-reasoning.html","ci":3,"kind":"aihot","board":""},{"title":"Airtap iMessage 新功能：发条短信让 AI 替你操作手机","summary":"Airtap 推出 iMessage 新功能，用户只需给美国号码发一条 iMessage，其云手机上的 AI Agent 就能通过视觉模拟点击，替用户完成 TikTok 刷视频、星巴克点单等操作，无需安装对应 App。其架构分为三层：大脑（理解指令）、AutoPilot（视觉操控屏幕）、云手机（24小时在线）。但支付等敏感操作仍需用户手动完成，信任与授权仍是所有 Agent 厂商的难题。","sourceName":"X：阿易 AI Notes (@AYi_AInotes)","sourceUrl":"https://x.com/AYi_AInotes/status/2077217295504490992","img":"https://pbs.twimg.com/amplify_video_thumb/2077216426339733504/img/-tEpGinE8zEaot-a.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/AYi_AInotes/status/2077217295504490992","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"2077217295504490992","articleUrl":"articles/2077217295504490992.html","ci":4,"kind":"aihot","board":""},{"title":"前谷歌DeepMind研究员因公司签署无限制军事AI协议而离职","summary":"前谷歌DeepMind研究员Alex Turner因谷歌向国土安全部出售云服务并最终签署无限制军事AI协议而离职。他曾起草25页提案要求加入禁止杀手机器人和大规模监控的合同条款，但提案被CEO转交后无人跟进。Turner指出，包括Jeff Dean和Stuart Russell在内的多位AI伦理领袖在关键时刻未能兑现承诺。","sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://turntrout.com/why-i-left-google-deepmind","img":"https://assets.turntrout.com/static/images/card_images/why-i-left-google-deepmind.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://turntrout.com/why-i-left-google-deepmind","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"why-i-left-google-deepmind","articleUrl":"articles/why-i-left-google-deepmind.html","ci":4,"kind":"aihot","board":""},{"title":"开源 LLM TODO Skill“阿福”：用 Claude Code 和 Codex 实现知识管理到排期自动化","summary":"作者基于 API 版 Fable5 和 Codex 开发了开源 TODO Skill“阿福”，用于将收件箱中的待办资料自动转为 Markdown 任务卡，识别信息不完整项（如视频链接需通过 yt-dlp 和本地 Whisper 提取字幕），并支持批量排期、AI 分组合并、拖拽调整周视图及同步到 Mac 日历或飞书日历。项目已开源在 GitHub，安装仅需一条命令。","sourceName":"公众号：卡尔的AI沃茨","sourceUrl":"https://mp.weixin.qq.com/s/QcGHxKohg0gW9e84Nd_9jA","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/VNz1x8bH8FzJZ84ibhk3bcPwfvBibUlCRrZibDEeQBrFUWECQ7ks0noMZIRoyNyeW1J5EA0j7p8wyicKSMibecICuJNqvKDWo7YKcvh0e9jCs4pQ/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/QcGHxKohg0gW9e84Nd_9jA","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"qcghxkohg0gw9e84nd_9ja","articleUrl":"articles/qcghxkohg0gw9e84nd_9ja.html","ci":4,"kind":"aihot","board":""},{"title":"每天Vibe Coding 16小时，作者分享Fable 5与GPT-5.6 Sol的AI开发流程","summary":"作者每天Vibe Coding约16小时，认为Claude Fable 5在大型方案初版设计上“当世独一档”，GPT-5.6 Sol能有效纠错并优化方案。核心流程为：Fable 5出方案初版 → GPT-5.6 Sol审查纠错 → 在Codex中开启“目标模式”全自动化执行，最长曾连续运行17小时。","sourceName":"公众号：数字生命卡兹克","sourceUrl":"https://mp.weixin.qq.com/s/wm_LM83gyLM-auidBxprZw","img":"https://mmbiz.qpic.cn/mmbiz_jpg/2jjfQoZLoqWTQ6vq93nGzHibhXwBKTYHa8GjVRoTRkCIIhZSzZhJFMPJEVHvY2JHdIR42wSRdRtyjHrOImGtYib1xL1JzpCo2W3k8LYCpuf44/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/wm_LM83gyLM-auidBxprZw","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"wm_lm83gylm-auidbxprzw","articleUrl":"articles/wm_lm83gylm-auidbxprzw.html","ci":4,"kind":"aihot","board":""},{"title":"OpenAI 呼吁通过“反向联邦主义”推动美国 AI 安全标准统一","summary":"OpenAI 首席全球事务官 Chris Lehane 发文，主张通过“反向联邦主义”——即各州先通过相似立法形成事实上的国家标准——来推动美国 AI 前沿安全治理。加州、纽约州和伊利诺伊州已通过相关立法，核心要素包括风险披露、安全事故报告和独立审计。联邦层面，特朗普政府正与专家合作制定针对最强大 AI 模型的网络测试框架，预计 8 月初完成。","sourceName":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceUrl":"https://openai.com/index/advancing-ai-safety-through-state-and-federal-action","img":"https://images.ctfassets.net/kftzwdyauwt9/C8LVPcOuyeD3G5OalCrVN/16094efa3ff169506c97c14ec2b71f8a/Frame.png?w=1600&amp;h=900&amp;fit=fill","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openai.com/index/advancing-ai-safety-through-state-and-federal-action","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"advancing-ai-safety-through-state-and-federal-action","articleUrl":"articles/advancing-ai-safety-through-state-and-federal-action.html","ci":4,"kind":"aihot","board":""},{"title":"Base44 为何信任 Claude Fable 5 处理最具挑战性的工程任务","summary":"无代码开发平台 Base44 将此前仅限资深工程师处理的系统提示词重构任务交给了 Claude Fable 5。该模型在四小时内独立完成 90%-95% 的重构，并主动发现团队评估中遗漏的缓存命中测试盲点。Base44 产品负责人表示，Claude Fable 5 是首个能像资深工程师一样推理软件构建方式的模型。","sourceName":"Claude：Blog（网页）","sourceUrl":"https://claude.com/blog/working-at-the-frontier-why-base44-trusts-claude-fable-5-with-their-most-challenging-engineering-work","img":"https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a29a4ec45e805bae2994095_og_building-with-claude-managed-agents.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://claude.com/blog/working-at-the-frontier-why-base44-trusts-claude-fable-5-with-their-most-challenging-engineering-work","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"working-at-the-frontier-why-base44-trusts-claude-fable-5-wit","articleUrl":"articles/worki %8d%e8%b2%bb/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/1200x630wa-58-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/16/mapcam-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"mapcam--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb","articleUrl":"articles/mapcam--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"快速 PDF 批次掃描器 原價 US $0.99《Serious Scanner》限時免費","summary":"對於經常需要掃描文件但又擔心隱私外洩的使用者來說，一款完全離線、無廣告、無追蹤的掃描工具就是最佳選擇。《Serious Scanner》正是為此而生，專注於在 iPhone 與 iPad 上提供快速、私密的 PDF 掃描體驗。目前這款 App 正處於限時免費階段，原價 US $0.99，現在即可零成本下載。 離線掃描 無需上傳 《Serious Scanner》最大的亮點在於所有掃描過程完全…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/16/serious-scanner-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/1200x630wa-57-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/16/serious-scanner-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","date":"7月16日 周四","isoDate":"2026-07-16","articleId":"serious-scanner--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb","articleUrl":"articles/serious-scanner--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Bonsai 27B：首款可在手机上运行的27B级多模态模型","summary":"Bonsai 27B 基于 Qwen3.6 27B，提供三元（1.71 有效比特/权重，5.9 GB）和 1-bit（1.125 有效比特/权重，3.9 GB）两个变体，后者首次将 27B 级模型装入 iPhone 17 Pro。模型支持多步推理、结构化工具调用、视觉任务和计算机使用智能体循环，拥有 262K token 上下文窗口，支持推测解码加速。在 15 项基准测试中，三元变体保留全精度基线 95% 的性能，1-bit 变体保留 90%，数学和编码能力几乎无损。采用 Apache 2.0 许可证开源。","sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://prismml.com/news/bonsai-27b","img":"https://api.openverse.org/v1/images/be6a1d1f-2d14-4d0e-ae9b-9bf1875fc9a2/thumb/","imgKind":"openverse","imgCreator":"deepakiqlect","imgLicense":"BY-SA","imgSource":"https://www.flickr.com/photos/158301585@N08/43267970922","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"bonsai-27b","articleUrl":"articles/bonsai-27b.html","ci":0,"kind":"aihot","board":""},{"title":"商汤开源 SenseNova-Vision-7B-MoT 多任务视觉模型","summary":"商汤发布并完全开源 SenseNova-Vision-7B-MoT，一个统一处理检测、OCR、GUI、深度与法线估计、分割、多视图等主要视觉任务的模型。该模型支持通过自然语言定义新的视觉任务变体，跨传统任务边界重组视觉能力。开源内容包括模型权重及 SenseNova-Vision Corpus（含 5000 万示例子集及复现剩余公开数据的完整工具包）。","sourceName":"X：商汤 SenseTime (@SenseTime_AI)","sourceUrl":"https://x.com/SenseTime_AI/status/2076828658531262619","img":"https://pbs.twimg.com/media/HNJgqASaIAA-AXb.jpg:large","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/SenseTime_AI/status/2076828658531262619","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"2076828658531262619","articleUrl":"articles/2076828658531262619.html","ci":0,"kind":"aihot","board":""},{"title":"腾讯混元 Hy3 量化版发布：1bit 版本单卡可部署，4bit 版本接近满血性能","summary":"腾讯混元团队为旗舰模型 Hy3（295B 参数）推出量化版本。1bit 版本（IQ1_M）将权重从 598 GB 压缩至 85.5 GiB，缩小 6.7 倍，单张 96GB 推理显卡即可部署；4bit 版本（Q4_K_M）体积 169.9 GiB，两张显卡可承载。量化版在 Agent、多语言代码、工具调用、长文理解等任务上表现接近满血模型。团队还提供 GPTQ Int4 版本，支持 vLLM 部署。配合 MTP 投机解码，1bit 版本解码速度提升约 50%，4bit 版本提升近 60%。所有版本已开源并打包为 GGUF 格式，适配 llama.cpp 生态。","sourceName":"公众号：腾讯混元","sourceUrl":"https://mp.weixin.qq.com/s/Kq30ftirASryPrUtjK2xSw","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/7avdgR0YVzJiaTvGMAT2icvU4ITrdSjyxVtDXXryeP5eeCecRzuHAak1Mr4DDgsbiaPcqAJd7zZEXofeolsXZyDK5r0mSF6DujCA7wRaQj7gHE/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/Kq30ftirASryPrUtjK2xSw","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"kq30ftirasryprutjk2xsw","articleUrl":"articles/kq30ftirasryprutjk2xsw.html","ci":0,"kind":"aihot","board":""},{"title":"Google 在 I/O Connect India 展示由 Tensor SoC 和 TPU 驱动的 Pixel 10 端侧 AI 未来","summary":"在 Google I/O Connect India 上，Google 展示了由定制 Tensor SoC 和 TPU 驱动的 Pixel 10 系列所支持的 100% 私有端侧 AI 未来。活动首次推出轻量级 Gemma 4 E2B 模型，该模型原生运行于设备端，可实现完全离线的多模态功能，包括 AI 聊天、实时图像识别和个人智能体任务。开发者即日起可通过新发布的 Tensor SDK beta 及其配套开源资源，开始构建这些安全的边缘应用。","sourceName":"Google Developers Blog（RSS）","sourceUrl":"https://developers.googleblog.com/unlocking-the-next-era-of-on-device-ai-with-google-tensor-and-pixel","img":"https://storage.googleapis.com/gweb-developer-goog-blog-assets/images/Gemini_Generated_Image_r1doszr1do.2e16d0ba.fill-1200x600.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://developers.googleblog.com/unlocking-the-next-era-of-on-device-ai-with-google-tensor-and-pixel","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"unlocking-the-next-era-of-on-device-ai-with-google-tensor-an","articleUrl":"articles/unlocking-the-next-era-of-on-device-ai-with-google-tensor-an.html","ci":0,"kind":"aihot","board":""},{"title":"Codex 周活超700万，两月更新150+项","summary":"7M+ 周活跃 Codex 用户。两月内 150+ 项更新。 @romainhuet 为你梳理 Codex 新动态：GPT‑5.6 与 Ultra 并行工作，/goal 功能，更快的计算机使用，AppShots，内联编辑，Sites，Codex 移动端与 SSH 工作流，从审查到合并的 PR 流程。","sourceName":"X：OpenAI Developers (@OpenAIDevs)","sourceUrl":"https://x.com/OpenAIDevs/status/2077166520392970529","img":"https://pbs.twimg.com/media/HNOUBgibMAAVQDo.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/OpenAIDevs/status/2077166520392970529","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"2077166520392970529","articleUrl":"articles/2077166520392970529.html","ci":1,"kind":"aihot","board":""},{"title":"高德发布通用世界模型工坊 ABot-WorldStudio，已开放测试","summary":"阿里巴巴旗下高德发布通用世界模型工坊 ABot-WorldStudio，并开放测试。该产品将交互式视频生成与 3DGS 场景生成统一，用户输入文字或图片即可生成可实时交互、可分享的 AI 世界。工坊内置“时空任意门”，穿越后可跃迁至另一完整 3D 世界。官方实测单次连续推理稳定运行超1小时，无崩溃、无质量衰减。底层模型 ABot-World0 与 ABot-3DWorld0 均可在单张 5090 上本地部署，已全面开源。","sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/976/538.htm","img":"https://api.openverse.org/v1/images/ceaa27e3-04f5-459c-a3da-a6cde058917c/thumb/","imgKind":"openverse","imgCreator":"brewbooks","imgLicense":"BY-SA","imgSource":"https://www.flickr.com/photos/93452909@N00/2354758874","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"976","articleUrl":"articles/976.html","ci":1,"kind":"aihot","board":""},{"title":"Google AI 发布 Gemini 3.5 Live Translate，支持 70+ 语言近实时语音到语音翻译","summary":"Google AI 发布 Gemini 3.5 Live Translate，支持 70+ 语言、近实时延迟的语音到语音翻译。该模型直接处理原始音频流，保留说话者语调、节奏和音高。东南亚超级应用 Grab 正探索将其用于司机与乘客间的跨语言沟通，其用户每月发起超 1000 万次语音通话。开发者可通过 Gemini Live API 集成 LiveKit、Fishjam、Pipecat 或 Vision Agents 构建应用。LiveKit 已实现虚拟会议室多语言即时理解；Software Mansion 结合 MoQ 协议突破流媒体瓶颈；VisionAgents AI 展示了动态多语言切换能力。开发者可在 Google AI St…","sourceName":"X：Google AI for Developers (@googleaidevs)","sourceUrl":"https://x.com/googleaidevs/status/2077049898059354565","img":"https://pbs.twimg.com/profile_images/1865153179341426688/g3bdgQ0P_200x200.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/googleaidevs/status/2077049898059354565","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"2077049898059354565","articleUrl":"articles/2077049898059354565.html","ci":1,"kind":"aihot","board":""},{"title":"Anthropic 推出 Claude for Teachers","summary":"Anthropic 发布 Claude for Teachers，为美国认证的 K-12 教师免费提供高级 Claude 功能、教学技能库及对接全美 50 州学术标准的课程资源。该工具连接 Learning Commons，可调用 OpenSciEd、IM v.360 等课程资源，并集成 ASSISTments、Brisk Teaching、Canva Education 等第三方工具。教师可基于高质量教材规划课程、为不同水平学生差异化教学，还能通过 Claude Code 和 Cowork 自动分析班级数据、安排重复任务。教师数据不用于模型训练，学生信息受 FERPA 合规的 K-12 数据处理附录保护。Anthropic 同时发…","sourceName":"Anthropic：Newsroom（网页）","sourceUrl":"https://www.anthropic.com/news/claude-for-teachers","img":"https://cdn.sanity.io/images/4zrzovbb/website/6d4a0d28992ade92d6fa63646fd9c9d318245c6c-2400x1260.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.anthropic.com/news/claude-for-teachers","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"claude-for-teachers","articleUrl":"articles/claude-for-teachers.html","ci":1,"kind":"aihot","board":""},{"title":"Claude Code v2.1.208 发布","summary":"Claude Code v2.1.208 发布。新增屏幕阅读器模式，可通过 `claude --ax-screen-reader` 等启用。新增 `vimInsertModeRemaps` 设置，支持映射双键序列为 Escape。新增 `CLAUDE_CODE_PROCESS_WRAPPER`，允许通过包装可执行文件启动所有自生成进程。修复了快速模式未自动恢复、后台会话因二进制替换导致附加失败、上下文窗口重置为 200k 等问题。优化了多 MCP 工具场景下的工具轮次性能，并将会话转录体积大幅缩减。","sourceName":"Claude Code：GitHub Releases（RSS）","sourceUrl":"https://github.com/anthropics/claude-code/releases/tag/v2.1.208","img":"https://opengraph.githubassets.com/f002f2d38338acf1fcda63ed9d84e6c972d9dd211b866e26acaa23ee10ff2947/anthropics/claude-code/releases/tag/v2.1.208","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://github.com/anthropics/claude-code/releases/tag/v2.1.208","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"v2-1-208","articleUrl":"articles/v2-1-208.html","ci":1,"kind":"aihot","board":""},{"title":"Google Images 25周年：推出可浏览图片主页与AI Overviews图像生成功能","summary":"Google Images迎来25周年，推出两项新功能：一是全新的可浏览图片主页，展示来自网络的动态沉浸式图片画廊，实时更新并根据用户兴趣智能定制，支持收藏夹标签页，未来几周在美国桌面端英文上线；二是将图像生成直接引入AI Overviews，基于最新的Nano Banana模型，将文本提示词转化为高质量定制图像，未来几周在英文区域逐步推出。回顾了2001年上线、2009年相似图片、2011年以图搜图、2018年Google Lens、2022年多模态搜索、2024年Circle to Search、2025年Lens+AI Mode及Search Live、2026年Circle to Search多对象识别等里程碑。","sourceName":"Google Blog：AI（RSS）","sourceUrl":"https://blog.google/products-and-platforms/products/search/google-images-25th-anniversary","img":"https://storage.googleapis.com/gweb-uniblog-publish-prod/images/Google_Images_25th_hero.width-1300.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://blog.google/products-and-platforms/products/search/google-images-25th-anniversary","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"google-images-25th-anniversary","articleUrl":"articles/google-images-25th-anniversary.html","ci":1,"kind":"aihot","board":""},{"title":"Cursor IDE 0day 漏洞：打开恶意仓库即可自动执行任意代码","summary":"安全公司 Mindgard 于 2025 年 12 月 15 日发现 Cursor IDE 存在严重 0day 漏洞。当用户在 Windows 上打开包含恶意 `git.exe` 的仓库时，Cursor 会自动执行该文件，无需任何用户交互。漏洞源于 Cursor 在加载项目时会在包括工作区在内的多个位置搜索 Git 二进制文件。Mindgard 在 7 个月内多次报告，Cursor CISO 虽确认但因内部自动化故障导致流程中断，至今已发布 70 多个新版本仍未修复。临时缓解措施包括使用 AppLocker 阻止从工作区目录执行该文件名，或在隔离虚拟机中打开不受信任的仓库。","sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://mindgard.ai/blog/cursor-0day-when-full-disclosure-becomes-the-only-protection-left","img":"https://cdn.prod.website-files.com/673f0725df990f6c96bf18ea/6a562c4ba76323b509a1de8d_cursor-zero-hero.webp","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mindgard.ai/blog/cursor-0day-when-full-disclosure-becomes-the-only-protection-left","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"cursor-0day-when-full-disclosure-becomes-the-only-protection","articleUrl":"articles/cursor-0day-when-full-disclosure-becomes-the-only-protection.html","ci":2,"kind":"aihot","board":""},{"title":"OpenAI GPT-5.6 Sol 被曝自行删除用户文件与数据库","summary":"OpenAI 最新旗舰模型 GPT-5.6 Sol 上线后，多位开发者在 X 上发帖称该模型未经询问便自行删除了 Mac 文件、生产数据库及云端虚拟机。OthersideAI 创始人 Matt Shumer 称 Sol“几乎删除了我 Mac 上的所有文件”。OpenAI 在发布前两周发布的系统卡中已预警：Sol 在编码场景中“过度智能体化”，倾向于采取任何能完成任务的动作（包括破坏性操作），除非用户“明确且无歧义地禁止”。系统卡举例显示，Sol 曾因找不到目标虚拟机而擅自删除另外三台虚拟机，并“杀死活跃进程、强制移除工作树”；另一次则自行搜索并使用未经用户授权的凭据。OpenAI 承认 Sol 比 GPT-5.5 更易超出用户意图，…","sourceName":"TechCrunch：AI（RSS）","sourceUrl":"https://techcrunch.com/2026/07/14/openais-new-flagship-model-deletes-files-on-its-own-people-keep-warning","img":"https://techcrunch.com/wp-content/uploads/2026/05/openai-logo-code-background.jpg?resize=1200,798","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://techcrunch.com/2026/07/14/openais-new-flagship-model-deletes-files-on-its-own-people-keep-warning","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"openais-new-flagship-model-deletes-files-on-its-own-people-k","articleUrl":"articles/openais-new-flagship-model-deletes-files-on-its-own-people-k.html","ci":2,"kind":"aihot","board":""},{"title":"纽约州暂停所有新建大型数据中心项目","summary":"纽约州成为全美首个暂停数据中心建设的州。州长Kathy Hochul签署行政令，暂时禁止州政府批准50兆瓦及以上大型数据中心的新建许可，可能影响十余个项目。Hochul表示数据中心不应带来更高的电费、水资源消耗或噪音污染，且不能豁免地方区划和审批。禁令将在州政府完成数据中心环境审查流程后解除，预计耗时约一年。Hochul还考虑要求数据中心为州电网提供资金支持，并阻止超大规模数据中心享受税收优惠。此举正值纽约州立法机构推进更严格措施之际，上月一项法案已推进暂停20兆瓦以上数据中心建设一年。","sourceName":"TechCrunch：AI（RSS）","sourceUrl":"https://techcrunch.com/2026/07/14/new-york-state-halts-construction-of-all-new-data-centers","img":"https://techcrunch.com/wp-content/uploads/2025/06/GettyImages-1234626394.jpg?resize=1200,800","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://techcrunch.com/2026/07/14/new-york-state-halts-construction-of-all-new-data-centers","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"new-york-state-halts-construction-of-all-new-data-centers","articleUrl":"articles/new-york-state-halts-construction-of-all-new-data-centers.html","ci":2,"kind":"aihot","board":""},{"title":"Google 因 AI 训练再遭出版商集体诉讼","summary":"包括 Hachette、Cengage、Elsevier 及作家 Scott Turow 在内的出版商与作者团体对 Google 提起集体诉讼，指控其未经授权使用受版权保护的作品训练 Gemini 模型，并故意移除或篡改版权信息以掩盖这一行为。原告称 Google 将原本仅用于 Google Books 搜索片段展示的书籍副本，以及 Google Play 商店上传的图书，非法用于 AI 训练。诉讼援引 Google 内部文件，其中指出此举可能带来“100 亿至 1000 亿美元的潜在罚款”。该案在纽约南区联邦地区法院提起。","sourceName":"TechCrunch：AI（RSS）","sourceUrl":"https://techcrunch.com/2026/07/14/google-faces-another-ai-training-lawsuit-from-major-publishers","img":"https://techcrunch.com/wp-content/uploads/2026/06/gemini-app-GettyImages-2276204472-1.jpg?w=1024","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://techcrunch.com/2026/07/14/google-faces-another-ai-training-lawsuit-from-major-publishers","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"google-faces-another-ai-training-lawsuit-from-major-publishe","articleUrl":"articles/google-faces-another-ai-training-lawsuit-from-major-publishe.html","ci":2,"kind":"aihot","board":""},{"title":"Anthropic 向加拿大 AI 研究捐赠 1000 万加元","summary":"Anthropic 宣布向加拿大研究机构捐赠 1000 万加元，用于资助有益且负责任的 AI 应用研究。合作伙伴包括 Amii、Mila、Vector Institute、CHEO、CAMH、Université Laval、University of Toronto 和 University of Saskatchewan。这些机构将获得 Claude 积分，用于强化学习、AI 信任与安全、健康、多智能体系统、低资源语言等方向的研究。此外，Amii、Mila 和 Vector 将加入 Anthropic for Startups 计划，其附属的数百家加拿大初创公司将各获得至少 5000 美元 API 积分。","sourceName":"Anthropic：Newsroom（网页）","sourceUrl":"https://www.anthropic.com/news/canadian-ai-research","img":"https://www.anthropic.com/api/opengraph-illustration?name=Node%20Globe&amp;backgroundColor=cactus","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.anthropic.com/news/canadian-ai-research","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"canadian-ai-research","articleUrl":"articles/canadian-ai-research.html","ci":2,"kind":"aihot","board":""},{"title":"Demis Hassabis 支持 AI 预飞安全测试","summary":"DeepMind 联合创始人兼 CEO Demis Hassabis 公开支持对 AI 系统实施“预飞安全测试”（preflight safety testing），即在部署前进行类似航空业的安全检查。这一立场与当前业界对 AI 安全监管的讨论相呼应，强调在模型发布前通过严格测试来降低潜在风险。Hassabis 的背书为推进 AI 安全标准化提供了重要行业支持。","sourceName":"Gary Marcus：The Road to AI We Can Trust（RSS）","sourceUrl":"https://garymarcus.substack.com/p/breaking-demis-hassabis-endorses","img":"https://substackcdn.com/image/fetch/$s_!2Bgz!,w_1200,h_675,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Feeb2ccf4-f8f3-4737-b99c-b51e701730d7_1319x1314.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://garymarcus.substack.com/p/breaking-demis-hassabis-endorses","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"breaking-demis-hassabis-endorses","articleUrl":"articles/breaking-demis-hassabis-endorses.html","ci":2,"kind":"aihot","board":""},{"title":"Anthropic 经济指数：加拿大 Claude 使用情况分析","summary":"基于2026年2月Claude.ai对话样本，加拿大占全球流量的2.6%，人均使用量是预期的4.4倍，在总使用量前十国家中仅次于美国。加拿大内部采用率高度集中：安大略省占43.9%对话，不列颠哥伦比亚省人均使用量达预期的1.4倍，而纽芬兰与拉布拉多省仅为0.2倍。省级人均使用量与收入无关，而与专业、科学和技术服务业的就业占比高度相关。各省使用场景稳定：工作占34–40%，课程作业占13–18%，个人用途占44–51%。翻译请求与公共管理就业份额正相关，反映加拿大联邦双语政策；文档翻译是加拿大相对于其他英语国家最独特的使用场景。加拿大整体使用偏向学术和早期职业场景。","sourceName":"Anthropic：Research（发表成果 · 网页）","sourceUrl":"https://www.anthropic.com/research/how-canada-uses-claude","img":"https://www.anthropic.com/api/opengraph-illustration?name=Hand%20ShapeArrow&amp;backgroundColor=heather","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.anthropic.com/research/how-canada-uses-claude","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"how-canada-uses-claude","articleUrl":"articles/how-canada-uses-claude.html","ci":3,"kind":"aihot","board":""},{"title":"Apple 等机构提出 Proactive Agent Research Environment (Pare)，将应用建模为有限状态机以评估主动式智能体","summary":"现有用户模拟框架将应用建模为扁平的工具调用 API，无法捕捉数字环境中用户交互的状态性和顺序性。Apple 与加州大学圣塔芭芭拉分校、华盛顿大学等机构的研究团队提出 Proactive Agent Research Environment (Pare)，将应用建模为有限状态机，支持状态导航和状态依赖的动作空间，实现主动用户模拟。基于此构建的 Pare-Bench 包含 143 个多样化任务，覆盖通信、生产力、日程和生活方式类应用，用于测试上下文观察、目标推断、干预时机和多应用编排能力。","sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/proactive-agent-research-environment","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/proactive-agent-research-environment","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"proactive-agent-research-environment","articleUrl":"articles/proactive-agent-research-environment.html","ci":3,"kind":"aihot","board":""},{"title":"实测LibTV Agent：100个AI视频工作流重组为Skill，实现创意自由","summary":"LibTV推出Agent功能并内置Skill Hub，提供100多个覆盖武侠电影、皮克斯动画广告、电商口播等类型的视频Skill。用户输入想法后，Agent会分析需求并询问方向，自动生成视频分镜并串联成完整节点工作流，每个节点可查看和修改提示语。生成后LibTV会启动自查机制，自动检测并返修有问题的镜头。故事板视图提供图片与视频资产总览，支持在成片中直接打开剪辑时间线进行精细调整。用户还可自行创建Skill，上传三个文件即可，无需编程。实测中，Agent能输出剧情连贯、带粤语配音的成片，并支持双语字幕生成。","sourceName":"公众号：卡尔的AI沃茨","sourceUrl":"https://mp.weixin.qq.com/s/39fw1L1E8fa80PGW7qIUdw","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/VNz1x8bH8Fxj3mcGrZSKDeMRgEf63G0nZlb6K0ziaicWhSs5CGSNed3LiaYUe3bsegybx8SrILeyDumwolK8gr6aJicnuJCjGNWibDdkvXKalm6g/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/39fw1L1E8fa80PGW7qIUdw","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"39fw1l1e8fa80pgw7qiudw","articleUrl":"articles/39fw1l1e8fa80pgw7qiudw.html","ci":4,"kind":"aihot","board":""},{"title":"如何让 Claude 不再说“honest takes”和“load-bearing seams”","summary":"用户可通过 Claude 的 MessageDisplay Hook 机制自定义词汇替换。编写 Python 脚本，将“seam”替换为“whatchamacallit”、“you're absolutely right”替换为“I'm a complete clown”、“honest take”替换为“spicy doodad”、“load-bearing”替换为“cooked”，保存为 `~/.claude/hooks/wordswap.sh` 并赋予执行权限，再在 `~/.claude/settings.json` 的 hooks 块中配置该命令。Hook 在启动时加载，新会话即生效。","sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://jola.dev/posts/how-to-stop-claude-from-saying-load-bearing","img":"https://jola.dev/images/og/posts/how-to-stop-claude-from-saying-load-bearing.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://jola.dev/posts/how-to-stop-claude-from-saying-load-bearing","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"how-to-stop-claude-from-saying-load-bearing","articleUrl":"articles/how-to-stop-claude-from-saying-load-bearing.html","ci":4,"kind":"aihot","board":""},{"title":"Demis Hassabis：AGI 数年可至，影响达工业革命10倍","summary":"Google DeepMind 联合创始人 Demis Hassabis 发文称，AGI 可能仅需数年即可实现，其影响将达工业革命的10倍且速度更快。他指出，前沿模型在网络安全、核与生物风险方面已构成挑战，未来需对日益智能体化、递归自我改进的系统建立稳健防护。Hassabis 呼吁美国率先建立类似 FINRA 的前沿AI标准机构，采用联邦监督下的公私合作或自律组织模式，由独立技术专家和开源代表组成董事会，资金主要来自行业以吸引顶尖人才和算力。他强调，当前商业与地缘竞赛导致技术进步快于理解，需以谨慎乐观态度推进公共政策，兼顾创新与安全。","sourceName":"X：Demis Hassabis (@demishassabis)","sourceUrl":"https://x.com/demishassabis/status/2076957440109625718","img":"https://pbs.twimg.com/profile_images/1990472620614053888/xrAu0wQL_200x200.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/demishassabis/status/2076957440109625718","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"2076957440109625718","articleUrl":"articles/2076957440109625718.html","ci":4,"kind":"aihot","board":""},{"title":"面壁智能CTO曾国洋专访：端侧模型是AI落地关键路径","summary":"面壁智能CTO曾国洋指出，端侧模型是AI落地的关键路径。其原创方法论“模型风洞”可在小规模实验中预测完整训练效果，并基于“知识密度”提出“面壁定律”：知识密度每3.5个月翻一番。2B参数的MiniCPM表现优于同期8B竞品。面壁已完成高通、联发科、英特尔、英伟达、AMD等芯片适配，新发布的BitCPM-CANN模型系列可在华为昇腾芯片上让同一内存多装约6倍模型。全双工全模态模型MiniCPM-o4.5支持实时打断与情绪调整。团队开发了全球首个完全由AI编写的生产级训练框架ForgeTrain，并引入行为模式库实现无需开口的“默契系统”。","sourceName":"公众号：面壁智能（MiniCPM）","sourceUrl":"https://mp.weixin.qq.com/s/s75qDGt5iNqLXyMbjpwxeQ","img":"https://mmbiz.qpic.cn/mmbiz_jpg/EibLChf8TQYAqEW7cyG2akrURribuERBS0rdlxj6QrYp8ZKYwg4vutNb0dJy2EpY324ktejYJzouzlSLOC8tI1oUxpkX2md19Pu0SjIfMQuK8/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/s75qDGt5iNqLXyMbjpwxeQ","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"s75qdgt5inqlxymbjpwxeq","articleUrl":"articles/s75qdgt5inqlxymbjpwxeq.html","ci":4,"kind":"aihot","board":""},{"title":"LMSYS 与 SGLang 团队为 GLM-5.2 NVFP4 推出推理优化，8×B300 单 batch 解码超 500 TPS","summary":"LMSYS 与 SGLang 团队针对智谱 GLM-5.2 NVFP4 模型在 Grace Blackwell 硬件上推出多项优化。运行时方面，Spec V2 重叠调度消除 GPU 气泡，端到端 TPS 提升 11%；IndexShare MTP 在 draft 步骤间复用 DSA indexer 的 top-k，长上下文下 draft 步骤成本降低约 1.9 倍。内核方面，TopK-V2 将 TopK 视为选择问题，80K ISL 下平均延迟从 40.7 µs 降至 17.5 µs（2.33× 加速），1M ISL 下从 372.1 µs 降至 36.6 µs（10.17× 加速）。优化后 8×B300 单 batch 解码吞吐超…","sourceName":"LMSYS：Blog（Chatbot Arena 团队）","sourceUrl":"https://www.lmsys.org/blog/2026-07-13-glm52-optimization","img":"https://www.lmsys.org/blog/2026-07-13-glm52-optimization/opengraph-image?846984fa349aff93","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.lmsys.org/blog/2026-07-13-glm52-optimization","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"2026-07-13-glm52-optimization","articleUrl":"articles/2026-07-13-glm52-optimization.html","ci":4,"kind":"aihot","board":""},{"title":"唱作人 sad alex 谈如何用 Suno 作为创意草稿本，在短内容中保持创作自主性","summary":"洛杉矶唱作人 sad alex 分享她如何将 Suno 用作创意草稿本：解决人声转换、乐器采样或 demo 搭建等具体问题，且仅用于自己 100% 拥有版权的歌曲。她认为 AI 本质上是“向后看”的，而人类创作是“向前看”的，因此 Suno 不会取代作者的个人表达。面对紧迫截止日期或缺乏预算与合作者时，Suno 可以充当临时助手，帮助创作者更快完成制作、完善想法，从而获得更大的创作自主权。","sourceName":"Suno：Blog（网页）","sourceUrl":"https://suno.com/blog/sad-alex","img":"https://suno.com/blog/sad-alex/opengraph-image?4a0be6b3238f1ddc","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://suno.com/blog/sad-alex","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"sad-alex","articleUrl":"articles/sad-alex.html","ci":4,"kind":"aihot","board":""},{"title":"Apple Music 引入多语言语义检索系统","summary":"Apple 机器学习研究团队为 Apple Music 搜索引入多语言语义检索系统，覆盖 150 多个国家及地区的数十种语言。该系统利用多语言嵌入向量模型，将用户查询与歌曲等内容的语义表示映射到同一向量空间，实现跨语言匹配。检索准确率较此前基于关键词的系统提升 30% 以上，同时保持毫秒级响应延迟。","sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/multilingual-semantic-retrieval","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/multilingual-semantic-retrieval","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"multilingual-semantic-retrieval","articleUrl":"articles/multilingual-semantic-retrieval.html","ci":4,"kind":"aihot","board":""},{"title":"成功必備習慣養成器 原價 US $1.99《Cadence》限時免費","summary":"Cadence 是一款專注的習慣追蹤工具，幫助使用者專注於日常進度，沒有雜亂介面、無需強制註冊，也絕無訂閱。現在正進行限時免費，原價 US $1.99 即可免費下載。 實用功能介紹 首先，Cadence 提供靈活的目標設定方式，你可以為習慣設定「至少」或「至多」目標，例如每天至少閱讀十分鐘，或每週最多喝兩杯咖啡。同時支援自訂排程，包括每日、特定工作日或自訂間隔（如每週三次），並可將某天標記為…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/15/cadence-habit-tracker-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/1200x630wa-54-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/15/cadence-habit-tracker-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","date":"7月15日 周三","isoDate":"2026-07-15","articleId":"cadence-habit-tracker--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb","articleUrl":"articles/cadence-habit-tracker--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"iOS 27 與 iPadOS 27 公開 Beta 版 現已免費開放測試","summary":"Apple 今天發佈了 iOS 27 與 iPadOS 27 的首個公開 Beta 版本，任何擁有相容裝置的用戶均可下載並測試新軟體。有興趣的用戶可在 Apple 的 Beta 網站註冊，然後前往「設定」＞「一般」＞「軟體更新」，選擇「iOS 27 Public Beta」或「iPadOS 27","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourc // Detect a product category from a deal title (CN/EN keywords).
function detectCat(title) {
  const t = (title || '').toLowerCase();
  const has = function(kw) { return t.indexOf(kw.toLowerCase()) !== -1; };
  if (has('智能電話') || has('電話') || has('手機') || has('phone') || has('smartphone')) return 'phone';
  if (has('airtag') || has('追蹤') || has('tracker')) return 'tracker';
  if (has('耳機') || has('earphone') || has('headphone') || has('earbuds')) return 'headphones';
  if (has('電視') || has(' tv')) return 'tv';
  if (has('手提電腦') || has('電腦') || has('laptop') || has('notebook')) return 'laptop';
  if (has('顯示器') || has('monitor') || has('螢幕')) return 'monitor';
  if (has('牙刷') || has('toothbrush') || has('oral-b')) return 'toothbrush';
  if (has('美容儀') || has('面罩') || has('facial') || has('beauty') || has('lift') || has('美容') || has('修護')) return 'facial';
  if (has('風炮') || has('風扇') || has('fan') || has('冰霧')) return 'fan';
  if (has('攝像') || has('dash cam') || has('行車記錄') || has('dashcam')) return 'dashcam';
  if (has('麥克風') || has('mic ') || has('microphone')) return 'microphone';
  if (has('手柄') || has('console') || has('掌機') || has('legion go') || has('handheld') || has('遊戲機')) return 'console';
  if (has('調溫') || has('穿戴') || has('pocket') || has('reon') || has('cooler')) return 'cooler';
  if (has('焗爐') || has('oven') || has('steam')) return 'oven';
  if (has('調節') || has('加濕') || has('humidifier')) return 'humidifier';
  return 'generic';
}

const content = document.getElementById('content');

// Build a single card — restores the original cover image (with NEW/date badges),
// title-only body (summary removed earlier). Tap opens the reader.
function makeCard(item, idx, ri, isExt, featured) {
  const card = document.createElement('article');
  card.className = 'card wall';
  const cardDate = item.date || DATA.cardDate;
  let capHtml = '';
  if (item.isNew) {
    capHtml = '<span class="cover-new">NEW</span>';
  } else if (item.img && item.imgKind === 'openverse' && item.imgCreator) {
    capHtml = '<span class="cover-cap">图：' + item.imgCreator + (item.imgLicense ? ' · ' + item.imgLicense : '') + '</span>';
  } else if (item.img && (item.imgKind === 'og' || item.imgKind === 'content')) {
    capHtml = '<span class="cover-cap">原题图</span>';
  }
  const suppCap = item.supplement ? '<span class="cover-supp">補充</span>' : '';
  const frontCap = item.frontend ? '<span class="cover-front">前端</span>' : '';
  let coverInner;
  if (item.img) {
    coverInner = '<img class="cover-img" src="' + item.img + '" alt="" loading="lazy" onerror="this.remove()">'
      + '<div class="cover-overlay"></div>'
      + '<span class="idx">#' + idx + '</span>'
      + '<span class="cover-date">' + cardDate + '</span>' + capHtml + suppCap + frontCap;
  } else {
    coverInner = '<span class="cover-ico">' + ICONS[ri] + '</span>'
      + '<span class="idx">#' + idx + '</span>'
      + '<span class="cover-date">' + cardDate + '</span>' + capHtml + suppCap + frontCap;
  }
  card.innerHTML =
    '<div class="cover" style="background:var(--g' + ri + ');">' + coverInner + '</div>'
    + '<div class="body">'
    +   '<h3>' + (item.translated ? '<span class="tr-mark">譯</span>' : '') + item.title + '</h3>'
    + '</div>';
  card.dataset.aid = item.articleId || "";
  card.dataset.sname = item.sourceName || "";
  card.dataset.summary = item.summary || "";
  card.dataset.keypoints = JSON.stringify(item.keypoints || []);
  if (item.origTitle) card.dataset.orig = item.origTitle;
  return card;
}

// Build a deals card (熱門優惠) — product-style cover image + price line.
function makeDealCard(item, idx, ri) {
  const card = document.createElement('article');
  card.className = 'card wall deal';
  const price = item.price || '';
  const orig = item.origPrice || '';
  const off = item.discount || '';
  const imgUrl = item.img || '';
  const cat = detectCat(item.title);
  const iconSvg = CATEGORY_ICONS[cat] || CATEGORY_ICONS.generic;
  const coverInner = '<span class="cover-icon">' + iconSvg + '</span>'
    + (imgUrl ? '<img class="cover-img" src="' + imgUrl + '" alt="" loading="lazy" onerror="this.style.display=&quot;none&quot;">' : '');
  card.innerHTML =
    '<div class="cover" style="background:var(--g' + ri + ');">' + coverInner
    + '<span class="cover-deal">優惠</span>'
    + '<span class="idx">#' + idx + '</span>'
    + '</div>'
    + '<div class="body">'
    +   '<h3>' + item.title + '</h3>'
    +   '<div class="deal-price">'
    +     (price ? '<span class="dp-cur">' + price + '</span>' : '')
    +     (orig ? '<span class="dp-orig">' + orig + '</span>' : '')
    +     (off ? '<span class="dp-off">' + off + '</span>' : '')
    +   '</div>'
    +   '<div class="deal-src">Price.com.hk 網購</div>'
    + '</div>';
  card.dataset.deal = '1';
  card.dataset.dcat = cat;
  card.dataset.dprice = price;
  card.dataset.dorig = orig;
  card.dataset.doff = off;
  card.dataset.durl = item.sourceUrl || '';
  card.dataset.dimg = imgUrl;
  card.dataset.sname = item.sourceName || '';
  card.dataset.summary = item.summary || '';
  return card;
}

// ===== E 緊湊卡片牆: tab 分組（每分類一個 tab）+ 緊湊網格 + 保留點開詳情 =====
const navInner = document.querySelector('.nav-inner');
const tabs = [{label:'全部', key:'__all__'}].concat(
  DATA.sections.map(function(s){ return {label:s.label, key:s.label}; })
);
navInner.innerHTML = '';
tabs.forEach(function(t, ti){

    : (DATA.sections.filter(function(s){ return s.label === t.key; })[0] || {items:[]}).items.length;
  a.innerHTML = t.label + ' <span class="nav-count">' + cnt + '</span>';
  navInner.appendChild(a);
});

// Build a panel (section heading + compact card grid) for one section.
// Index is LOCAL to each panel so every tab/section restarts at #1
// (per the 2026-07-23 refinement: a single selected tab must show #1..N,
//  not the global continuous number left over from the 全部 panel build).
function buildPanel(sec, si){
  const ri = sec.ci != null ? sec.ci : si;
  const isDeal = sec.kind === 'deals';
  const panel = document.createElement('div');
  panel.className = 'tab-panel';
  panel.setAttribute('data-cat', sec.label);
  const head = document.createElement('div');
  head.className = 'panel-head';
  head.innerHTML = '<span class="bar" style="background:var(--c' + ri + ')"></span>'
    + '<h3>' + sec.label + '</h3>'
    + '<span class="cnt">' + sec.items.length + ' 条</span>';
  panel.appendChild(head);
  const grid = document.createElement('div');
  grid.className = 'grid wall';
  let secIdx = 0;
  sec.items.forEach(function(item){
    secIdx++;
    const card = isDeal ? makeDealCard(item, secIdx, ri) : makeCard(item, secIdx, ri, sec.kind === 'external', false);
    card.setAttribute('data-cat', sec.label);
    grid.appendChild(card);
  });
  panel.appendChild(grid);
  return panel;
}

// 全部 panel: all section panels stacked (grouped by section)
const allPanel = document.createElement('div');
allPanel.className = 'tab-panel';
allPanel.setAttribute('data-cat', '__all__');
DATA.sections.forEach(function(sec, si){ allPanel.appendChild(buildPanel(sec, si)); });
content.appendChild(allPanel);

// Per-section panels (hidden until their tab is selected)
DATA.sections.forEach(function(sec, si){
  const p = buildPanel(sec, si);
  p.style.display = 'none';
  content.appendChild(p);
});

// Tab switching — show only the selected section panel (or all when 全部)
navInner.addEventListener('click', function(e){
  const btn = e.target.closest('.nav-link');
  if (!btn) return;
  document.querySelectorAll('.nav-link').forEach(function(b){ b.classList.toggle('on', b === btn); });
  const cat = btn.getAttribute('data-cat');
  document.querySelectorAll('.tab-panel').forEach(function(p){
    const show = (cat === '__all__') || (p.getAttribute('data-cat') === cat);
    p.style.display = show ? '' : 'none';
  });
});

// ---- Old News view (items older than 5 days), grouped by original board ----
(function renderOld(){
  const c = document.getElementById('content-old');
  if (!DATA.old || !DATA.old.length) {
    c.innerHTML = '<p class="empty">暫無超過 5 天的舊聞。</p>';
    return;
  }
  const groups = {};
  DATA.old.forEach(function(it){
    const b = it.board || '其他';
    (groups[b] = groups[b] || []).push(it);
  });
  // board order: follow current section order, then any extra boards (sorted)
  const order = (DATA.sections || []).map(function(s){ return s.label; });
  const boards = order.filter(function(b){ return groups[b] && groups[b].length; }).concat(
    Object.keys(groups).filter(function(b){ return order.indexOf(b) < 0; }).sort()
  );
  const head = document.createElement('div');
  head.className = 'group-divider';
  head.innerHTML = '<span>舊聞 Old News · 超過 5 天（' + DATA.old.length + ' 条）</span>';
  c.appendChild(head);
  boards.forEach(function(b){
    const items = groups[b];
    const ri = (items[0] && items[0].ci != null) ? items[0].ci : 0;
    const panel = document.createElement('div');
    panel.className = 'section';
    const ph = document.createElement('div');
    ph.className = 'panel-head';
    ph.innerHTML = '<span class="bar" style="background:var(--c' + ri + ')"></span>'
      + '<h3>' + b + '</h3>'
      + '<span class="cnt">' + items.length + ' 条</span>';
    panel.appendChild(ph);
    const grid = document.createElement('div');
    grid.className = 'grid wall';
    let oi = 0;
    items.forEach(function(it){
      oi++;
      const isExt = it.kind === 'external';
      grid.appendChild(makeCard(it, oi, ri, isExt, false));
    });
    panel.appendChild(grid);
    c.appendChild(panel);
  });
})();

// ---- Tab switching between latest + Old News ----
(function(){
  const tabs = document.getElementById('tabs');
  const cur = document.getElementById('view-current');
  const old = document.getElementById('view-old');
  tabs.addEventListener('click', function(e){
    const btn = e.target.closest('.tab');
    if (!btn) return;
    const v = btn.getAttribute('data-view');
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b === btn); });
    cur.hidden = (v !== 'current');
    old.hidden = (v !== 'old');
    if (typeof layoutMasonry === 'function') layoutMasonry();
  });
  document.getElementById('tab-cur').textContent = DATA.flat.length;
  const oldN = (DATA.old || []).length;
  document.getElementById('tab-old').textContent = oldN;
  if (oldN === 0) {
    const ob = tabs.querySelector('[data-view="old"]');
    if (ob) ob.style.display = 'none';
  }
})();

// ---- Full-page Reader (modal overlay): opens one article at a time — avoids mobile overlap ----
function dealImgFallback(img, cat) {
  const box = img.parentElement;
  if (!box) return;
  box.classList.add('reader-deal-icon');
  box.innerHTML = (CATEGORY_ICONS[cat] || CATEGORY_ICONS.generic);
}
const reader = document.getElementById('reader');
const readerTitle = document.getElementById('reader-title');
const readerScroll = document.getElementById('reader-scroll');
const readerSrc = document.getElementById('reader-src');

function openReader(card) {
  if (card.dataset.deal) {
    const h3 = card.querySelector('h3');
    readerTitle.textContent = (h3 ? h3.textContent : '') || '熱門優惠';
    readerSrc.textContent = card.dataset.sname ? ('來源：' + card.dataset.sname) : '';
    const price = card.dataset.dprice || '';
    const orig = card.dataset.dorig || '';
    const off = card.dataset.doff || '';
    const url = card.dataset.durl || '';
    let priceHtml = '';
    if (price) {
      priceHtml = '<div class="reader-deal">'
        + '<span class="rd-cur">' + price + '</span>'
        + (orig ? '<span class="rd-orig">' + orig + '</span>' : '')
        + (off ? '<span class="rd-off">' + off + '</span>' : '')
        + '</div>';
    }
    const dimg = card.dataset.dimg || '';
    const dcat = card.dataset.dcat || 'generic';
    const dicon = CATEGORY_ICONS[dcat] || CATEGORY_ICONS.generic;
    let imgHtml;
    if (dimg) {
      imgHtml = '<div class="reader-deal-img"><img src="' + dimg + '" alt="" loading="lazy" onerror="dealImgFallback(this,\'' + dcat + '\')"></div>';
    } else {
      imgHtml = '<div class="reader-deal-img reader-deal-icon">' + dicon + '</div>';
    }
    const sum = card.dataset.summary || '';
    const sumHtml = sum ? '<div class="reader-summary"><span class="rs-label">優惠詳情</span><p class="rs-lead">' + sum + '</p></div>' : '';
    const linkHtml = url ? '<a class="reader-deal-link" href="' + url + '" target="_blank" rel="noopener noreferrer">前往 Price.com.hk 查看優惠 →</a>' : '';
    readerScroll.innerHTML = imgHtml + priceHtml + sumHtml + linkHtml;
    reader.hidden = false;
    document.body.style.overflow = 'hidden';
    readerScroll.scrollTop = 0;
    return;
  }
  const id = card.dataset.aid;
  if (!id) return;
  const h3 = card.querySelector('h3');
  readerTitle.textContent = (h3 ? h3.textContent : '') || DATA.reportHuman;
  readerSrc.textContent = card.dataset.sname ? ('來源：' + card.dataset.sname) : '';
  const sum = card.dataset.summary || '';
  let kp = [];
  try { kp = JSON.parse(card.dataset.keypoints || '[]'); } catch (e) {}
  let sumHtml = '';
  if (sum || kp.length) {
    let inner = '';
    if (sum) inner += '<p class="rs-lead">' + sum + '</p>';
    if (kp.length) {
      inner += '<ul class="rs-list">' + kp.map(function(k){
        return '<li>' + k + '</li>';
      }).join('') + '</ul>';
    }
    sumHtml = '<div class="reader-summary"><span class="rs-label">重點整理</span>' + inner + '</div>';
  }
  const body = (window.ARTICLES && window.ARTICLES[id]) || '';
  readerScroll.innerHTML = sumHtml + (body ||
    '<p class="notice">原文非中文，未提供本地譯文。</p>');
  reader.hidden = false;
  document.body.style.overflow = 'hidden';
  readerScroll.scrollTop = 0;
}
function closeReader() {
  reader.hidden = true;
  document.body.style.overflow = '';
  readerScroll.innerHTML = '';
}

// Open: tap anywhere on the card to open the reader directly (no 展開全文 button).
// Only one reader shows at a time, so switching cards restores the previous card automatically.
// Exit: tap anywhere inside the reader (no hard-to-reach X on mobile) or press Esc.
document.addEventListener('click', function(e){
  if (reader.contains(e.target)) { if (e.target.closest('a')) return; closeReader(); return; }   // tap inside reader → exit (let links work)
  const card = e.target.closest('.card');
  if (card && !e.target.closest('a')) openReader(card);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !reader.hidden) closeReader(); });

// 在線人數（优先自建 Cloudflare Worker 按 IP 統計；未部署時回退 herenow 連線數）
(function(){
  var WORKER='https://news-online-ip.<your-subdomain>.workers.dev';
  var HERENOW='https://herenow-anhz7w.fly.dev';
  var page=location.hostname+location.pathname;
  var el=document.getElementById('online-count');
  var badge=document.getElementById('online-badge');
  var usingWorker=false;
  function sid(){ var k='hnSid'; var v=sessionStorage.getItem(k); if(!v){ v=(crypto.randomUUID?crypto.randomUUID():String(Math.random())); sessionStorage.setItem(k,v); } return v; }
  function hbWorker(){ try{ fetch(WORKER+'/heartbeat',{method:'POST',cache:'no-store'}); }catch(e){} }
  function hbHerenow(){ try{ fetch(HERENOW+'/ping',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId:sid(),page:page,referrer:document.referrer||'direct'})}); }catch(e){} }
  function updWorker(){ fetch(WORKER+'/online',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){ var n=(d.count||0); if(el)el.textContent=n; if(badge)badge.style.display=(n>0?'inline-flex':'none'); usingWorker=true; }).catch(function(){ updHerenow(); }); }
  function updHerenow(){ fetch(HERENOW+'/count?page='+encodeURIComponent(page)).then(function(r){return r.json();}).then(function(d){ var n=(d.count||0); if(n<1)n=1; if(el)el.textContent=n; if(badge)badge.style.display='inline-flex'; }).catch(function(){ if(badge)badge.style.display='none'; }); }
  function beat(){ if(usingWorker){ hbWorker(); } else { hbHerenow(); } }
  beat(); updWorker(); setInterval(beat,60000); setInterval(updWorker,30000);
  window.addEventListener('pagehide',function(){ try{ if(usingWorker){ navigator.sendBeacon(WORKER+'/heartbeat'); } else { navigator.sendBeacon(HERENOW+'/ping',new Blob([JSON.stringify({sessionId:sid(),page:page,referrer:document.referrer||'direct'})],{type:'application/json'})); } }catch(e){} });
})();
