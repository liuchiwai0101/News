的Qwen模型将被集成到Apple Intelligence中，为中国的iOS、iPadOS、macOS和visionOS用户提供文本与图像理解、内容生成等AI功能。中国网信办已公布包括Apple Intelligence、华为小艺大模型、OPPO AndesGPT在内的七项移动端生成式AI服务备案信息。阿里巴巴董事会主席蔡崇信表示，苹果在选定阿里前曾与多家中国公司洽谈。", "sourceName": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2077346752219521469", "img": "https://pbs.twimg.com/media/HNQ32vkawAALVs2.jpg:large", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/thexpin/status/2077346752219521469", "ci": 2, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077346752219521469", "articleUrl": "articles/2077346752219521469.html"}], "kind": "aihot", "ci": 2}, {"label": "论文研究", "items": [{"title": "Anthropic 研究：AI 智能体模拟中行为偏差", "summary": "Anthropic 新研究：2026 年夏季的智能体行为偏差。 在我们的敲诈实验一年后，我们又发现了四种当今自主 AI 智能体在模拟中行为不当的方式。 了解更多：https://alignment.anthropic.com/2026/agentic-misalignment-summer-2026/", "sourceName": "X：Anthropic (@AnthropicAI)", "sourceUrl": "https://x.com/AnthropicAI/status/2077452646303006927", "img": "https://pbs.twimg.com/media/HNSXXXaW8AAAwzp.png:large", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/AnthropicAI/status/2077452646303006927", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077452646303006927", "articleUrl": "articles/2077452646303006927.html"}, {"title": "OpenAI 用 AI 攻击自家 AI：GPT-Red 自动发现安全漏洞，成功率 84% 远超人类", "summary": "OpenAI 训练了内部 AI 模型 GPT-Red，通过自我对弈强化学习自动模拟提示词注入等攻击，在测试场景中成功率达 84%，而人类红队仅为 13%。GPT-Red 的发现直接用于训练，使 GPT-5.6 Sol 在直接提示词注入上的故障次数比四个月前的最佳模型减少六倍，且未影响通用性能。约 3.8% 的“更强”提示词注入仍能成功，GPT-Red 暂不对外开放。", "sourceName": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-better-than-humans-ever-did", "img": "https://the-decoder.com/wp-content/uploads/2026/07/openai_red_Logo.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://the-decoder.com/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-better-than-humans-ever-did", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-", "articleUrl": "articles/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-.html"}, {"title": "Apple 提出 LLM 函数调用不确定性量化方法", "summary": "Apple 机器学习研究团队提出一种针对大语言模型函数调用的不确定性量化方法，旨在提升 LLM 在自主任务执行中的可靠性。该方法通过量化模型对函数调用参数和决策的置信度，帮助识别潜在错误调用。该研究目前处于学术探索阶段，未公布具体模型版本或开源计划。", "sourceName": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/uncertainty-quantification-function-calling", "img": "https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://machinelearning.apple.com/research/uncertainty-quantification-function-calling", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "uncertainty-quantification-function-calling", "articleUrl": "articles/uncertainty-quantification-function-calling.html"}, {"title": "Meta 探索分层兴趣表示以优化广告深度漏斗", "summary": "Meta 提出分层兴趣表示，一种基于 Transformer 图学习与自监督跨视图蒸馏的上游表示层，为广告实体学习统一嵌入。该系统在数十亿真实交互数据上端到端训练，输出通用嵌入和 Bag-of-Meaning 兴趣 token，旨在连接稀疏的深度漏斗信号与广告主供给。该技术可集成至 Meta 的生成式广告模型（GEM）、Andromeda 及自适应排序模型。", "sourceName": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization", "img": "https://engineering.fb.com/wp-content/uploads/2026/07/image2_6a0f44.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "exploring-hierarchical-interest-representation-for-meta-ads-", "articleUrl": "articles/exploring-hierarchical-interest-representation-for-meta-ads-.html"}, {"title": "Apple 提出 CLaRa：用连续潜在推理桥接检索与生成", "summary": "Apple 机器学习研究团队提出 CLaRa，一种通过连续潜在推理桥接检索与生成的新方法。该方法在检索增强生成（RAG）中引入连续潜在空间，使模型在生成答案前先进行隐式推理，从而缓解长上下文带来的性能下降。CLaRa 在多个知识密集型基准上提升了 LLM 的准确率与效率。", "sourceName": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/clara-latent-reasoning", "img": "https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://machinelearning.apple.com/research/clara-latent-reasoning", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "clara-latent-reasoning", "articleUrl": "articles/clara-latent-reasoning.html"}], "kind": "aihot", "ci": 3}, {"label": "技巧与观点", "items": [{"title": "Airtap iMessage 新功能：发条短信让 AI 替你操作手机", "summary": "Airtap 推出 iMessage 新功能，用户只需给美国号码发一条 iMessage，其云手机上的 AI Agent 就能通过视觉模拟点击，替用户完成 TikTok 刷视频、星巴克点单等操作，无需安装对应 App。其架构分为三层：大脑（理解指令）、AutoPilot（视觉操控屏幕）、云手机（24小时在线）。但支付等敏感操作仍需用户手动完成，信任与授权仍是所有 Agent 厂商的难题。", "sourceName": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2077217295504490992", "img": "https://pbs.twimg.com/amplify_video_thumb/2077216426339733504/img/-tEpGinE8zEaot-a.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/AYi_AInotes/status/2077217295504490992", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077217295504490992", "articleUrl": "articles/2077217295504490992.html"}, {"title": "前谷歌DeepMind研究员因公司签署无限制军事AI协议而离职", "summary": "前谷歌DeepMind研究员Alex Turner因谷歌向国土安全部出售云服务并最终签署无限制军事AI协议而离职。他曾起草25页提案要求加入禁止杀手机器人和大规模监控的合同条款，但提案被CEO转交后无人跟进。Turner指出，包括Jeff Dean和Stuart Russell在内的多位AI伦理领袖在关键时刻未能兑现承诺。", "sourceName": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://turntrout.com/why-i-left-google-deepmind", "img": "https://assets.turntrout.com/static/images/card_images/why-i-left-google-deepmind.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://turntrout.com/why-i-left-google-deepmind", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "why-i-left-google-deepmind", "articleUrl": "articles/why-i-left-google-deepmind.html"}, {"title": "开源 LLM TODO Skill“阿福”：用 Claude Code 和 Codex 实现知识管理到排期自动化", "summary": "作者基于 API 版 Fable5 和 Codex 开发了开源 TODO Skill“阿福”，用于将收件箱中的待办资料自动转为 Markdown 任务卡，识别信息不完整项（如视频链接需通过 yt-dlp 和本地 Whisper 提取字幕），并支持批量排期、AI 分组合并、拖拽调整周视图及同步到 Mac 日历或飞书日历。项目已开源在 GitHub，安装仅需一条命令。", "sourceName": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/QcGHxKohg0gW9e84Nd_9jA", "img": "https://mmbiz.qpic.cn/sz_mmbiz_jpg/VNz1x8bH8FzJZ84ibhk3bcPwfvBibUlCRrZibDEeQBrFUWECQ7ks0noMZIRoyNyeW1J5EA0j7p8wyicKSMibecICuJNqvKDWo7YKcvh0e9jCs4pQ/0?wx_fmt=jpeg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://mp.weixin.qq.com/s/QcGHxKohg0gW9e84Nd_9jA", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "qcghxkohg0gw9e84nd_9ja", "articleUrl": "articles/qcghxkohg0gw9e84nd_9ja.html"}, {"title": "每天Vibe Coding 16小时，作者分享Fable 5与GPT-5.6 Sol的AI开发流程", "summary": "作者每天Vibe Coding约16小时，认为Claude Fable 5在大型方案初版设计上“当世独一档”，GPT-5.6 Sol能有效纠错并优化方案。核心流程为：Fable 5出方案初版 → GPT-5.6 Sol审查纠错 → 在Codex中开启“目标模式”全自动化执行，最长曾连续运行17小时。", "sourceName": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s/wm_LM83gyLM-auidBxprZw", "img": "https://mmbiz.qpic.cn/mmbiz_jpg/2jjfQoZLoqWTQ6vq93nGzHibhXwBKTYHa8GjVRoTRkCIIhZSzZhJFMPJEVHvY2JHdIR42wSRdRtyjHrOImGtYib1xL1JzpCo2W3k8LYCpuf44/0?wx_fmt=jpeg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://mp.weixin.qq.com/s/wm_LM83gyLM-auidBxprZw", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "wm_lm83gylm-auidbxprzw", "articleUrl": "articles/wm_lm83gylm-auidbxprzw.html"}, {"title": "OpenAI 呼吁通过“反向联邦主义”推动美国 AI 安全标准统一", "summary": "OpenAI 首席全球事务官 Chris Lehane 发文，主张通过“反向联邦主义”——即各州先通过相似立法形成事实上的国家标准——来推动美国 AI 前沿安全治理。加州、纽约州和伊利诺伊州已通过相关立法，核心要素包括风险披露、安全事故报告和独立审计。联邦层面，特朗普政府正与专家合作制定针对最强大 AI 模型的网络测试框架，预计 8 月初完成。", "sourceName": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/advancing-ai-safety-through-state-and-federal-action", "img": "https://images.ctfassets.net/kftzwdyauwt9/C8LVPcOuyeD3G5OalCrVN/16094efa3ff169506c97c14ec2b71f8a/Frame.png?w=1600&amp;h=900&amp;fit=fill", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://openai.com/index/advancing-ai-safety-through-state-and-federal-action", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "advancing-ai-safety-through-state-and-federal-action", "articleUrl": "articles/advancing-ai-safety-through-state-and-federal-action.html"}, {"title": "Base44 为何信任 Claude Fable 5 处理最具挑战性的工程任务", "summary": "无代码开发平台 Base44 将此前仅限资深工程师处理的系统提示词重构任务交给了 Claude Fable 5。该模型在四小时内独立完成 90%-95% 的重构，并主动发现团队评估中遗漏的缓存命中测试盲点。Base44 产品负责人表示，Claude Fable 5 是首个能像资深工程师一样推理软件构建方式的模型。", "sourceName": "Claude：Blog（网页）", "sourceUrl": "https://claude.com/blog/working-at-the-frontier-why-base44-trusts-claude-fable-5-with-their-most-challenging-engineering-work", "img": "https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a29a4ec45e805bae2994095_og_building-with-claude-managed-agents.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://claude.com/blog/working-at-the-frontier-why-base44-trusts-claude-fable-5-with-their-most-challenging-engineering-work", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "working-at-the-frontier-why-base44-trusts-claude-fable-5-wit", "articleUrl": "articles/working-at-the-frontier-why-base44-trusts-claude-fable-5-wit.html"}], "kind": "aihot", "ci": 4}], "flat": [{"title": "阿里发布 Qwen-Audio-3.0-Realtime，在 Artificial Analysis 语音推理子项中综合排名第一", "summary": "阿里通义实验室发布实时语音交互模型 Qwen-Audio-3.0-Realtime，在 Artificial Analysis 的 Speech Reasoning 子项中综合排名第一，超越 OpenAI GPT-Realtime-2。", "sourceName": "公众号：通义实验室（千问）", "sourceUrl": "https://mp.weixin.qq.com/s/hFp5rtV8-6KVRrgZoCj03A", "img": "https://mmbiz.qpic.cn/mmbiz_jpg/C7WsXj9icr61nFfYhTG3Jl9XHkE5ibrTqYuHiag5FwyjXkpfAURWBzOCuxxcsEbOknOXY7q17iaBiakcNEFU9qoC5udstP1b8GdKbedSe95Ip4jY/0?wx_fmt=jpeg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://mp.weixin.qq.com/s/hFp5rtV8-6KVRrgZoCj03A", "ci": 0, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "hfp5rtv8-6kvrrgzocj03a", "articleUrl": "articles/hfp5rtv8-6kvrrgzocj03a.html"}, {"title": "Thinking Machines 发布多模态模型 Inkling", "summary": "今天，我们推出 Inkling。 Inkling 能高效地对文本、图像和音频模态进行推理。我们将提供完整权重。 https://thinkingmachines.ai/news/introducing-inkling/ 即日起可在 Tinker 上进行微调。在 Inkling Playground 中试用。🧵", "sourceName": "X：Thinking Machines (@thinkymachines)", "sourceUrl": "https://x.com/thinkymachines/status/2077454609551921208", "img": "https://pbs.twimg.com/card_img/2077453836785246208/_3gJygpQ?format=png&amp;name=orig", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/thinkymachines/status/2077454609551921208", "ci": 0, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077454609551921208", "articleUrl": "articles/2077454609551921208.html"}, {"title": "OpenAI 发布 GPT-Red：通过自动化红队测试提升模型鲁棒性", "summary": "OpenAI 训练了自动化红队模型 GPT-Red，用于在部署前发现漏洞并在训练中生成攻击以提升模型鲁棒性。GPT-Red 能攻破此前几乎所有模型，其攻击被用于对抗训练 GPT-5.6 Sol，使该模型在直接提示注入基准测试中的失败率降至四个月前最佳生产模型的 1/6。GPT-Red 通过自对弈强化学习训练，投入了 OpenAI 后训练中前所未有的计算规模。", "sourceName": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/unlocking-self-improvement-gpt-red", "img": "https://images.ctfassets.net/kftzwdyauwt9/3ACfFRKDhuNzU4isOGxHRv/26f7f9bded23de64ea183a9ec19904c5/SEO_Card.png?w=1600&amp;h=900&amp;fit=fill", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://openai.com/index/unlocking-self-improvement-gpt-red", "ci": 0, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "unlocking-self-improvement-gpt-red", "articleUrl": "articles/unlocking-self-improvement-gpt-red.html"}, {"title": "xAI 开源 Grok Build 编程智能体与终端界面", "summary": "xAI 已将 Grok Build 的源代码在 GitHub 上开源。Grok Build 是 SpaceXAI 的编程智能体与终端用户界面（TUI），开源后用户可自行编译并完全本地运行，指向本地推理引擎并通过 `config.toml` 配置。", "sourceName": "xAI：News（网页）", "sourceUrl": "https://x.ai/news/grok-build-open-source", "img": "https://x.ai/images/news/open-source-cover.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.ai/news/grok-build-open-source", "ci": 1, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "grok-build-open-source", "articleUrl": "articles/grok-build-open-source.html"}, {"title": "Telegram 无服务器架构", "summary": "Telegram Serverless 允许开发者直接在 Telegram 基础设施上运行 Bot 和 Mini App 的后端代码，无需配置服务器或容器。开发者编写普通 JavaScript 模块，通过 `npx tgcloud push` 单命令部署，代码在靠近 Bot API 和内建数据库的轻量级 V8 隔离沙箱中执行。", "sourceName": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://core.telegram.org/bots/serverless", "img": "https://api.openverse.org/v1/images/15e3a534-b721-4500-92c6-4b4bc8a2fbda/thumb/", "imgKind": "openverse", "imgCreator": "tlaukkanen", "imgLicense": "BY", "imgSource": "https://www.flickr.com/photos/14598456@N00/5480093852", "ci": 1, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "serverless", "articleUrl": "articles/serverless.html"}, {"title": "开源编程智能体内存方案发布，通过 SSH 同步", "summary": "一个面向编程 AI 智能体的开源内存项目在 GitHub 发布，支持通过 SSH 同步记忆数据。该项目允许智能体跨会话保留上下文，无需依赖特定云服务，用户可自托管。代码已开源，便于开发者集成与定制。", "sourceName": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://github.com/vshulcz/deja-vu", "img": "https://opengraph.githubassets.com/f636f3a45126529ec57c55a4340db8e1c86adb193e2e650929060d6f3ac47288/vshulcz/deja-vu", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://github.com/vshulcz/deja-vu", "ci": 1, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "deja-vu", "articleUrl": "articles/deja-vu.html"}, {"title": "Grok Build 现已开源", "summary" na 团队）", "sourceUrl": "https://www.lmsys.org/blog/2026-07-15-inkling-day0-support", "img": "https://www.lmsys.org/blog/2026-07-15-inkling-day0-support/opengraph-image?846984fa349aff93", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://www.lmsys.org/blog/2026-07-15-inkling-day0-support", "ci": 1, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2026-07-15-inkling-day0-support", "articleUrl": "articles/2026-07-15-inkling-day0-support.html"}, {"title": "国行 Apple 智能完成备案，阿里千问将集成至苹果 AI 能力", "summary": "苹果技术开发（上海）有限公司的“Apple 智能”大模型已于 2026 年 7 月 8 日完成备案，适用场景为苹果手机。阿里千问将作为 AI 能力集成至 Apple 智能，为 iOS、iPadOS、macOS 和 visionOS 的中国用户提供文本与图像理解、内容生成等功能，用户无需在应用间切换即可直接体验。", "sourceName": "IT之家（RSS）", "sourceUrl": "https://www.ithome.com/0/977/109.htm", "img": "https://api.openverse.org/v1/images/ceaa27e3-04f5-459c-a3da-a6cde058917c/thumb/", "imgKind": "openverse", "imgCreator": "brewbooks", "imgLicense": "BY-SA", "imgSource": "https://www.flickr.com/photos/93452909@N00/2354758874", "ci": 2, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "977-1", "articleUrl": "articles/977-1.html"}, {"title": "阿里Qwen将集成至Apple Intelligence服务中国用户", "summary": "阿里巴巴的Qwen模型将被集成到Apple Intelligence中，为中国的iOS、iPadOS、macOS和visionOS用户提供文本与图像理解、内容生成等AI功能。中国网信办已公布包括Apple Intelligence、华为小艺大模型、OPPO AndesGPT在内的七项移动端生成式AI服务备案信息。阿里巴巴董事会主席蔡崇信表示，苹果在选定阿里前曾与多家中国公司洽谈。", "sourceName": "X：X.PIN (@thexpin)", "sourceUrl": "https://x.com/thexpin/status/2077346752219521469", "img": "https://pbs.twimg.com/media/HNQ32vkawAALVs2.jpg:large", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/thexpin/status/2077346752219521469", "ci": 2, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077346752219521469", "articleUrl": "articles/2077346752219521469.html"}, {"title": "Anthropic 研究：AI 智能体模拟中行为偏差", "summary": "Anthropic 新研究：2026 年夏季的智能体行为偏差。 在我们的敲诈实验一年后，我们又发现了四种当今自主 AI 智能体在模拟中行为不当的方式。 了解更多：https://alignment.anthropic.com/2026/agentic-misalignment-summer-2026/", "sourceName": "X：Anthropic (@AnthropicAI)", "sourceUrl": "https://x.com/AnthropicAI/status/2077452646303006927", "img": "https://pbs.twimg.com/media/HNSXXXaW8AAAwzp.png:large", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/AnthropicAI/status/2077452646303006927", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077452646303006927", "articleUrl": "articles/2077452646303006927.html"}, {"title": "OpenAI 用 AI 攻击自家 AI：GPT-Red 自动发现安全漏洞，成功率 84% 远超人类", "summary": "OpenAI 训练了内部 AI 模型 GPT-Red，通过自我对弈强化学习自动模拟提示词注入等攻击，在测试场景中成功率达 84%，而人类红队仅为 13%。GPT-Red 的发现直接用于训练，使 GPT-5.6 Sol 在直接提示词注入上的故障次数比四个月前的最佳模型减少六倍，且未影响通用性能。约 3.8% 的“更强”提示词注入仍能成功，GPT-Red 暂不对外开放。", "sourceName": "The Decoder：AI News（RSS）", "sourceUrl": "https://the-decoder.com/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-better-than-humans-ever-did", "img": "https://the-decoder.com/wp-content/uploads/2026/07/openai_red_Logo.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://the-decoder.com/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-better-than-humans-ever-did", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-", "articleUrl": "articles/openai-is-now-using-ai-to-attack-its-own-ai-and-its-working-.html"}, {"title": "Apple 提出 LLM 函数调用不确定性量化方法", "summary": "Apple 机器学习研究团队提出一种针对大语言模型函数调用的不确定性量化方法，旨在提升 LLM 在自主任务执行中的可靠性。该方法通过量化模型对函数调用参数和决策的置信度，帮助识别潜在错误调用。该研究目前处于学术探索阶段，未公布具体模型版本或开源计划。", "sourceName": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/uncertainty-quantification-function-calling", "img": "https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://machinelearning.apple.com/research/uncertainty-quantification-function-calling", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "uncertainty-quantification-function-calling", "articleUrl": "articles/uncertainty-quantification-function-calling.html"}, {"title": "Meta 探索分层兴趣表示以优化广告深度漏斗", "summary": "Meta 提出分层兴趣表示，一种基于 Transformer 图学习与自监督跨视图蒸馏的上游表示层，为广告实体学习统一嵌入。该系统在数十亿真实交互数据上端到端训练，输出通用嵌入和 Bag-of-Meaning 兴趣 token，旨在连接稀疏的深度漏斗信号与广告主供给。该技术可集成至 Meta 的生成式广告模型（GEM）、Andromeda 及自适应排序模型。", "sourceName": "Meta Engineering Blog（RSS）", "sourceUrl": "https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization", "img": "https://engineering.fb.com/wp-content/uploads/2026/07/image2_6a0f44.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "exploring-hierarchical-interest-representation-for-meta-ads-", "articleUrl": "articles/exploring-hierarchical-interest-representation-for-meta-ads-.html"}, {"title": "Apple 提出 CLaRa：用连续潜在推理桥接检索与生成", "summary": "Apple 机器学习研究团队提出 CLaRa，一种通过连续潜在推理桥接检索与生成的新方法。该方法在检索增强生成（RAG）中引入连续潜在空间，使模型在生成答案前先进行隐式推理，从而缓解长上下文带来的性能下降。CLaRa 在多个知识密集型基准上提升了 LLM 的准确率与效率。", "sourceName": "Apple Machine Learning Research（RSS）", "sourceUrl": "https://machinelearning.apple.com/research/clara-latent-reasoning", "img": "https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://machinelearning.apple.com/research/clara-latent-reasoning", "ci": 3, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "clara-latent-reasoning", "articleUrl": "articles/clara-latent-reasoning.html"}, {"title": "Airtap iMessage 新功能：发条短信让 AI 替你操作手机", "summary": "Airtap 推出 iMessage 新功能，用户只需给美国号码发一条 iMessage，其云手机上的 AI Agent 就能通过视觉模拟点击，替用户完成 TikTok 刷视频、星巴克点单等操作，无需安装对应 App。其架构分为三层：大脑（理解指令）、AutoPilot（视觉操控屏幕）、云手机（24小时在线）。但支付等敏感操作仍需用户手动完成，信任与授权仍是所有 Agent 厂商的难题。", "sourceName": "X：阿易 AI Notes (@AYi_AInotes)", "sourceUrl": "https://x.com/AYi_AInotes/status/2077217295504490992", "img": "https://pbs.twimg.com/amplify_video_thumb/2077216426339733504/img/-tEpGinE8zEaot-a.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://x.com/AYi_AInotes/status/2077217295504490992", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "2077217295504490992", "articleUrl": "articles/2077217295504490992.html"}, {"title": "前谷歌DeepMind研究员因公司签署无限制军事AI协议而离职", "summary": "前谷歌DeepMind研究员Alex Turner因谷歌向国土安全部出售云服务并最终签署无限制军事AI协议而离职。他曾起草25页提案要求加入禁止杀手机器人和大规模监控的合同条款，但提案被CEO转交后无人跟进。Turner指出，包括Jeff Dean和Stuart Russell在内的多位AI伦理领袖在关键时刻未能兑现承诺。", "sourceName": "Hacker News 热门（buzzing.cc 中文翻译）", "sourceUrl": "https://turntrout.com/why-i-left-google-deepmind", "img": "https://assets.turntrout.com/static/images/card_images/why-i-left-google-deepmind.jpg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://turntrout.com/why-i-left-google-deepmind", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "why-i-left-google-deepmind", "articleUrl": "articles/why-i-left-google-deepmind.html"}, {"title": "开源 LLM TODO Skill“阿福”：用 Claude Code 和 Codex 实现知识管理到排期自动化", "summary": "作者基于 API 版 Fable5 和 Codex 开发了开源 TODO Skill“阿福”，用于将收件箱中的待办资料自动转为 Markdown 任务卡，识别信息不完整项（如视频链接需通过 yt-dlp 和本地 Whisper 提取字幕），并支持批量排期、AI 分组合并、拖拽调整周视图及同步到 Mac 日历或飞书日历。项目已开源在 GitHub，安装仅需一条命令。", "sourceName": "公众号：卡尔的AI沃茨", "sourceUrl": "https://mp.weixin.qq.com/s/QcGHxKohg0gW9e84Nd_9jA", "img": "https://mmbiz.qpic.cn/sz_mmbiz_jpg/VNz1x8bH8FzJZ84ibhk3bcPwfvBibUlCRrZibDEeQBrFUWECQ7ks0noMZIRoyNyeW1J5EA0j7p8wyicKSMibecICuJNqvKDWo7YKcvh0e9jCs4pQ/0?wx_fmt=jpeg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://mp.weixin.qq.com/s/QcGHxKohg0gW9e84Nd_9jA", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "qcghxkohg0gw9e84nd_9ja", "articleUrl": "articles/qcghxkohg0gw9e84nd_9ja.html"}, {"title": "每天Vibe Coding 16小时，作者分享Fable 5与GPT-5.6 Sol的AI开发流程", "summary": "作者每天Vibe Coding约16小时，认为Claude Fable 5在大型方案初版设计上“当世独一档”，GPT-5.6 Sol能有效纠错并优化方案。核心流程为：Fable 5出方案初版 → GPT-5.6 Sol审查纠错 → 在Codex中开启“目标模式”全自动化执行，最长曾连续运行17小时。", "sourceName": "公众号：数字生命卡兹克", "sourceUrl": "https://mp.weixin.qq.com/s/wm_LM83gyLM-auidBxprZw", "img": "https://mmbiz.qpic.cn/mmbiz_jpg/2jjfQoZLoqWTQ6vq93nGzHibhXwBKTYHa8GjVRoTRkCIIhZSzZhJFMPJEVHvY2JHdIR42wSRdRtyjHrOImGtYib1xL1JzpCo2W3k8LYCpuf44/0?wx_fmt=jpeg", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://mp.weixin.qq.com/s/wm_LM83gyLM-auidBxprZw", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "wm_lm83gylm-auidbxprzw", "articleUrl": "articles/wm_lm83gylm-auidbxprzw.html"}, {"title": "OpenAI 呼吁通过“反向联邦主义”推动美国 AI 安全标准统一", "summary": "OpenAI 首席全球事务官 Chris Lehane 发文，主张通过“反向联邦主义”——即各州先通过相似立法形成事实上的国家标准——来推动美国 AI 前沿安全治理。加州、纽约州和伊利诺伊州已通过相关立法，核心要素包括风险披露、安全事故报告和独立审计。联邦层面，特朗普政府正与专家合作制定针对最强大 AI 模型的网络测试框架，预计 8 月初完成。", "sourceName": "OpenAI：官网动态（RSS · 排除企业/客户案例）", "sourceUrl": "https://openai.com/index/advancing-ai-safety-through-state-and-federal-action", "img": "https://images.ctfassets.net/kftzwdyauwt9/C8LVPcOuyeD3G5OalCrVN/16094efa3ff169506c97c14ec2b71f8a/Frame.png?w=1600&amp;h=900&amp;fit=fill", "imgKind": "og", "imgCreator": "", "imgLicense": "", "imgSource": "https://openai.com/index/advancing-ai-safety-through-state-and-federal-action", "ci": 4, "kind": "aihot", "isoDate": "2026-07-16", "date": "7月16日 周四", "articleId": "advancing-ai-safety-through-state-and-federal-action", "articleUrl": "articles/advancing-ai-safety-through-state-and-federal-action.html"}, {"title": "Base44 为何信任 Claude Fable 5 处理最具挑战性的工程任务", "summary": "无代码开发平台 Base44 将此前仅限资深工程师处理的系统提示词重构任务交给了 Claude Fable 5。该模型在四小时内独立完成 90%-95% 的重构，并主动发现团队评估中遗漏的缓存 const content = document.getElementById('content');

// Build a single card element (shared by the latest + Old News views)
function makeCard(item, idx, ri, isExt, featured) {
  const card = document.createElement('article');
  card.className = 'card' + (featured ? ' featured' : '');
  const sum = item.summary || '';
  const cardDate = item.date || DATA.cardDate;
  let capHtml = '';
  if (item.isNew) {
    capHtml = '<span class="cover-new">NEW</span>';
  } else if (item.img && item.imgKind === 'openverse' && item.imgCreator) {
    capHtml = '<span class="cover-cap">图：' + item.imgCreator + (item.imgLicense ? ' · ' + item.imgLicense : '') + '</span>';
  } else if (item.img && item.imgKind === 'og') {
    capHtml = '<span class="cover-cap">原题图</span>';
  }
  let coverInner;
  if (item.img) {
    coverInner = '<img class="cover-img" src="' + item.img + '" alt="" loading="lazy" onerror="this.remove()">'
      + '<div class="cover-overlay"></div>'
      + '<span class="idx">#' + idx + '</span>'
      + '<span class="cover-date">' + cardDate + '</span>' + capHtml;
  } else {
    coverInner = '<span class="cover-ico">' + ICONS[ri] + '</span>'
      + '<span class="idx">#' + idx + '</span>'
      + '<span class="cover-date">' + cardDate + '</span>' + capHtml;
  }
  const aUrl = item.articleUrl || item.sourceUrl;
  const aId = item.articleId || "";
  card.innerHTML =
    '<div class="cover" style="background:var(--g' + ri + ');">' + coverInner + '</div>'
    + '<div class="body">'
    + '<h3>' + item.title + '</h3>'
    + '<p>' + sum + '</p>'
    + '<div class="actions">'
    + (aId ? '<button type="button" class="expand" data-id="' + aId + '">展開全文</button>' : '')
    + '<a class="read" href="' + aUrl + '" target="_blank" rel="noopener noreferrer">讀全文 ' + LINK_SVG + '</a>'
    + '<a class="src" href="' + item.sourceUrl + '" target="_blank" rel="noopener noreferrer">原文 ↗</a>'
    + '</div>'
    + '</div>';
  card.dataset.aid = aId;
  card.dataset.src = item.sourceUrl || "";
  return card;
}

let globalIdx = 0;
DATA.sections.forEach(function(sec, si){
  const isExt = sec.kind === 'external';
  const ri = sec.ci != null ? sec.ci : si;   /* color index, independent of position */
  const section = document.createElement('section');
  section.className = 'section' + (isExt ? ' section--ext' : '');
  section.id = 'sec-' + si;

  // visual separator before an external-source group
  if (isExt) {
    const div = document.createElement('div');
    div.className = 'group-divider';
    div.innerHTML = '<span>外部來源 · 每日監測</span>';
    content.appendChild(div);
  }

  const head = document.createElement('div');
  head.className = 'section-head' + (isExt ? ' section-head--ext' : '');
  let headHtml = '<span class="bar" style="background:var(--c' + ri + ')"></span>'
    + '<h2>' + sec.label + '</h2>';
  if (isExt) headHtml += '<span class="ext-chip">NewMobileLife 流動日報</span>';
  headHtml += '<span class="cnt">' + sec.items.length + ' 条</span>';
  head.innerHTML = headHtml;
  section.appendChild(head);

  if (isExt && sec.subtitle) {
    const sub = document.createElement('p');
    sub.className = 'section-sub';
    sub.textContent = sec.subtitle;
    section.appendChild(sub);
  }

  const grid = document.createElement('div');
  grid.className = 'grid';
  sec.items.forEach(function(item, ii){
    globalIdx++;
    grid.appendChild(makeCard(item, globalIdx, ri, isExt, ii === 0));
  });
  section.appendChild(grid);
  content.appendChild(section);
});

// ---- Old News view (items older than 5 days) ----
(function renderOld(){
  const c = document.getElementById('content-old');
  if (!DATA.old || !DATA.old.length) {
    c.innerHTML = '<p class="empty">暫無超過 5 天的舊聞。</p>';
    return;
  }
  const section = document.createElement('section');
  section.className = 'section';
  const div = document.createElement('div');
  div.className = 'group-divider';
  div.innerHTML = '<span>舊聞 Old News · 超過 5 天（' + DATA.old.length + ' 条）</span>';
  section.appendChild(div);
  const grid = document.createElement('div');
  grid.className = 'grid';
  let oi = 0;
  DATA.old.forEach(function(item){
    oi++;
    const ri = item.ci != null ? item.ci : 0;
    grid.appendChild(makeCard(item, oi, ri, false, false));
  });
  section.appendChild(grid);
  c.appendChild(section);
})();

// ---- Tab switching between latest + Old News ----
(function(){
  const tabs = document.getElementById('tabs');
  const cur = document.getElementById('view-current');
  const old = document.getElementById('view-old');
  tabs.addEventListener('click', function(e){
    const btn = e.target.closest('.tab');
    if (!btn) return;
    const v = btn.getAttribute('data-view');
    document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b === btn); });
    cur.hidden = (v !== 'current');
    old.hidden = (v !== 'old');
    if (typeof layoutMasonry === 'function') layoutMasonry();
  });
  document.getElementById('tab-cur').textContent = DATA.flat.length;
  const oldN = (DATA.old || []).length;
  document.getElementById('tab-old').textContent = oldN;
  if (oldN === 0) {
    const ob = tabs.querySelector('[data-view="old"]');
    if (ob) ob.style.display = 'none';
  }
})();

// ---- Full-page Reader (modal overlay): opens one article at a time — avoids mobile overlap ----
const reader = document.getElementById('reader');
const readerTitle = document.getElementById('reader-title');
const readerScroll = document.getElementById('reader-scroll');
const readerSrc = document.getElementById('reader-src');
const readerClose = document.getElementById('reader-close');

function openReader(card) {
  const id = card.dataset.aid;
  if (!id) return;
  const h3 = card.querySelector('h3');
  readerTitle.textContent = (h3 ? h3.textContent : '') || (DATA.reportHuman + ' AI 日报');
  const body = (window.ARTICLES && window.ARTICLES[id]) || '';
  readerScroll.innerHTML = body ||
    '<p class="notice">原文非中文，未提供本地譯文，請見「原文」連結。</p>';
  readerSrc.href = card.dataset.src || '#';
  reader.hidden = false;
  document.body.style.overflow = 'hidden';
  readerScroll.scrollTop = 0;
}
function closeReader() {
  reader.hidden = true;
  document.body.style.overflow = '';
  readerScroll.innerHTML = '';
}

// Open the reader when: (a) the 展開全文 button is tapped, or (b) anywhere on the card
// is tapped except on the links/buttons (讀全文 / 原文). Only one reader is shown at a time,
// so switching cards restores the previous card to its normal size automatically.
document.addEventListener('click', function(e){
  if (reader.contains(e.target)) return;            // clicks inside the reader handled below
  const expandBtn = e.target.closest('.expand');
  if (expandBtn) { const c = expandBtn.closest('.card'); if (c) openReader(c); return; }
  const card = e.target.closest('.card');
  if (card && !e.target.closest('a, button')) openReader(card);
});
readerClose.addEventListener('click', closeReader);
reader.addEventListener('click', function(e){ if (e.target === reader) closeReader(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !reader.hidden) closeReader(); });

// Masonry: set each card's row span from its rendered height (variable sizes, order preserved)
function layoutMasonry(){
  const gap = 20, unit = 8;
  document.querySelectorAll('.card').forEach(function(c){
    const h = c.getBoundingClientRect().height;
    c.style.gridRowEnd = 'span ' + Math.ceil((h + gap) / (unit + gap));
  });
}
layoutMasonry();
window.addEventListener('resize', function(){ clearTimeout(window.__mt); window.__mt = setTimeout(layoutMasonry, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutMasonry);
