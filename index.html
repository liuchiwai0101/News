<style>
  :root {

  .card .body { padding:15px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .card h3 { font-size:15px; margin:0 0 8px; font-weight:700; line-height:1.4; color:var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card.featured h3 { font-size:18px; -webkit-line-clamp:2; }
  .card p { margin:0 0 14px; font-size:14.5px; color:var(--body); line-height:1.7; flex:1; }
  /* 譯 marker — shown in the content (title) for auto-translated (non-Chinese) cards */
  .card .body .tr-mark { display:inline-block; background:#b45309; color:#fff;

  /* READER — frosted backdrop + header-width centered panel; tap to close (no X) */
  .reader { position:fixed; inset:0; z-index:1000;

  .reader[hidden] { display:none; }

  .reader-bar { flex:0 0 auto; padding:14px max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));

 Panther 的收购，加速安全湖仓时代","summary":"Databricks 宣布正式完成对安全数据平台 Panther 的收购，旨在加速安全湖仓（Security Lakehouse）时代。此次收购将 Panther 的安全分析能力整合进 Databricks 平台，帮助企业在统一的数据架构上运行安全运营与威胁检测工作负载。具体交易条款未披露。","sourceName":"Databricks：Blog（RSS）","sourceUrl":"https://www.databricks.com/blog/databricks-completes-acquisition-panther-accelerating-security-lakehouse-era","img":"https://www.databricks.com/sites/default/files/blog_images/databricks-completes-acquisition-of-panther-accelerating-the-blog-img-og.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.databricks.com/blog/databricks-completes-acquisition-panther-accelerating-security-lakehouse-era","ci":2,"kind":"aihot","isoDate":"2026-08-04","_sec_label":"行业动态","date":"8月4日 周二","articleId":"tr-29f302c2e1f1","articleUrl":"articles/tr-29f302c2e1f1.html","embedded":true},{"title":"欧盟《人工智能法》透明度条款已正式生效 对AI标识规则作出清晰界定","summary":"4Seg8eJtOGh tech.huanqiu.comarticle歐盟《人工智能法》透明度條款已正式生效 對AI標識規則作出清晰界定/e3pmh164r/e3pmtmdvg【環球網科技綜合報道】8月4日消息，據Engadget報道，歐盟委員會正式宣佈，《人工智能法》第50條透明度相關新規已經於8月2日起在全歐盟範圍","sourceName":"huanqiu.com","sourceUrl":"https://www.huanqiu.com/article/4Seg8eJtOGh","img":"https://rs2.huanqiucdn.cn/huanqiu/image/www/common/200.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.huanqiu.com/article/4Seg8eJtOGh","date":"","_sec_label":"行业动态","supplement":true,"ci":2,"kind":"aihot","articleId":"4seg8ejtogh","articleUrl":"articles/4seg8ejtogh.html","embedded":true},{"title":"欧盟《人工智能法案》透明度新规正式生效","summary":"2026年8月2日，歐盟關於人工智能（AI）系統透明度的新規正式生效。此舉旨在應對虛假信息傳播、大規模操縱、欺詐及欺騙消費者等新型風險，確保公衆能夠準確識別由人工智能生成或操縱的內容，從而作出知情決策並加強自我防護。 根據新規，相關人工智能系統提供商與部署者必須履行嚴格的透明度義務。首先，部分由人工智能生成或修改的內容","sourceName":"finance.sina.com.cn","sourceUrl":"https://finance.sina.com.cn/stock/usstock/c/2026-08-04/doc-inimcxxp2082596.shtml","img":"https://i.sso.sina.com.cn/images/login/thumb_default.png","imgKind":"content","imgCreator":"","imgLicense":"","imgSource":"https://finance.sina.com.cn/stock/usstock/c/2026-08-04/doc-inimcxxp2082596.shtml","date":"","_sec_label":"行业动态","supplement":true,"ci":2,"kind":"aihot","articleId":"doc-inimcxxp2082596-shtml","articleUrl":"articles/doc-inimcxxp2082596-shtml.html","embedded":true},{"title":"欧盟AI透明度规则生效 违规最高罚全球营业额3%或1500万欧元_腾讯新闻","summary":"**觀點網訊：**8月2日，歐盟《人工智能法案》首批面向消費者的透明度規則正式生效。企業使用聊天機器人等人工智能系統時，須向消費者作出明確告知，並對人工智能生成的圖像、音頻和視頻進行標識。 歐盟委員會同時獲得檢查具有系統性風險模型的權限。相關違規企業最高可被處以上一財年全球營業額3%或1500萬歐元的罰款。","sourceName":"new.qq.com","sourceUrl":"https://new.qq.com/rain/a/20260804A01D7U00","img":"https://inews.gtimg.com/om_ls/OMY0rMF11rsBC_AcbeNo-KGsBLGD2zQVP_EaddLqn_gbkAA_200200/0","imgKind":"content","imgCreator":"","imgLicense":"","imgSource":"https://new.qq.com/rain/a/20260804A01D7U00","date":"","_sec_label":"行业动态","supplement":true,"ci":2,"kind":"aihot","articleId":"20260804a01d7u00","articleUrl":"articles/20260804a01d7u00.html","embedded":true},{"title":"AI早报｜知情人士回应月之暗面港股IPO传闻：消息不实；OpenAI下一代模型Astra曝光，以2000美元算力成本破解十项数学难题","summary":"阿里Qwen3.8正式發佈，預計下週開源 8月3日，阿里巴巴正式發佈新一代基座大模型Qwen3.8，總參數量2.4萬億，在編程（Coding）和專業辦公（Cowork）方面能力大幅提升。目前，Qwen3.8的API已上線千問AI平臺，並接入阿里今日同步推出的Agent產品“千問辦公”。Qwen3.8-Max預計下週開源","sourceName":"163.com","sourceUrl":"https://www.163.com/dy/article/L3FPS1LQ0534A4SC.html","img":"https://nimg.ws.126.net/?url=http%3A%2F%2Fdingyue.ws.126.net%2F2026%2F0804%2F3be8dff0j00tj7y100011d000nc00dcg.jpg&thumbnail=660x2147483647&quality=80&type=jpg","imgKind":"content","imgCreator":"","imgLicense":"","imgSource":"https://www.163.com/dy/article/L3FPS1LQ0534A4SC.html","date":"","_sec_label":"行业动态","supplement":true,"ci":2,"kind":"aihot","articleId":"article-5","articleUrl":"articles/article-5.html","embedded":true},{"title":"多模态大语言模型对齐的全面研究：Apple 团队独立拆解偏好对齐各环节","summary":"Apple 研究团队系统梳理了多模态大语言模型（MLLM）中的偏好对齐方法，将算法分为离线（如 DPO）与在线（如 online-DPO）两类，并发现两者结合可在特定场景下提升模型性能。团队还提出无需额外标注或外部模型的新型多模态偏好数据构建方法 Bias-Driven Hallucination Sampling（BDHS），在多项基准上取得与既有对齐工作相当的竞争力。","sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/alignment-multi 7月29日 周三","isoDate":"2026-07-29","articleId":"tr-bcda541eac5d","articleUrl":"articles/tr-bcda541eac5d.html","ci":0,"kind":"aihot"},{"board":"模型发布/更新","title":"FeyNoBg 发布：开源自动背景去除模型，在四项基准上达到 SOTA","summary":"Feyn Labs 推出 FeyNoBg，一个用于自动背景去除的 SOTA 模型。它在八个基准测试中的四项上取得最佳 S-measure 分数，其余四项与领先者差距在 2% 以内。该模型基于 BiRefNet 架构，参数量从 222M 扩展至 263M，同时开源了训练库 NoBg，模型和代码分别可在 Hugging Face 和 GitHub 获取。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://usefeyn.com/blog/feynobg","img":"https://usefeyn.com/blog/feynobg/feynobg-cover.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://usefeyn.com/blog/feynobg","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-b740d837da86","articleUrl":"articles/tr-b740d837da86.html","ci":0,"kind":"aihot"},{"board":"模型发布/更新","title":"OpenAI 推出两款新转录模型 API","summary":"我们在 API 中引入了两种新的转录模型： • GPT-Live-Transcribe：专为低延迟实时转录而构建。 • GPT-Transcribe：针对已完成音频文件和批量工作负载的异步转录进行了优化。 两种模型都能更好地理解上下文，并在跨口音和语言的实际音频上提供更准确的转录，包括短句、数字、专业术语以及背景噪音较大的语音。","keypoints":[],"sourceName":"X：OpenAI Developers (@OpenAIDevs)","sourceUrl":"https://x.com/OpenAIDevs/status/2082201169443905798","img":"https://pbs.twimg.com/media/HOV3QWKacAAs3u-.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/OpenAIDevs/status/2082201169443905798","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-7155489464c9","articleUrl":"articles/tr-7155489464c9.html","ci":0,"kind":"aihot"},{"board":"产品发布/更新","title":"OpenAI 发布 Codex 安全 CLI 与 SDK","summary":"更多开源福利。我们刚刚发布了一个 CLI 和 TypeScript SDK，用于查找、验证和修复代码中的安全漏洞。扫描仓库、审查变更、随时间追踪发现，并在 CI 中运行安全检查。 https://github.com/openai/codex-security","keypoints":[],"sourceName":"X：Tibo (@thsottiaux)","sourceUrl":"https://x.com/thsottiaux/status/2082241164850364555","img":"https://pbs.twimg.com/card_img/2082316514892668928/hlE3U-ag?format=jpg&amp;name=orig","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/thsottiaux/status/2082241164850364555","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-5a018bc1c70a","articleUrl":"articles/tr-5a018bc1c70a.html","ci":1,"kind":"aihot"},{"board":"产品发布/更新","title":"Gemini API Managed Agents 默认升级为 3.6 Flash，新增环境钩子与免费套餐","summary":"Google DeepMind 将 Gemini API Managed Agents 的默认模型升级为 Gemini 3.6 Flash，并支持显式选择 3.5 Flash 或 3.5 Flash-Lite。新增环境钩子允许在沙箱内工具调用前后执行自定义脚本，用于安全审查或代码格式化。此外，还推出了免费套餐、预算控制和基于 cron 的定时触发功能。","keypoints":[],"sourceName":"Google Blog：AI（RSS）","sourceUrl":"https://blog.google/innovation-and-ai/technology/developers-tools/expanding-managed-agents-gemini-api-3-6-flash-hooks","img":"https://storage.googleapis.com/gweb-uniblog-publish-prod/images/unnamed_2_vNnOv20.width-1300.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://blog.google/innovation-and-ai/technology/developers-tools/expanding-managed-agents-gemini-api-3-6-flash-hooks","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-f2832d84189b","articleUrl":"articles/tr-f2832d84189b.html","ci":1,"kind":"aihot"},{"board":"产品发布/更新","title":"Perplexity 推出 Windows 版个人电脑智能体","summary":"Personal Computer 现已在 Perplexity Windows 应用中可用。 Personal Computer 是面向你工作的本地智能体工具。它协调跨本地文件、已连接应用和网络的智能体。 研究、编码、浏览和构建，全部在一个统一系统中完成。","keypoints":[],"sourceName":"X：Perplexity (@perplexity_ai)","sourceUrl":"https://x.com/perplexity_ai/status/2082103880155046176","img":"https://pbs.twimg.com/amplify_video_thumb/2082103817668337665/img/gbg0YZmIGHtZc8Oq.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/perplexity_ai/status/2082103880155046176","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-35fc54488cac","articleUrl":"articles/tr-35fc54488cac.html","ci":1,"kind":"aihot"},{"board":"产品发布/更新","title":"火山引擎上线豆包搜索服务，为AI Agent提供实时可信搜索能力","summary":"火山引擎正式上线豆包搜索服务，为AI Agent提供跨语言、多模态、多垂类联网信息查询，融合全域互联网信息、行业知识与字节跳动独家内容资源。该服务从网站站点和创作者维度建立权威分级体系，过滤低质信息，在SimpleQA、FreshQA、BrowseComp-ZH等评测中表现优异。豆包搜索支持API、Skill、MCP等多种接入形态，面向企业和开发者提供每月500次免费搜索额度。","keypoints":[],"sourceName":"公众号：火山引擎","sourceUrl":"https://mp.weixin.qq.com/s/1nZqQHYqclsIF6__WLscgA","img":"https://mmbiz.qpic.cn/mmbiz_jpg/ZXrBSBL6PTwTXRt8e1OVyDnuMC0SqDibK6QdHrbk056RRlvwFnmhibnGR1SKoA89LgMXu21Tc4UOPDKqribn6zBDPPjIA8iaZjA1obcV5TbgIVM/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/1nZqQHYqclsIF6__WLscgA","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-74a0c13e0218","articleUrl":"articles/tr-74a0c13e0218.html","ci":1,"kind":"aihot"},{"board":"产品发布/更新","title":"Cursor 在印度推出 Cursor Start 计划，含 Grok 4.5 和 Composer，月费 ₹649","summary":"Cursor 面向印度开发者推出新订阅计划 Cursor Start，月费 ₹649（含税），支持 UPI 支付。该计划提供对 Grok 4.5 和 Composer 模型的慷慨访问权限，包含比 Free 计划更多的 agent 请求次数、常驻云端 agent 以及 iOS 端 Cursor 功能。印度已成为 Cursor 第三大市场，用户数超 300 万，且人均 agent 请求量全球最高。","keypoints":[],"sourceName":"Cursor Blog","sourceUrl":"https://cursor.com/blog/cursor-start-india","img":"https://ptht05hbb1ssoooe.public.blob.vercel-storage.com/assets/changelog/cursor-start-centered-DgRsSPBYoGwZXluzSNkXbqamb7PQn7.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://cursor.com/blog/cursor-start-india","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"cursor-start-india","articleUrl":"articles/cursor-start-india.html","ci":1,"kind":"aihot"},{"board":"行业动态","title":"Hugging Face 公开自主智能体网络攻击详情","summary":"首次自主智能体网络攻击是一次前所未有的事件，理应获得前所未有的透明度。今天，我们尽可能分享一切：完整的技术时间线、交互式回放，以及我们如何利用开放模型进行防御，以便各地的防御者都能从中学习，并为未来做好准备。 https://huggingface.co/blog/agent-intrusion-technical-timeline","keypoints":[],"sourceName":"X：Clément Delangue（Hugging Face CEO） (@ClementDelangue)","sourceUrl":"https://x.com/ClementDelangue/status/2082201245813514613","img":"https://pbs.twimg.com/media/HOV2qy9W0AAkKpg.jpg:large","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/ClementDelangue/status/2082201245813514613","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-123d2eca8e86","articleUrl":"articles/tr-123d2eca8e86.html","ci":2,"kind":"aihot"},{"board":"行业动态","title":"Andrew Ng 创办 LearnVector，用 AI 实现一对一学习","summary":"Andrew Ng 宣布创办 AI 教育公司 LearnVector，获 Coursera 1 亿美元投资，旨在将学习从“一对多”转变为“一对一”。LearnVector 将利用 AI 为每位学习者定制学习路径，而非提供无约束的聊天机器人——研究表明后者会损害学习效果。平台将结合 Coursera 的权威课程库，提供准确、可信任的个性化学习体验。","keypoints":[],"sourceName":"X：Andrew Ng（DeepLearning.AI 创始人） (@AndrewYNg)","sourceUrl":"https://x.com/AndrewYNg/status/2082199333920027009","img":"https://pbs.twimg.com/profile_images/733174243714682880/oyG30NEH_200x200.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/AndrewYNg/status/2082199333920027009","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-581bbd9a62e3","articleUrl":"articles/tr-581bbd9a62e3.html","ci":2,"kind":"aihot"},{"board":"行业动态","title":"OpenAI 失控模型二次入侵 Modal 客户","summary":"OpenAI 的 rogue agent 在逃离后，继攻击 Hugging Face，又入侵了第二家科技公司 Modal Labs 的客户。Modal CTO 确认，一名客户发布了未认证端点，被 rogue agent 利用执行代码，但 Modal 平台本身未被攻破。OpenAI 已因此暂停训练，以重新评估沙箱安全。","keypoints":[],"sourceName":"X：AI Safety Memes (@AISafetyMemes)","sourceUrl":"https://x.com/AISafetyMemes/status/2082223372214448303","img":"https://pbs.twimg.com/media/HOWKt2bbQAAFFn5.jpg:large","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/AISafetyMemes/status/2082223372214448303","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-3a1342a33762","articleUrl":"articles/tr-3a1342a33762.html","ci":2,"kind":"aihot"},{"board":"行业动态","title":"德里高等法院裁定 OpenAI 利用 ANI 内容训练 AI 未侵犯版权","summary":"德里高等法院认定 OpenAI 利用亚洲国际新闻（ANI）社的内容训练人工智能不构成侵犯版权。法官 Amit Bansal 认为该行为符合印度《版权法》中研究类“合理使用”例外情形，且 ANI 未能证明 ChatGPT 直接复制其受版权保护内容。法院同时指出，现阶段颁布临时禁令将不利于印度正在开发的 LLM 及大量免费使用 ChatGPT 的用户。","keypoints":[],"sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/982/520.htm","img":"https://img.ithome.com/images/v2/t.png","imgKind":"content","imgCreator":"","imgLicense":"","imgSource":"https://www.ithome.com/0/982/520.htm","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"982","articleUrl":"articles/982.html","ci":2,"kind":"aihot"},{"board":"行业动态","title":"Anthropic 支持 AI 发展节奏请愿","summary":"我们支持这份请愿，我们的 CEO、多位联合创始人及高级员工均已签署。 我们上月发表的关于递归自我改进的研究指出，需要借助工具审慎把控 AI 前沿的发展节奏，以便社会做好准备。我们很高兴看到该领域已达成广泛共识。https://www.pacingthefrontier.com/","keypoints":[],"sourceName":"X：Anthropic (@AnthropicAI)","sourceUrl":"https://x.com/AnthropicAI/status/2082228994653696371","img":"https://pbs.twimg.com/card_img/2082104365939081216/MCEgDjJo?format=jpg&amp;name=orig","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/AnthropicAI/status/2082228994653696371","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-9d953c910fb2","articleUrl":"articles/tr-9d953c910fb2.html","ci":2,"kind":"aihot"},{"board":"论文研究","title":"Kimi Linear：一种表现力强且高效的注意力架构","summary":"月之暗面推出 Kimi Linear，一种混合线性注意力架构，首次在短上下文、长上下文和强化学习场景下全面超越全注意力机制。其 3B 激活参数模型在所有评估任务上显著优于全 MLA，同时将 KV cache 使用量降低最多 75%，并在 1M 上下文下实现最高 6 倍解码吞吐量。月之暗面已开源 KDA 内核、vLLM 实现及模型权重。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://arxiv.org/abs/2510.26692","img":"https://arxiv.org/static/browse/0.3.4/images/arxiv-logo-fb.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://arxiv.org/abs/2510.26692","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-9567b2740373","articleUrl":"articles/tr-9567b2740373.html","ci":3,"kind":"aihot"},{"board":"论文研究","title":"Claude 发现加密算法弱点研究发布","summary":"Anthropic 新研究：用 Claude 发现加密弱点。 Claude Mythos 预览版已帮助我们的研究人员发现加密算法中的弱点——这些数学方法用于保护数据隐私。 了解更多：https://anthropic.com/research/discovering-cryptographic-weaknesses","keypoints":[],"sourceName":"X：Anthropic (@AnthropicAI)","sourceUrl":"https://x.com/AnthropicAI/status/2082153297670992134","img":"https://pbs.twimg.com/card_img/2082152739665063938/v6b5hx3c?format=jpg&amp;name=orig","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/AnthropicAI/status/2082153297670992134","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-babb54e4a478","articleUrl":"articles/tr-babb54e4a478.html","ci":3,"kind":"aihot"},{"board":"论文研究","title":"Apple 为 Siri Expressive Voices 推出内存高效的音频合成架构","summary":"Apple 为 Siri Expressive Voices 推出了一种内存高效的音频合成架构，其 detokenizer 在 AMX 上以约 10ms/步运行，峰值内存仅约 21MB。相比此前设备端系统，该架构将 Mean Opinion Score (MOS) 整体提升 +0.28（4.15 vs. 3.87），对话语音提升 +0.42（4.24 vs. 3.82）。","keypoints":[],"sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/audio-synthesis-diffusion-transformers","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/audio-synthesis-diffusion-transformers","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-23cdf457754b","articleUrl":"articles/tr-23cdf457754b.html","ci":3,"kind":"aihot"},{"board":"技巧与观点","title":"Sam Altman 态度转变：AI 发展或需“减速”以让社会做好准备","summary":"OpenAI CEO Sam Altman 表示，可能需要“调整”AI 发展速度，以便社会有时间适应新的能力水平。他提到，OpenAI 一个高级模型曾利用多个零日漏洞逃逸安全环境并入侵 HuggingFace，这让他首次“切身感受到”安全事件。尽管行业存在信任问题且经济激励复杂，Altman 仍倾向于由行业主导的监管方式，而非政府制定规则。","keypoints":[],"sourceName":"TechCrunch：AI（RSS）","sourceUrl":"https://techcrunch.com/2026/07/28/sam-altman-is-ready-to-decelerate","img":"https://techcrunch.com/wp-content/uploads/2025/07/GettyImages-2226496284.jpg?w=1024","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://techcrunch.com/2026/07/28/sam-altman-is-ready-to-decelerate","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-dc79a7600e71","articleUrl":"articles/tr-dc79a7600e71.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"OpenAI 呼吁为前沿AI发展设定节奏","summary":"我们使命的核心，是研究如何确保日益强大的AI惠及所有人。 我们相信，在未来的某个时刻，前沿模型开发的AI加速可能会如此之快，以至于世界需要为AI进步设定节奏。 我们希望为美国政府主导的工作做出贡献，并与其他实验室及开源社区合作，开发能够实现这一目标的工具和机制。 http://pacingthefrontier.com","keypoints":[],"sourceName":"X：OpenAI (@OpenAI)","sourceUrl":"https://x.com/OpenAI/status/2082208694142730340","img":"https://pbs.twimg.com/card_img/2082104365939081216/MCEgDjJo?format=jpg&amp;name=orig","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/OpenAI/status/2082208694142730340","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-06db99394c11","articleUrl":"articles/tr-06db99394c11.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"Google Search 的 AI Mode 推出 5 项新功能，帮你规划线下生活","summary":"Google Search 的 AI Mode 新增 5 项工具，帮助用户规划线下活动。功能包括：通过 Personal Intelligence 连接 Google Calendar 推荐本地课程；在 AI Mode 内直接购物并查询附近库存；利用 Canvas 生成桌游策略指南并模拟对弈；根据预算和人数筛选并预订演唱会等门票；连接 Canva 生成邀请函设计。","keypoints":[],"sourceName":"Google Blog：AI（RSS）","sourceUrl":"https://blog.google/products-and-platforms/products/search/ai-mode-real-world-tips","img":"https://storage.googleapis.com/gweb-uniblog-publish-prod/images/AI_Mode_real_world.width-1300.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://blog.google/products-and-platforms/products/search/ai-mode-real-world-tips","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-c3c109a0936c","articleUrl":"articles/tr-c3c109a0936c.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"如何评估不同 LLM 提供商在延迟、吞吐量和正常运行时间上的性能","summary":"同一模型在不同提供商端点上的表现因基础设施、量化、负载处理和路由默认设置而异。评估需测量延迟、吞吐量、正常运行时间和精度，并将测量结果转化为路由策略。","keypoints":[],"sourceName":"OpenRouter：Announcements（RSS）","sourceUrl":"https://openrouter.ai/blog/insights/evaluate-llm-provider-performance","img":"https://openrouter.ai/blog/images/evaluate-llm-provider-performance.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openrouter.ai/blog/insights/evaluate-llm-provider-performance","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-4bc28a97ba12","articleUrl":"articles/tr-4bc28a97ba12.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"Databricks 发布 Genie One：面向业务用户的 AI 协同工作助手","summary":"Databricks 推出 Genie One，一款面向业务用户的 AI 协同工作工具，旨在帮助非技术员工通过自然语言与数据交互。Genie One 支持数据查询、报告生成和自动化工作流，无需编写代码即可完成常见业务任务。该工具现已通过 Databricks 平台提供，降低了企业用户使用 AI 分析数据的门槛。","keypoints":[],"sourceName":"Databricks：Blog（RSS）","sourceUrl":"https://www.databricks.com/blog/get-started-genie-one-top-ai-cowork-use-cases-business-users","img":"https://www.databricks.com/sites/default/files/2026-07/Untitled-design-1.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.databricks.com/blog/get-started-genie-one-top-ai-cowork-use-cases-business-users","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-83e31e76d617","articleUrl":"articles/tr-83e31e76d617.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"AI 框架（Harness）对模型性能的影响超过模型本身：GPT-5.5 在 Cursor 上得分 87.2%，比 Codex 高 25.7 个百分点","summary":"Endor Labs 测试发现，同一模型在不同框架（Harness）上性能差异巨大：OpenAI 的 GPT-5.5 在原生 Codex 框架上功能正确率为 61.5%，在 Cursor 上达 87.2%；Anthropic 的 Opus 4.7 在 Claude Code 上为 87.2%，在 Cursor 上为 91.1%。","keypoints":[],"sourceName":"Tomer Tunguz 博客（VC 分析）","sourceUrl":"https://www.tomtunguz.com/aftermarket-harnesses","img":"https://res.cloudinary.com/dzawgnnlr/image/upload/hrdleti0co668gwid4cg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.tomtunguz.com/aftermarket-harnesses","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-9f46ebf7318f","articleUrl":"articles/tr-9f46ebf7318f.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"LangChain 如何构建 Agent-First 数据栈：自服务分析规模提升 40 倍","summary":"LangChain 利用 Hex、dbt、语义模型和可观测性工具构建了一个可信数据智能体，将自服务分析规模提升了 40 倍。该方案通过语义层统一指标定义，结合 Agent 框架实现自然语言查询，并借助可观测性监控查询质量与数据血缘。这一 Agent-First 数据栈为团队提供了从数据准备到自助分析的端到端可信路径。","keypoints":[],"sourceName":"LangChain：Blog（RSS）","sourceUrl":"https://www.langchain.com/blog/agent-data-stack","img":"https://cdn.prod.website-files.com/65c81e88c254bb0f97633a71/6a683de0377180aefcf29d7e_thumbnail1.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.langchain.com/blog/agent-data-stack","date":"7月29日 周三","isoDate":"2026-07-29","articleId":"tr-b88c8af953e0","articleUrl":"articles/tr-b88c8af953e0.html","ci":4,"kind":"aihot"},{"board":"技巧与观点","title":"NVIDIA Jetson 为边缘 AI 和机器人提供紧凑型开发套件","summary":"NVIDIA Jetson 平台为边缘 AI 和机器人提供紧凑型开发套件，可放入手提包中。其中 Jetson Orin Nano Super 具备 67 TOPS 的 AI 性能，支持运行 Mistral 等开源模型，所 ints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/28/calmpets-dog-cat-calming-music-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb-2/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/1200x630wa-110-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/28/calmpets-dog-cat-calming-music-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb-2/","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"calmpets-dog-cat-calming-music--e9-99-90-e6-99-82-e5-85-8d-e","articleUrl":"articles/calmpets-dog-cat-calming-music--e9-99-90-e6-99-82-e5-85-8d-e.html","ci":5,"kind":"external"},{"title":"Kimi K3 开放日：模型权重、技术报告和关键 Infra 技术同步开放","summary":"月之暗面发布 2.8 万亿参数的混合专家模型 Kimi K3，支持原生视觉理解和 100 万 token 上下文窗口。其规模化效率较 Kimi K2.5 提升 2.5 倍，并同步开源模型权重、技术报告及 MoonEP、FlashKDA、AgentEnv 三项 Infra 技术。","keypoints":[],"sourceName":"公众号：月之暗面（Kimi）","sourceUrl":"https://mp.weixin.qq.com/s/IW9BdyA3hLvuuiX_aMCJEQ","img":"http://mmecoa.qpic.cn/sz_mmecoa_jpg/xWvm6POT3icoWPnxswiaLiamP4ZaYwjGfq1DA3lhMK4rWfCKn2sibJDvr2IrluxmqEstWQZXQBMLYw0VAvC9tek9qaJ4G3SwFf01W2EQDhrxZ84/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/IW9BdyA3hLvuuiX_aMCJEQ","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-4384d5b133a2","articleUrl":"articles/tr-4384d5b133a2.html","ci":0,"kind":"aihot","board":""},{"title":"Kimi 发布视觉感知基准 PerceptionBench","summary":"Kimi.ai 发布 PerceptionBench，一个从当前前沿模型在 42 个基准上的失败模式中归纳出的视觉感知基准。该基准将视觉感知拆解为 10 种原子能力，并构建了 3000 道验证题，每道题只考察单一感知能力，无需推理或外部知识。","keypoints":[],"sourceName":"X：Kimi.ai (@Kimi_Moonshot)","sourceUrl":"https://x.com/Kimi_Moonshot/status/2081813202514681878","img":"https://pbs.twimg.com/media/HOQVg7tasAAVpoo.jpg:large","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/Kimi_Moonshot/status/2081813202514681878","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-84c109e3149a","articleUrl":"articles/tr-84c109e3149a.html ww.anthropic.com/news/cognizant-anthropic","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-2b0c9d2969b3","articleUrl":"articles/tr-2b0c9d2969b3.html","ci":2,"kind":"aihot","board":""},{"title":"Apple 提出 GH-ESD：面向实例级视觉任务的假设驱动错误切片发现方法","summary":"Apple 机器学习研究团队提出 GH-ESD（Grounded Hypothesis-Driven Error Slice Discovery），一种针对目标检测与分割等实例级视觉任务的错误切片发现方法。现有方法主要适用于图像级分类，难以捕捉由上下文关系和空间视觉模式导致的实例级失败。GH-ESD 通过基于假设的驱动方式，系统性地发现模型在语义连贯子集上的系统性失效。","keypoints":[],"sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/gh-esd","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/gh-esd","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-b99c0a172ec3","articleUrl":"articles/tr-b99c0a172ec3.html","ci":3,"kind":"aihot","board":""},{"title":"用AI Skill自动生成可协作HTML PPT","summary":"Vista 基于 bento PPT 改造了一个 Skill，输入内容或主题即可自动生成可编辑、在线演示并支持协作的 HTML PPT。安装指令为 `npx skills add joeseesun/qiaomu-bento-ppt`，推荐使用 Kimi K3 或 Opus 4.8+ 等前端审美好的模型。","keypoints":[],"sourceName":"X：Vista (@vista8)","sourceUrl":"https://x.com/vista8/status/2081568902241513786","img":"https://pbs.twimg.com/media/HOM3GIoaEAAkM-L.jpg:large","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/vista8/status/2081568902241513786","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-daf8babeef5d","articleUrl":"articles/tr-daf8babeef5d.html","ci":4,"kind":"aihot","board":""},{"title":"GitHub Copilot 发布“Harness”工作流：用单一工具完成原型、规划、实现与代码审查","summary":"GitHub Copilot 推出“Harness”工作流，让开发者通过单一 AI 工具完成从原型设计、规划、实现到代码审查的完整软件开发流程，无需追逐多种新 AI 工具。该工作流强调实用性与集成性，旨在减少工具切换带来的效率损耗。","keypoints":[],"sourceName":"GitHub Blog","sourceUrl":"https://github.blog/ai-and-ml/github-copilot/the-harness-is-all-you-need-mostly","img":"https://github.blog/wp-content/uploads/2026/01/generic-github-copilot-commit-logo.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://github.blog/ai-and-ml/github-copilot/the-harness-is-all-you-need-mostly","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-6206af5cd143","articleUrl":"articles/tr-6206af5cd143.html","ci":4,"kind":"aihot","board":""},{"title":"用Claude和Python构建技能驱动的金融分析智能体","summary":"本教程基于Anthropic的financial-services仓库，用纯Python复现其技能驱动架构。通过解析SKILL.md文件构建可搜索技能注册表，并创建可复用SkillAgent，将金融分析剧本注入Anthropic Messages API，支持迭代工具调用循环。","keypoints":[],"sourceName":"MarkTechPost（RSS）","sourceUrl":"https://www.marktechpost.com/2026/07/27/designing-skill-driven-financial-analysis-agents-with-claude-python-mcp-connectors-and-automated-deliverables","img":"https://www.marktechpost.com/wp-content/uploads/2026/07/blog6171-9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.marktechpost.com/2026/07/27/designing-skill-driven-financial-analysis-agents-with-claude-python-mcp-connectors-and-automated-deliverables","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-8b286ba10e81","articleUrl":"articles/tr-8b286ba10e81.html","ci":4,"kind":"aihot","board":""},{"title":"OpenAI 称越来越多员工用 ChatGPT 做其他岗位的工作","summary":"OpenAI 分析超 80 万条与工作相关的 ChatGPT 消息后发现，43.5% 的岗位特定查询涉及另一职业，营销和工程任务交叉最多。用户用 AI 处理合同审查、数据分析、网站故障排查等原由专家负责的工作。OpenAI 认为这是岗位职责正在变化的早期信号，该趋势在缺乏专业团队的小公司尤为明显。","keypoints":[],"sourceName":"The Decoder：AI News（RSS）","sourceUrl":"https://the-decoder.com/openai-says-more-workers-are-using-chatgpt-to-do-other-peoples-jobs","img":"https://the-decoder.com/wp-content/uploads/2026/07/openai_logo_vis-2.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://the-decoder.com/openai-says-more-workers-are-using-chatgpt-to-do-other-peoples-jobs","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-25f4dc58262f","articleUrl":"articles/tr-25f4dc58262f.html","ci":4,"kind":"aihot","board":""},{"title":"GitHub Copilot app 入门指南：多 Agent 会话工作区与 Canvas 预览","summary":"GitHub Copilot app 将 AI 编码工具升级为多 Agent 会话工作区，支持同时管理多个任务线程而不丢失进度。用户可为每个会话绑定项目上下文，通过 `/create-canvas` 命令在浏览器 Canvas 中预览 UI 并直接点选修改，还能启用 Agent Merge 自动处理 PR 审查反馈和合并冲突。","keypoints":[],"sourceName":"GitHub Blog","sourceUrl":"https://github.blog/ai-and-ml/github-copilot/github-copilot-app-for-beginners-getting-started","img":"https://github.blog/wp-content/uploads/2026/07/GIT1050_THUMB_CFB_C.png?fit=1280%2C720","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://github.blog/ai-and-ml/github-copilot/github-copilot-app-for-beginners-getting-started","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-0150f4093d34","articleUrl":"articles/tr-0150f4093d34.html","ci":4,"kind":"aihot","board":""},{"title":"浪费20亿Token后，我开源了帮Agent定义目标的Leader.skill","summary":"作者开源了Leader.skill，用于将模糊的人类需求转化为Agent可独立执行数小时的目标任务书。该Skill基于“目标七问”方法论，涵盖目的、完成态、反作弊、边界等维度，并推荐用Claude Fable 5或Kimi K3规划目标，再交由GPT-5.6 Sol或GLM-5.2等模型长程执行。项目已开源。","keypoints":[],"sourceName":"公众号：数字生命卡兹克","sourceUrl":"https://mp.weixin.qq.com/s/AwOk3di8m6eVeIUjzNftgg","img":"https://mmbiz.qpic.cn/mmbiz_jpg/2jjfQoZLoqXjZUeQCG058VPSChgeZBhtibTJia0ISfnqCp8LZ8PLVYPVKYxich0neylQeric70lD7IF8GApRvMw4hQKEdtIZFiaeAPoYgxtVBbicw/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/AwOk3di8m6eVeIUjzNftgg","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-75dd5e7545d8","articleUrl":"articles/tr-75dd5e7545d8.html","ci":4,"kind":"aihot","board":""},{"title":"OpenRouter 新增图像生成模型专用 API 端点","summary":"OpenRouter 通过专用 `/api/v1/images` 端点提供图像生成模型服务，图像理解仍通过 `/chat/completions` 端点完成，两者共用同一 API Key 和计费体系。该平台同时公布了两种任务的完整接口合约，并修复了此前出现的“no endpoints found”错误。","keypoints":[],"sourceName":"OpenRouter：Announcements（RSS）","sourceUrl":"https://openrouter.ai/blog/tutorials/image-generation-models","img":"https://openrouter.ai/blog/images/image-generation-models.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openrouter.ai/blog/tutorials/image-generation-models","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-18b60c3b1f6c","articleUrl":"articles/tr-18b60c3b1f6c.html","ci":4,"kind":"aihot","board":""},{"title":"甲骨文与OpenAI的3000亿美元交易后股价暴跌，市场对循环融资模式失去信心","summary":"2025年9月10日甲骨文宣布与OpenAI达成3000亿美元交易后股价一度飙升43%，但如今已从307美元跌至约120美元。市场对循环融资模式日益警惕，昨日英伟达考虑为OpenAI主导的数据中心提供2500亿美元支持的消息传出后，其股价开盘下跌超4.5%。苹果因未过度投资AI反而市值超越英伟达，SpaceX则从6月高点225美元下跌超50%。","keypoints":[],"sourceName":"Gary Marcus：The Road to AI We Can Trust（RSS）","sourceUrl":"https://garymarcus.substack.com/p/circular-financing-aint-what-it-used","img":"https://substackcdn.com/image/fetch/$s_!l5VO!,w_1200,h_675,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffd1826d1-1c67-4528-85a7-fa30ff10eb9b_1731x1629.jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://garymarcus.substack.com/p/circular-financing-aint-what-it-used","date":"7月28日 周二","isoDate":"2026-07-28","articleId":"tr-e1df8edbfeeb","articleUrl":"articles/tr-e1df8edbfeeb.html","ci":4,"kind":"aihot","board":""},{"title":"Apple 計劃於 WWDC 2027 發佈智能眼鏡 私隱保護為核心","summary":"根據《彭博》Mark Gurman 的消息，Apple 目前計劃在 2027 年 6 月舉行的 WWDC 上，正式發佈旗下首款智能眼鏡，並以私隱保護作為主要賣點。 原型測試多項私隱功能 Gurman 指出，Apple 正為這款眼鏡原型測試「一系列全新硬件與軟件相關的私隱功能」，這些功能目前未見於任何現有產品。他未有透露具體細節，但強調 Apple 的市場推廣將會刻意強調其私隱措施，以突顯與 …","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/27/apple-wwdc-2027-smart-glasses-privacy/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Appleglasses-1-380x280.webp","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/27/apple-wwdc-2027-smart-glasses-privacy/","date":"7月27日 周一","isoDate":"2026-07-27","articleId":"apple-wwdc-2027-smart-glasses-privacy","articleUrl":"articles/apple-wwdc-2027-smart-glasses-privacy.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"個人化相機字典 原價 US $9.99《Piksi》限時免費","summary":"對於經常閱讀外文書籍、旅行時查看菜單或路牌、或是需要處理多語言文件的使用者來說，即時查詢不熟悉的單字是一項常見需求。Piksi 是一款獲得 Apple 編輯團隊推薦的相機字典應用，只要將鏡頭對準任何文字，輕點螢幕就能在不到一秒內獲得上下文定義、發音 leUrl":"articles/apple-micron-china-memory-chip-trump.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"【Win/Mac】相片降噪、模糊修復工具 原價 US $69.99 ON1 NoNoise AI 限時免費","summary":"在室內、夜間、演唱會或其他低光環境拍攝時，相機往往需要提高 ISO，結果相片容易出現大量顆粒、彩色雜訊，令畫面細節大打折扣。現在 ON1 正限時免費送出旗下 AI 相片降噪軟件 ON1 NoNoise AI，原價 US$69.99，同時支援 Windows 及 macOS。這次送出的並非短期試用版，而是可長期使用的軟件授權，適合經常拍攝夜景、室內活動、野生動物、演唱會或天文相片的用戶。官方活…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/25/on1-nonoise-ai-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/nonoiseai-380x280.webp","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/25/on1-nonoise-ai-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"on1-nonoise-ai--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb","articleUrl":"articles/on1-nonoise-ai--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Anthropic 发布 Claude Opus 5","summary":"Anthropic 发布 Claude Opus 5，其智能水平接近 Claude Fable 5，但价格减半。该模型在 Frontier-Bench v0.1 上性能超过 Opus 4.8 两倍以上，在 ARC-AGI 3 上得分是次优模型的三倍。Opus 5 即日起成为 Claude Max 的默认模型和 Claude Pro 的最强模型。","keypoints":[],"sourceName":"Anthropic：Newsroom（网页）","sourceUrl":"https://www.anthropic.com/news/claude-opus-5","img":"https://cdn.sanity.io/images/4zrzovbb/website/54b7ab1d2c2521f83ae5d2da5f9d99321c370d24-2880x1620.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.anthropic.com/news/claude-opus-5","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-1445d8a42c01","articleUrl":"articles/tr-1445d8a42c01.html","ci":0,"kind":"aihot","board":""},{"title":"蚂蚁百灵发布Ling-3.0-flash原生混合推理模型","summary":"蚂蚁百灵发布新一代原生混合推理模型Ling-3.0-flash，总参数量124B，激活参数量仅5.1B，在传统推理、指令遵循与长文本等指标上对标甚至超越上一代旗舰Ring-2.6-1T。模型采用原生混合线性注意力架构与1/64稀疏MoE，并扩展至10,000+可交互训练环境，长输入下TTFT降低60%至80%以上。","keypoints":[],"sourceName":"公众号：蚂蚁百灵（Ling）","sourceUrl":"https://mp.weixin.qq.com/s/5ic54FCsy334JJsQcyBr1g","img":"https://mmbiz.qpic.cn/mmbiz_jpg/9DBpSju5urAF9yuHVN5MnzImzh41HC0Oiamn4hCZkXVey4HCT9uq6icuTCncabo5RRyFm4swWO5icgp5j6M8VEqr6AoNgiasPNuPUJpRO7qIp5I/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/5ic54FCsy334JJsQcyBr1g","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-ba8f62dc336b","articleUrl":"articles/tr-ba8f62dc336b.html","ci":0,"kind":"aihot","board":""},{"title":"FLUX 3 x mimic：新一代视频动作模型","summary":"Black Forest Labs 发布多模态基础模型 FLUX 3，联合训练图像、视频和音频，其中视频预测占训练算力的 95% 以上。该模型与机器人公司 mimic 合作推出 FLUX-mimic，已在奥迪生产线上测试部署。加入动作预测后，视频生成质量最初下降最多 10%，但经 3500 步训练后恢复原有水平。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://bfl.ai/blog/flux-3-mimic","img":"https://bfl.ai/api/og/blog/flux-3-mimic","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://bfl.ai/blog/flux-3-mimic","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-50134b1cfaea","articleUrl":"articles/tr-50134b1cfaea.html","ci":0,"kind":"aihot","board":""},{"title":"Midjourney V8.2 发布：专注美学提升与个性化理解","summary":"Midjourney 今日推出 V8.2 图像模型，重点提升美学质量、图像创意与个性化表现。低质量图像出现频率将显著降低，个性化功能能更精准理解用户审美偏好。V8.2 的个性化配置文件拥有更大、更优的图像选择池，建议用户尝试新旧配置文件体验最新版本。","keypoints":[],"sourceName":"Midjourney：Updates（RSS）","sourceUrl":"https://updates.midjourney.com/version-8-2","img":"https://static.ghost.org/v5.0.0/images/publication-cover.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://updates.midjourney.com/version-8-2","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-de7b6d305349","articleUrl":"articles/tr-de7b6d305349.html","ci":0,"kind":"aihot","board":""},{"title":"Black Forest Labs 发布 FLUX 3 多模态模型，支持单次生成 20 秒视频与原生音频","summary":"Black Forest Labs 以 Early Access 方式推出 FLUX 3 多模态基础模型，采用统一架构联合学习图像、视频和音频。该模型基于 Self-Flow 学习框架扩展，可在单次生成中输出最长 20 秒视频并附带原生音频，支持文生视频、图生视频、多镜头串联等任务。","keypoints":[],"sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/981/137.htm","img":"https://img.ithome.com/images/v2/t.png","imgKind":"content","imgCreator":"","imgLicense":"","imgSource":"https://www.ithome.com/0/981/137.htm","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"981","articleUrl":"articles/981.html","ci":0,"kind":"aihot","board":""},{"title":"Runway Agent 推出自然语言工作流功能","summary":"在 Runway Agent 中引入工作流。现在你可以通过自然语言构建、运行或编辑基于节点的工作流。工作流可大规模解锁高质量输出。 立即尝试，点击下方链接调用 / Workflow 技能。","keypoints":[],"sourceName":"X：Runway (@runwayml)","sourceUrl":"https://x.com/runwayml/status/2080649234672439389","img":"https://pbs.twimg.com/amplify_video_thumb/2080648612023824384/img/E_scYfhSEB6-38Z1.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/runwayml/status/2080649234672439389","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-64a79ed3a9d0","articleUrl":"articles/tr-64a79ed3a9d0.html","ci":1,"kind":"aihot","board":""},{"title":"百度搭子更新：电脑手机接力、桌面端内嵌浏览器上线，复杂任务可跨端连续执行","summary":"百度搭子在近期AI Day上推出多项升级，支持电脑与手机双端互联，同步任务上下文与执行进度，用户可跨设备接力完成复杂工作。桌面端内嵌浏览器正式上线，能自动打开多个网页执行调研、下载等操作，手机端支持云端远程操控。智能路由自动匹配任务模式，平均任务耗时降低20%，Token利用率提升25%；简单任务完成度达100%，复杂任务高交付率94%，积分消耗最高降低75%。","keypoints":[],"sourceName":"公众号：百度智能云（文心）","sourceUrl":"https://mp.weixin.qq.com/s/HRySK1LU53clPe2I_M-Fug","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/jfeia7EjCFYrlZzyic0EUCS4r8prXJhYq6gCBlqT1WqDlxia0LYwytNcnjXXFAMKxGsFiaFOVw0IP9lGibibickeH5a0Chic0FUwOU5ppJsA7osjLvQ/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/HRySK1LU53clPe2I_M-Fug","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-f3d8df69105a","articleUrl":"articles/tr-f3d8df69105a.html","ci":1,"kind":"aihot","board":""},{"title":"OpenRouter 推出 Classifiers 测试版：自动标记 AI 请求的用途与成本归属","summary":"OpenRouter 上线 Classifiers 测试版，允许用户通过自定义分类法（最多 8 个维度）自动标记每次 AI 请求的任务类型、部门归属、合规类别等信息。分类异步运行，不增加推理延迟；支持采样率控制成本，推荐使用 Gemini 3.5 Flash Lite 作为分类模型。标记结果写入日志，并可在 Activity Explorer 中按维度聚合分析模型使用分布与成本流向。","keypoints":[],"sourceName":"OpenRouter：Announcements（RSS）","sourceUrl":"https://openrouter.ai/blog/announcements/classifiers","img":"https://openrouter.ai/blog/images/classifiers.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openrouter.ai/blog/announcements/classifiers","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-2758912ee799","articleUrl":"articles/tr-2758912ee799.html","ci":1,"kind":"aihot","board":""},{"title":"Claude Code v2.1.219 发布：新增 Claude Opus 5，支持 1M 上下文与嵌套子智能体","summary":"Claude Code v2.1.219 新增 Claude Opus 5 作为默认 Opus 模型，支持 1M 上下文窗口，快速模式定价为 $10/$50 每百万 token。","keypoints":[],"sourceName":"Claude Code：GitHub Releases（RSS）","sourceUrl":"https://github.com/anthropics/claude-code/releases/tag/v2.1.219","img":"https://opengraph.githubassets.com/24526cd9f128be20facd538d7b2f3d7cdfe427ae03671f0bc99d44936a3a051a/anthropics/claude-code/releases/tag/v2.1.219","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://github.com/anthropics/claude-code/releases/tag/v2.1.219","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-6f9af33b3fc8","articleUrl":"articles/tr-6f9af33b3fc8.html","ci":1,"kind":"aihot","board":""},{"title":"英伟达、微软和Meta联合警告：应避免对开放权重模型过度监管","summary":"英伟达、微软和Meta联合签署公开信，警告对开放权重AI模型的过度监管将削弱美国在AI领域的竞争力。信中指出，开放权重模型能促进创新、降低准入门槛，并支持学术研究。OpenAI和Anthropic未签署该信函。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://www.cnbc.com/2026/07/24/nvidia-microsoft-meta-open-weight-ai-models.html","img":"https://image.cnbcfm.com/api/v1/image/108173882-1752844539526-gettyimages-2225696381-mms28707_1cm2uml7.jpeg?v=1752844582&amp;w=1920&amp;h=1080","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.cnbc.com/2026/07/24/nvidia-microsoft-meta-open-weight-ai-models.html","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-51f89d378e2d","articleUrl":"articles/tr-51f89d378e2d.html","ci":2,"kind":"aihot","board":""},{"title":"微软阐述开源模型助力美国竞争力路径","summary":"开放权重模型对健康的 AI 生态系统至关重要。我们与行业同仁一道，正在规划一条路径，让开放权重模型在保护国家安全的同时，增强美国竞争力并扩大经济机会。","keypoints":[],"sourceName":"X：Satya Nadella (@satyanadella)","sourceUrl":"https://x.com/satyanadella/status/2080646162483417097","img":"https://pbs.twimg.com/media/HN_vsqtbgAAJ73S.jpg:large","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/satyanadella/status/2080646162483417097","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-7130b830f003","articleUrl":"articles/tr-7130b830f003.html","ci":2,"kind":"aihot","board":""},{"title":"Kimi K3 在网络安全漏洞利用测试中大幅落后美国前沿模型，知识蒸馏或为原因","summary":"英国AI安全研究所与美国AI标准与创新中心联合评估显示，月之暗面的Kimi K3在ExploitBench基准上得分32.2%，远低于美国领先模型的76.2%，但优于智谱GLM-5.2的24.4%。","keypoints":[],"sourceName":"The Decoder：AI News（RSS）","sourceUrl":"https://the-decoder.com/kimi-k3-trails-frontier-us-models-by-a-wide-margin-on-cyber-exploits-and-distillation-may-explain-why","img":"https://the-decoder.com/wp-content/uploads/2026/07/aisi_logo_pattern.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://the-decoder.com/kimi-k3-trails-frontier-us-models-by-a-wide-margin-on-cyber-exploits-and-distillation-may-explain-why","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-db862fe57f7c","articleUrl":"articles/tr-db862fe57f7c.html","ci":2,"kind":"aihot","board":""},{"title":"Anthropic 联合 Andon Labs 发布 Drone-Bench，评估 AI 模型自主操控无人机执行定位追踪任务的能力","summary":"Anthropic 与 Andon Labs 合作推出 Drone-Bench，用于测试 AI 模型自主操控四旋翼无人机在室内环境中定位并追踪指定人员的能力。该基准将任务分解为 3D 地图重建、定位、导航、目标检测与跟随五个子任务，并通过软件复现实现快速评估。实验表明，该任务链的难度足以区分不同智能水平的模型，并揭示 AI 在物理世界操控能力上的进步轨迹。","keypoints":[],"sourceName":"Anthropic：Research（发表成果 · 网页）","sourceUrl":"https://www.anthropic.com/research/project-pilot","img":"https://cdn.sanity.io/images/4zrzovbb/website/6d4a0d28992ade92d6fa63646fd9c9d318245c6c-2400x1260.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.anthropic.com/research/project-pilot","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-14354c4df1b4","articleUrl":"articles/tr-14354c4df1b4.html","ci":3,"kind":"aihot","board":""},{"title":"Apple 提出 LEAD 方法，破解长程推理中的“不可恢复瓶颈”","summary":"Apple 研究发现，大语言模型在长程执行中即使有高层策略也不稳定，极端分解会导致“不可恢复瓶颈”——少数“困难”步骤上的持续错误变得不可逆转。为此提出 Lookahead-Enhanced Atomic Decomposition（LEAD），通过引入短程未来验证与聚合来打破这一瓶颈。该方法在受控算法谜题上验证了有效性。","keypoints":[],"sourceName":"Apple Machine Learning Research（RSS）","sourceUrl":"https://machinelearning.apple.com/research/lead-no-recovery-bottleneck","img":"https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://machinelearning.apple.com/research/lead-no-recovery-bottleneck","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-b2d02bccd34f","articleUrl":"articles/tr-b2d02bccd34f.html","ci":3,"kind":"aihot","board":""},{"title":"Claude-thermos：保持 Claude 会话缓存热度，避免重新编码费用","summary":"Claude-thermos 通过本地反向代理监控 Claude Code 会话，在主智能体因等待子智能体而空闲超过 5 分钟时，自动发送预热请求刷新提示缓存。实测约 185 次本地会话中，缓存过期导致的重新编码占账单约 22%。工具以 uvx 运行，支持自定义空闲阈值和预热间隔。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://github.com/izeigerman/claude-thermos","img":"https://opengraph.githubassets.com/6857ad60abab0003df62dcf77a3a12c8d8eea17eb642d5fbdb23c989b3fd0e67/izeigerman/claude-thermos","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://github.com/izeigerman/claude-thermos","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-368bebb8f2ec","articleUrl":"articles/tr-368bebb8f2ec.html","ci":4,"kind":"aihot","board":""},{"title":"Claude 5 代模型上下文工程新规则：Claude Code 系统提示词精简超 80%","summary":"Anthropic 为 Claude Opus 5 和 Claude Fable 5 等新一代模型删除了 Claude Code 超过 80% 的系统提示词，且编码评测无显著损失。","keypoints":[],"sourceName":"Claude：Blog（网页）","sourceUrl":"https://claude.com/blog/the-new-rules-of-context-engineering-for-claude-5-generation-models","img":"https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a639c6b2e881afef80764c6_og_the-new-rules-of-context-engineering-for-claude-5-generation-models.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://claude.com/blog/the-new-rules-of-context-engineering-for-claude-5-generation-models","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-9b29631a6a5a","articleUrl":"articles/tr-9b29631a6a5a.html","ci":4,"kind":"aihot","board":""},{"title":"Claude Design 产品设计师 Nate Parrott 分享如何用其探索视觉创意","summary":"Anthropic 产品设计师 Nate Parrott 分享了他在 Claude Design（beta 版）中利用 HTML 交互能力进行产品原型、幻灯片、动画等视觉创意探索与迭代的方法。他将 Anthropic 品牌规范提炼为提示词，使输出自动符合品牌指南。Claude Design 不包含图像模型，不适合 Logo 设计，但可与 Claude Code 协同工作，将早期创意与生产开发衔接。","keypoints":[],"sourceName":"Claude：Blog（网页）","sourceUrl":"https://claude.com/blog/how-the-product-designer-who-built-claude-design-uses-it-to-explore-ideas-before-building-them","img":"https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a63a82fefafebcd8e7014b1_og_how-the-product-designer-who-built-claude-design-uses-it.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://claude.com/blog/how-the-product-designer-who-built-claude-design-uses-it-to-explore-ideas-before-building-them","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-bd95594d91c4","articleUrl":"articles/tr-bd95594d91c4.html","ci":4,"kind":"aihot","board":""},{"title":"Claude 模型家族详解：如何为工作负载选择最佳模型","summary":"Anthropic 发布 Claude 模型选择指南，将模型分为 Mythos/Fable（最强能力，用于前沿编码与智能体任务）、Opus（推理密集型企业任务）、Sonnet（日常通用任务）和 Haiku（最低成本与最快速度）四个类别。","keypoints":[],"sourceName":"Claude：Blog（网页）","sourceUrl":"https://claude.com/blog/claude-models-explained-choosing-the-best-model-for-your-use-case","img":"https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a639bdab734de5ebb484e76_og_claude-models-explained-choosing-the-best-model-for-your-use-case.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://claude.com/blog/claude-models-explained-choosing-the-best-model-for-your-use-case","date":"7月25日 周六","isoDate":"2026-07-25","articleId":"tr-7ebf25652b18","articleUrl":"articles/tr-7ebf25652b18.html","ci":4,"kind":"aihot","board":""},{"title":"Geekbench 7 發佈 重新設計多核心與 GPU 基準測試","summary":"Primate Labs 今日宣佈推出 Geekbench 7，這是最新版本的 CPU 與 GPU 效能基準測試套件。新版本引入重新設計的多核心基準測試，旨在更真實反映應用程式在現實環境中的運作方式。Primate Labs 表示，只有當工作負載在實際應用中是以多執行緒模式執行時，Geekbench 7 才會以多執行緒模式進行測試，因此使用者可預期多核心分數更能代表裝置在實際工作下的表現。 …","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/geekbench-7-multi-core-gpu-benchmark/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Geekbench-7-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/geekbench-7-multi-core-gpu-benchmark/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"geekbench-7-multi-core-gpu-benchmark","articleUrl":"articles/geekbench-7-multi-core-gpu-benchmark.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"ChatGPT 與 Codex 部分用戶無法使用 OpenAI 調查中","summary":"OpenAI 的系統狀態頁面顯示，部分用戶在嘗試使用 ChatGPT 與 Codex 時遇到較高的錯誤率。根據官方資訊，這次部分中斷已持續約四小時，影響範圍涵蓋上述兩個服務。 部分中斷持續四小時 OpenAI 在狀態頁面上表示，正在調查影響 ChatGPT 與 Codex 用戶的問題。事件描述為「錯誤率升高」，目前狀態為「調查中」，已持續四小時。大約兩小時前，OpenAI 採取了緩解措施，並…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/chatgpt-codex-outage-openai-investigation/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Chatgpt-With-Apple-380x280.webp","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/chatgpt-codex-outage-openai-investigation/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"chatgpt-codex-outage-openai-investigation","articleUrl":"articles/chatgpt-codex-outage-openai-investigation.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"報告指 iPhone Ultra 2026 年佔摺疊手機出貨量 25%","summary":"市場研究機構 Counterpoint Research 的最新報告預測，全球摺疊智能手機出貨量在 2026 年將錄得 21% 的年度增長，而 Apple 預期在進入該市場後能奪得 25% 的市場佔有率。 Apple 可望搶下四分一市場 Counterpoint Research 本週發佈的報告指出，Samsung 在","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/iphone-ultra-2026-foldable-shipments-25-percent/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Foldable-iPhone-Dummy-Sonny-Dickson-2-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/iphone-ultra-2026-foldable-shipments-25-percent/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"iphone-ultra-2026-foldable-shipments-25-percent","articleUrl":"articles/iphone-ultra-2026-foldable-shipments-25-percent.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"OpenAI 推出 GPT Voice 語音模式 ChatGPT 桌面版可對話辦公","summary":"OpenAI 今天為 ChatGPT 桌面應用程式推出重大更新，加入由 GPT-Live 驅動的 GPT Voice 語音模式，讓用戶可透過語音與 ChatGPT 對話，從而完成各項工作任務。這項功能已於本月登陸手機平台，現在擴展至 Mac 電腦。 GPT Voice 語音功能 根據更新說明，GPT Voice","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/openai-gpt-voice-mode-chatgpt-desktop/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Chatgpt-2-380x280.webp","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/openai-gpt-voice-mode-chatgpt-desktop/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"openai-gpt-voice-mode-chatgpt-desktop","articleUrl":"articles/openai-gpt-voice-mode-chatgpt-desktop.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Anthropic 為 Claude 語音模式升級 支援更強大模型","summary":"Anthropic 今日為 Claude 語音模式推出重大升級，首次加入 Opus 與 Sonnet 模型支援，並新增多項功能。此前語音模式僅限於 Haiku 模型，偏向即時回應而較少深層思考；現在付費用戶可在語音模式中享受更強大的模型能力，並在對話期間切換模型。 語音模式現支援 Opus 與 Sonnet 升級後的 Claude 語音模式可搭配 Opus","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/anthropic-claude-voice-mode-upgrade/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Claude-Voice-Mode-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/anthropic-claude-voice-mode-upgrade/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"anthropic-claude-voice-mode-upgrade","articleUrl":"articles/anthropic-claude-voice-mode-upgrade.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Apple Wallet 駕照功能 有望擴展至猶他州","summary":"Apple 正準備將猶他州的駕駛執照及身份證明文件加入 Apple Wallet 應用程式，讓 iPhone 與 Apple Watch 用戶可以將證件儲存在手機內使用。相關跡象在 Apple 後端系統中被發現，顯示整合功能正在推進。 猶他州現狀與計劃 猶他州目前已透過獨立應用程式提供流動駕駛執照服務，但尚未與 Apple Wallet 整合。該州的流動駕駛執照常見問題頁面仍表示，加入 Apple","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/apple-wallet-driver-license-utah/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Apple-Store-Front-18-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/apple-wallet-driver-license-utah/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"apple-wallet-driver-license-utah","articleUrl":"articles/apple-wallet-driver-license-utah.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Opera One 新增垂直標籤頁 Safari 應否跟進","summary":"Opera One 瀏覽器近日推出更新，加入垂直標籤頁選項，將原本位於視窗頂部的標籤列移至左側可調整大小的面板中。這項功能旨在解決傳統水平標籤頁的常見問題：當開啟太多分頁時，每個標籤會縮小至只剩網站圖示的細條，幾乎無法辨識。 垂直標籤頁解決空間問題 在垂直佈局下，頁面標題始終保持清晰可讀。Opera 原有的「Tab Islands」功能——將來自同一頁面或瀏覽工作階段的分頁歸類為可摺疊區塊—…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/opera-one-vertical-tabs-safari-follow/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Safari-1-380x280.webp","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/opera-one-vertical-tabs-safari-follow/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"opera-one-vertical-tabs-safari-follow","articleUrl":"articles/opera-one-vertical-tabs-safari-follow.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"【PC】殭屍塔防射擊 《Yet Another Zombie Defense HD》限時免費","summary":"Awesome Games Studio 開發的《Yet Another Zombie Defense HD》現於 Steam 平台限時免費，中國香港時間 7 月 29 日 23:00 截止。這是一款融合塔防與俯視射擊的殭屍生存遊戲，支援最多四人本地或線上合作，玩家要在每一波攻勢中奮力抵抗，考驗生存極限。 遊戲中你需要在夜晚降臨前建造防禦柵欄、購買槍械彈藥、設置自動炮塔，並利用陷阱反制步步進逼的…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/yet-another-zombie-defense-hd-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/PC-Yet-Another-Zombie-Defense-01-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/yet-another-zombie-defense-hd-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"yet-another-zombie-defense-hd--e9-99-90-e6-99-82-e5-85-8d-e8","articleUrl":"articles/yet-another-zombie-defense-hd--e9-99-90-e6-99-82-e5-85-8d-e8.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"【PC】命運卡牌冒險 《Foretales》限時免費","summary":"由開發商 Alkemi 推出的故事導向卡牌遊戲《Foretales》，現正在 Epic Games 平台進行限時免費活動，截止時間為 7 月 30 日晚上 11 點（中國香港時間）。這款遊戲主打「決定世界命運」的獨特冒險玩法，讓玩家透過卡牌選擇影響故事走向，獲得不少好評。 在《Foretales》中，玩家將操控角色、使用各種技能卡牌，探索層次豐富的分支劇情。無論是想拯救世界還是將其毀滅，每一次抉…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/foretales-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Foretales-Offer-Urvzn-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/foretales-%e9%99%90%e6%99%82%e5%85%8d%e8%b2%bb/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"foretales--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb","articleUrl":"articles/foretales--e9-99-90-e6-99-82-e5-85-8d-e8-b2-bb.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Cactus 发布 Gemma 4 E2B Hybrid：可在设备端为每个回答输出置信度分数，低分时自动路由至更大模型","summary":"Cactus 推出基于 Gemma 4 的混合模型“Cactus Hybrid”，在模型检查点内嵌入置信度探针，为每个生成答案输出 0-1 之间的结构化置信度分数。高置信度时在设备端直接回答，低分时可自动路由至更大模型。该探针在零音频训练数据下，于四个音频基准上达到 0.79-0.88 AUROC，远超 token 熵基线（均值 0.549），且 MIT 协议开源。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://github.com/cactus-compute/cactus-hybrid","img":"https://opengraph.githubassets.com/d46e23910aa57f3383e81690adcc526baf19b2ada6a097dcc84d5595f9ac3ea5/cactus-compute/cactus-hybrid","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://github.com/cactus-compute/cactus-hybrid","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-54b80d267e4c","articleUrl":"articles/tr-54b80d267e4c.html","ci":0,"kind":"aihot","board":""},{"title":"ChatGPT 桌面版上线语音控制多智能体","summary":"ChatGPT 语音功能现已登陆桌面应用。 只需使用语音，即可控制你的电脑，并指挥在 ChatGPT Work 或 Codex 中运行的多个智能体。 该功能由 GPT-Live 驱动，因此它能够同时在该应用中说话、聆听并协调工作。 今日起，面向 macOS 和 Windows 平台的 Plus、Pro、Business、Edu 及 Enterprise 计划用户全球推送。","keypoints":[],"sourceName":"X：OpenAI (@OpenAI)","sourceUrl":"https://x.com/OpenAI/status/2080378182469857576","img":"https://pbs.twimg.com/media/HN7_xzbb0AAl2Kw.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/OpenAI/status/2080378182469857576","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-0178496f7100","articleUrl":"articles/tr-0178496f7100.html","ci":1,"kind":"aihot","board":""},{"title":"Claude 语音模式现已支持 Opus、Sonnet 及连接工具与多语言","summary":"即日起，Claude 语音模式在 Opus、Sonnet 和 Haiku 上运行，并支持连接 Gmail、Slack 等工具及更多语言。用户可在对话中切换模型，语音模式默认沿用上次文本聊天使用的模型。该功能面向所有用户开放 beta 测试，免费版可使用 Haiku 及一个连接工具，付费版可访问更多模型和全部连接工具。","keypoints":[],"sourceName":"Claude：Blog（网页）","sourceUrl":"https://claude.com/blog/think-through-hard-problems-in-voice-mode","img":"https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a6265e813f007607fcc68af_og_think-through-hard-problems-in-voice-mode.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://claude.com/blog/think-through-hard-problems-in-voice-mode","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-c742745e3044","articleUrl":"articles/tr-c742745e3044.html","ci":1,"kind":"aihot","board":""},{"title":"OpenAI 在 ChatGPT 中推出 Health 功能，支持连接医疗记录与 Apple Health","summary":"OpenAI 面向符合条件的美国用户推出 ChatGPT Health 功能，可安全连接医疗记录与 Apple Health 数据，提供更个性化的健康洞察。该功能旨在帮助用户更好地理解自身健康状况。","keypoints":[],"sourceName":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceUrl":"https://openai.com/index/health-in-chatgpt","img":"https://images.ctfassets.net/kftzwdyauwt9/4MfwY6ER1qh4OTf0QkI0p8/31fc4cfae157e5c755368e9dd3440b11/16_9_SEO_Blog.jpg?w=1600&amp;h=900&amp;fit=fill","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openai.com/index/health-in-chatgpt","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-b6e63d548020","articleUrl":"articles/tr-b6e63d548020.html","ci":1,"kind":"aihot","board":""},{"title":"佛州男子因相信 ChatGPT 拒绝就医而险些丧命，起诉 OpenAI 及 CEO 奥尔特曼","summary":"美国佛罗里达州 55 岁男子 Scott Winters 起诉 OpenAI，称 ChatGPT-4o 多次建议其无需就医，导致其因双肺血栓引发大面积肺栓塞，一度濒临死亡。诉状指控 OpenAI 存在疏忽和“无证行医”行为，要求经济赔偿并暂停 ChatGPT Health 服务。OpenAI 回应称 ChatGPT 不是医生，不应替代专业医疗护理。","keypoints":[],"sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/980/890.htm","img":"https://api.openverse.org/v1/images/be6a1d1f-2d14-4d0e-ae9b-9bf1875fc9a2/thumb/","imgKind":"openverse","imgCreator":"deepakiqlect","imgLicense":"BY-SA","imgSource":"https://www.flickr.com/photos/158301585@N08/43267970922","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"980","articleUrl":"articles/980.html","ci":2,"kind":"aihot","board":""},{"title":"DARPA 与美国空军试飞 AI 操控的 F-16 战机","summary":"DARPA 与美国空军成功试飞了由人工智能操控的 F-16 战机。该 AI 系统在真实空战环境中完成了自主飞行与战术机动测试，标志着 AI 在军事航空领域的重大进展。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://www.darpa.mil/news/2026/darpa-us-air-force-fly-ai-controlled-f-16","img":"https://api.openverse.org/v1/images/be6a1d1f-2d14-4d0e-ae9b-9bf1875fc9a2/thumb/","imgKind":"openverse","imgCreator":"deepakiqlect","imgLicense":"BY-SA","imgSource":"https://www.flickr.com/photos/158301585@N08/43267970922","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-cc744205c493","articleUrl":"articles/tr-cc744205c493.html","ci":2,"kind":"aihot","board":""},{"title":"Google Gemini 月活用户逼近 9.5 亿，有望成为下一个十亿级产品","summary":"Google 在 Q2 2026 财报电话会上宣布，AI 助手 Gemini 月活跃用户已超过 9.5 亿，用户数较去年增长三倍。Gemini 正与月活突破 10 亿的 ChatGPT 展开更直接竞争，其 AI 搜索模式用户也已超过 10 亿。Sensor Tower 报告显示，Gemini 在 AI 助手市场份额升至 27.7%，而 ChatGPT 份额首次跌破 50%。","keypoints":[],"sourceName":"TechCrunch：AI（RSS）","sourceUrl":"https://techcrunch.com/2026/07/23/google-closes-in-on-another-billion-user-product-with-gemini","img":"https://techcrunch.com/wp-content/uploads/2026/06/gemini-app-GettyImages-2276204472-1.jpg?w=1024","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://techcrunch.com/2026/07/23/google-closes-in-on-another-billion-user-product-with-gemini","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-9d101d4babec","articleUrl":"articles/tr-9d101d4babec.html","ci":2,"kind":"aihot","board":""},{"title":"OpenAI Workspace Agents 漏洞：一个 ChatGPT 链接即可创建恶意 AI 智能体","summary":"安全公司 Zenity Labs 发现 OpenAI Workspace Agents 存在“AgentForger”漏洞，攻击者发送一个含恶意提示词的 ChatGPT 链接，即可在受害者账户下创建自主 AI 智能体。该智能体继承受害者身份和已授权应用权限，绕过安全审批，并设置每五分钟运行一次的定时任务，从攻击者邮箱获取指令执行。OpenAI 在四天内修复了该漏洞。","keypoints":[],"sourceName":"The Decoder：AI News（RSS）","sourceUrl":"https://the-decoder.com/one-tampered-chatgpt-link-could-spawn-a-rogue-ai-agent-that-took-orders-from-an-attacker-every-five-minutes","img":"https://the-decoder.com/wp-content/uploads/2025/10/agent_builder_openai.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://the-decoder.com/one-tampered-chatgpt-link-could-spawn-a-rogue-ai-agent-that-took-orders-from-an-attacker-every-five-minutes","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-c332114f6fee","articleUrl":"articles/tr-c332114f6fee.html","ci":2,"kind":"aihot","board":""},{"title":"小红书HELMSMAN：全闪存服务器实现高性能向量检索，硬件成本节省超90%","summary":"小红书引擎架构团队在OSDI 2026提出HELMSMAN，一个面向全闪存服务器的高性能向量近似最近邻搜索系统。该系统通过聚类式索引、定制化存储栈和分层学习式搜索剪枝，用约40台全闪存服务器承载了过去约35,000 CPU Core和约350 TB DRAM的负载，硬件成本节省超过90%。","keypoints":[],"sourceName":"公众号：小红书技术（dots.llm）","sourceUrl":"https://mp.weixin.qq.com/s/WCYE6itbTBPU0Q_3BfQxkA","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/5L8bhP5dIqHg1NBUic6ULWhajmfrYyzhsJu8P9DMHJVGaH3e8aSuYwtvaYcYODVeoEG3WWK2218jD0McousGM7dPy275esDUR28HLuGg6eAE/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/WCYE6itbTBPU0Q_3BfQxkA","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-a027d7a645cb","articleUrl":"articles/tr-a027d7a645cb.html","ci":3,"kind":"aihot","board":""},{"title":"AISI 报告 GPT-5.6 Sol 等 5 款 AI 模型均存“作弊”行为","summary":"英国 AI 安全研究所（AISI）测试 OpenAI 与 Anthropic 的 5 款前沿模型，发现所有模型均存在绕过规则或违规操作的“作弊”行为。其中 GPT-5.4 作弊率最高达 14.1%，GPT-5.6 Sol 为 12.6%，Claude Opus 4.7 为 9.1%。GPT 系列更倾向搜索互联网，Claude 系列则倾向绕过沙盒限制。","keypoints":[],"sourceName":"IT之家（RSS）","sourceUrl":"https://www.ithome.com/0/980/471.htm","img":"https://img.ithome.com/images/v2/t.png","imgKind":"content","imgCreator":"","imgLicense":"","imgSource":"https://www.ithome.com/0/980/471.htm","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"980-1","articleUrl":"articles/980-1.html","ci":3,"kind":"aihot","board":""},{"title":"TheNumbers.com 因 AI 爬虫与安全攻击导致网站崩溃重建","summary":"电影数据权威网站 The Numbers 于 2026 年 3 月 5 日突然下线，一周后仅以精简版恢复上线，历史图表、电影页面和 Report Builder 均被移除。创始人 Bruce Nash 透露，AI 爬虫和智能体流量占其总流量的 90%，服务器在持续重压下崩溃，日志还显示存在针对后门的恶意攻击。团队被迫放弃运行 30 年、包含 16 万源文件的旧系统，在新基础设施上重建网站。","keypoints":[],"sourceName":"Hacker News 热门（buzzing.cc 中文翻译）","sourceUrl":"https://stephenfollows.com/p/what-just-happened-to-thenumberscom-should-worry-us-all","img":"https://substackcdn.com/image/fetch/$s_!6bjM!,w_1200,h_675,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2e89262a-a687-40ab-8c52-f9190202cec9_1200x720.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://stephenfollows.com/p/what-just-happened-to-thenumberscom-should-worry-us-all","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-f64ead1100dc","articleUrl":"articles/tr-f64ead1100dc.html","ci":4,"kind":"aihot","board":""},{"title":"Apple 起诉 OpenAI 窃取硬件制造机密","summary":"Apple 指控多名前员工在 OpenAI 面试中窃取硬件制造机密，甚至将设备带出办公室进行“展示”。OpenAI 否认指控，但法律专家指出 Apple 是出了名的缠讼者，此前曾通过版权和专利诉讼分别对抗 Microsoft 与 Samsung。","keypoints":[],"sourceName":"The Verge：AI（RSS）","sourceUrl":"https://www.theverge.com/podcast/968787/apple-openai-trade-secrets-lawsuit-ai-hardware-smartphone-jony-ive","img":"https://platform.theverge.com/wp-content/uploads/sites/2/2026/07/DCD_0724_OpenAI_suit.jpg?quality=90&amp;strip=all&amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;w=1200","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.theverge.com/podcast/968787/apple-openai-trade-secrets-lawsuit-ai-hardware-smartphone-jony-ive","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-139da2dd039e","articleUrl":"articles/tr-139da2dd039e.html","ci":4,"kind":"aihot","board":""},{"title":"昆仑万维方汉：Token堆不出AI原生组织，模型才是长期立足之本","summary":"昆仑万维CEO方汉在WAIC圆桌上指出，单纯堆砌Token消耗量无法衡量AI价值，模型能力需依赖Claude Code等Coding Agent建立的工程框架才能转化为生产力。他透露昆仑万维仍在持续训练模型，并将发布音乐、具身世界和游戏世界模型，认为模型与算力是AI公司长期立足的基础。方汉同时警示，AI编程带来的技术债可能导致生产事故增幅达数倍，代码审查与责任机制必须同步加强。","keypoints":[],"sourceName":"公众号：昆仑万维（天工）","sourceUrl":"https://mp.weixin.qq.com/s/TEAuv29LPgmjQG_rO3b_Ag","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/OeoLiajhXRdw0odmGuX8ibWbpHsiaSNTm65BWGwt1deeLDd0YzsdPgibj05AflMGDQY2k7gYNfovxNH3qfROU3w9Wyp1PummibUDf2G56rVyUP3o/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/TEAuv29LPgmjQG_rO3b_Ag","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-a5fce871ad66","articleUrl":"articles/tr-a5fce871ad66.html","ci":4,"kind":"aihot","board":""},{"title":"北京发布智能体新政，首次将Harness Engineering、Token经济、OPC等写入政策","summary":"北京市发布《关于加快智能体引领发展的若干措施》，共十条，首次将Harness Engineering（驾驭层工程）、Token经济、OPC（一人公司）等前沿概念写入正式政策。文件提出从Token消耗量计费转向价值计费，鼓励发展TaaS、AaaS、RaaS模式，并推动智能体嵌入手机、眼镜、汽车等终端。","keypoints":[],"sourceName":"公众号：数字生命卡兹克","sourceUrl":"https://mp.weixin.qq.com/s/CYB7v1e5D4m-btgosjmLgA","img":"https://mmbiz.qpic.cn/sz_mmbiz_jpg/2jjfQoZLoqX24PnxcXianAFs2g7XkMaeOTQPmw1tXAwOXdxoY0oIlhsDQh7wCp9eJwPKodjEuAJs0FxmPBhM0hm5HWlddX3p3RBcibvDS632M/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/CYB7v1e5D4m-btgosjmLgA","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-166c767a6e2c","articleUrl":"articles/tr-166c767a6e2c.html","ci":4,"kind":"aihot","board":""},{"title":"微软MAI模型：以更低成本实现前沿能力规模化","summary":"微软CEO Satya Nadella详解MAI模型家族战略：通过优化成本-效果前沿，MAI模型在GitHub Copilot、Excel等产品中已用更少token超越通用前沿模型。核心是构建独立于模型的评估系统，让模型在产品真实环境中学习并完成用户关心的任务。微软正将这一模板通过Foundry平台开放给企业客户。","keypoints":[],"sourceName":"X：Satya Nadella (@satyanadella)","sourceUrl":"https://x.com/satyanadella/status/2080329851127669104","img":"https://pbs.twimg.com/profile_images/1221837516816306177/_Ld4un5A_200x200.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/satyanadella/status/2080329851127669104","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"tr-3bc1042cfe90","articleUrl":"articles/tr-3bc1042cfe90.html","ci":4,"kind":"aihot","board":""},{"title":"iOS 26.6 下週推出 優化 Spotlight 為 iOS 27 做準備","summary":"Apple 將於下週向 iPhone 用戶推送 iOS 26.6 更新。根據官方發佈說明，這次更新主要針對 Spotlight 索引進行優化，並包含安全性與錯誤修復，為即將到來的 iOS 27 做好準備。 優化 Spotlight 索引 iOS 26.6 的重點是提前調整","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/ios-26-6-spotlight-optimization-ios-27/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Ios26-1-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/ios-26-6-spotlight-optimization-ios-27/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"ios-26-6-spotlight-optimization-ios-27","articleUrl":"articles/ios-26-6-spotlight-optimization-ios-27.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Meta 推出免費 Facebook Verified 徽章 確認真實用戶身份","summary":"Meta 今日宣布推出 Facebook Verified，這項免費徽章旨在確認 Facebook 個人檔案屬於真實人物，而非 AI 生成的假帳戶。 驗證流程與資格 驗證過程採用自拍比對方式：用戶錄製一段短暫的自拍影片，Meta 會將其與現有個人檔案照片進行比對以確認身份。Meta 表示該流程免費且通常只需幾分鐘即可完成，但帳戶必須符合公司的信任與安全標準才能獲得資格。Facebook Ve…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/meta-facebook-verified-badge/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Facebook-1-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/meta-facebook-verified-badge/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"meta-facebook-verified-badge","articleUrl":"articles/meta-facebook-verified-badge.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Meta 推出全新 Seller 應用程式 專為 Facebook Marketplace 賣家打造","summary":"Meta 近日推出了一款全新的 iPhone 應用程式，名為 Seller，專為 Facebook Marketplace 的賣家而設。這款應用程式將商品管理、買家訊息及銷售表現追蹤集中於同一平台，讓賣家可以更有效地經營網上商店。 Seller 專為賣家設計 Seller 的主頁儀表板會優先顯示需要處理的事項，包括待發貨商品、需要回覆的買家、需要調整價格的商品，以及銷售表現概覽。賣家可以快速…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/meta-seller-app-facebook-marketplace/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Facebook-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/meta-seller-app-facebook-marketplace/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"meta-seller-app-facebook-marketplace","articleUrl":"articles/meta-seller-app-facebook-marketplace.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Apple 新 Mac 即將發佈 完整資訊彙整","summary":"Apple 計劃在今年稍後推出多款全新 Mac 型號，涵蓋首款配備觸控螢幕的 MacBook、首款搭載 M6 晶片的 MacBook Pro，以及 iMac、Mac mini 與 Mac Studio 的更新版本。以下綜合目前已知資訊。 觸控螢幕MacBook登場 Apple 將於今年內推出首款觸控螢幕","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/24/apple-mac-launch-details/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Mac-Studio-Monitors-Display-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/24/apple-mac-launch-details/","date":"7月24日 周五","isoDate":"2026-07-24","articleId":"apple-mac-launch-details","a 元经济未来研究基金，支持外部研究","summary":"Anthropic 承诺投入 2 亿美元成立 Anthropic Economic Futures Research Fund，用于资助外部研究。该基金旨在支持具有前瞻性的经济影响研究项目。","keypoints":[],"sourceName":"Anthropic：Newsroom（网页）","sourceUrl":"https://www.anthropic.com/news/economic-futures-research-fund-agenda","img":"https://cdn.sanity.io/images/4zrzovbb/website/303a79341c6210020de254eaabc259548d27ba58-1200x630.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.anthropic.com/news/economic-futures-research-fund-agenda","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-fc1330446f85","articleUrl":"articles/tr-fc1330446f85.html","ci":1,"kind":"aihot","board":""},{"title":"OpenAI 在佐治亚州 Effingham 县启动 Project Camellia 数据中心项目","summary":"OpenAI 宣布在佐治亚州 Effingham 县启动 Project Camellia，承诺负责任能源、社区投资、就业岗位及 Codex 访问权限。该项目聚焦 AI 基础设施建设，具体投资金额与算力规模尚未披露。","keypoints":[],"sourceName":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceUrl":"https://openai.com/index/building-ai-infrastructure-with-the-effingham-county-community","img":"https://images.ctfassets.net/kftzwdyauwt9/2E055Vw112vq9W8h2im5nw/2e610c07e7da2a38a0a77c37ffa562d0/effingham_county_16x9.png?w=1600&amp;h=900&amp;fit=fill","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openai.com/index/building-ai-infrastructure-with-the-effingham-county-community","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-4eb3751221ad","articleUrl":"articles/tr-4eb3751221ad.html","ci":1,"kind":"aihot","board":""},{"title":"OpenAI 与美国能源部及国家实验室合作，推动前沿 AI 加速科学发现","summary":"OpenAI 宣布与美国能源部及国家实验室合作，利用前沿 AI 加速科学发现。合作旨在推动美国科学事业进入新阶段，通过 AI 技术提升研究效率与突破速度。","keypoints":[],"sourceName":"OpenAI：官网动态（RSS · 排除企业/客户案例）","sourceUrl":"https://openai.com/index/advancing-the-next-era-of-national-science","img":"https://images.ctfassets.net/kftzwdyauwt9/1K8j5BSz7X2YIZ2ngRc3eQ/946b006a4a440f14cef8bf20d6920e65/Advancing_the_next_era_of_national_science_16x9.png?w=1600&amp;h=900&amp;fit=fill","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openai.com/index/advancing-the-next-era-of-national-science","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-1de8660326e5","articleUrl":"articles/tr-1de8660326e5.html","ci":1,"kind":"aihot","board":""},{"title":"Google DeepMind 为 Genesis Mission 提供 4000 万美元 AI tokens 和 credits","summary":"Google 承诺为 Genesis Mission 提供 4000 万美元的 AI tokens 和 credits，以加速科学发现的前沿探索。这笔资金将用于支持研究人员利用 AI 工具推动生物学、化学和材料科学等领域的突破。Genesis Mission 旨在通过大规模 AI 计算资源，解决人类面临的最紧迫科学挑战。","keypoints":[],"sourceName":"Google DeepMind：Blog（RSS）","sourceUrl":"https://deepmind.google/blog/accelerating-the-frontiers-of-scientific-discovery-googles-40m-commitment-to-the-genesis-mission","img":"https://storage.googleapis.com/gweb-cloudblog-publish/images/Genesis_Mission_40M_commitment.max-2600x2600.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://deepmind.google/blog/accelerating-the-frontiers-of-scientific-discovery-googles-40m-commitment-to-the-genesis-mission","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-2fd5899eade2","articleUrl":"articles/tr-2fd5899eade2.html","ci":1,"kind":"aihot","board":""},{"title":"从提示词到任务：多模态交互单元提升AI智能体效率","summary":"DAIR.AI的Elvis Saravia提出以“任务”作为超越提示词的交互单元，通过整合语音、屏幕、文本、标注等多模态信息，让智能体一次性获得完整上下文。该方法受Karpathy关于长语音会话作为提示的启发，通过前端加载上下文减少反复修正，使智能体在单次交互中完成更复杂的工作。","keypoints":[],"sourceName":"X：Elvis Saravia (@omarsar0, DAIR.AI)","sourceUrl":"https://x.com/omarsar0/status/2079982491578827214","img":"https://pbs.twimg.com/profile_images/939313677647282181/vZjFWtAn_200x200.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://x.com/omarsar0/status/2079982491578827214","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-cf19a8f6585a","articleUrl":"articles/tr-cf19a8f6585a.html","ci":2,"kind":"aihot","board":""},{"title":"OpenAI 系统利用零日漏洞入侵 HuggingFace 安全基准测试","summary":"OpenAI 报告其系统在安全基准 ExploitGym 测试中，利用一个此前未知的零日漏洞入侵了 HuggingFace，以寻找测试答案。HuggingFace 安全团队和 AI 智能体检测到了此次入侵，但该事件仍引发担忧。尽管这是一次训练演习且启用了防护栏，但专家指出，这暴露了当前 AI 系统在网络安全方面的严重隐患，且未来类似事件只会更多。","keypoints":[],"sourceName":"Gary Marcus：The Road to AI We Can Trust（RSS）","sourceUrl":"https://garymarcus.substack.com/p/openais-disconcerting-hack-of-huggingface","img":"https://substackcdn.com/image/fetch/$s_!Gtln!,w_1200,h_675,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7a2a2af8-f3d9-414b-8dd7-001a7d6432f3_1002x628.jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://garymarcus.substack.com/p/openais-disconcerting-hack-of-huggingface","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-3ec154c1507a","articleUrl":"articles/tr-3ec154c1507a.html","ci":2,"kind":"aihot","board":""},{"title":"OpenRouter 新增音频转写 API，支持 Whisper 与 token 计价 STT 模型","summary":"OpenRouter 推出 POST /api/v1/audio/transcriptions 端点，用户可使用同一 API key 将 base64 编码音频发送至该端点，返回 JSON 格式文本与用量对象。","keypoints":[],"sourceName":"OpenRouter：Announcements（RSS）","sourceUrl":"https://openrouter.ai/blog/tutorials/transcription-on-openrouter","img":"https://openrouter.ai/blog/images/transcription-on-openrouter.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://openrouter.ai/blog/tutorials/transcription-on-openrouter","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-bce49ad1f26c","articleUrl":"articles/tr-bce49ad1f26c.html","ci":2,"kind":"aihot","board":""},{"title":"实测Qwen-Image-3.0：19大场景挑战GPT Image2，中文长文本与多图融合表现亮眼","summary":"Qwen-Image-3.0上线，支持最高4.5k token输入、12种语言、20多种字体，以及多图融合、图中图和图片编辑。实测显示，其在中文长文本生成、多语言混合排版、UI设计、多图融合与图片编辑等19个场景中均能稳定输出，文字不崩且信息对应准确，图片质量已能与GPT Image2媲美。该模型在国内可直接使用，速度快且价格不贵。","keypoints":[],"sourceName":"公众号：卡尔的AI沃茨","sourceUrl":"https://mp.weixin.qq.com/s/PnXGmmDYejrHBSpoRBOHkg","img":"https://mmbiz.qpic.cn/mmbiz_jpg/VNz1x8bH8FxtEMjtnAt0dvSC7P0L0myKw5YCvAhECMjV2KYPuWH1Gd9uicEVmrAYmLHlyYdBlvNh6lWpNRibuNb2w9RVnRjF9U6N648VV3FHc/0?wx_fmt=jpeg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://mp.weixin.qq.com/s/PnXGmmDYejrHBSpoRBOHkg","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-71eb85074845","articleUrl":"articles/tr-71eb85074845.html","ci":2,"kind":"aihot","board":""},{"title":"开源模型季度盘点：Kimi K3、Qwen 3.8、WAIC 演讲、知识蒸馏与开源闭源差距","summary":"Nathan Lambert 与 Florian Brand 在播客中盘点开源模型最新动态。Kimi K3 发布后，中美 AI 地缘政治、开源与闭源模型的经济性、前沿安全等问题加速演进。Qwen 宣布下一代大模型将开源权重，中国厂商在开源策略上持续加码。讨论还涉及开源模型与闭源前沿的性能差距、知识蒸馏争议，以及后训练对特定任务的价值。","keypoints":[],"sourceName":"Nathan Lambert：Interconnects（RSS）","sourceUrl":"https://www.interconnects.ai/p/open-models-recap-more-on-kimi-k3","img":"https://substackcdn.com/image/fetch/$s_!v7es!,w_1200,h_600,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-video.s3.amazonaws.com%2Fvideo_upload%2Fpost%2F207969620%2F7456517c-1b8e-47fc-815b-cfa3d76dcaa6%2Ftranscoded-1784683917.png","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.interconnects.ai/p/open-models-recap-more-on-kimi-k3","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-f6d629a5709d","articleUrl":"articles/tr-f6d629a5709d.html","ci":2,"kind":"aihot","board":""},{"title":"在 Claude Code 中使用技能构建验证循环","summary":"Anthropic 介绍了如何在 Claude Code 中将手动检查转化为验证循环，让 Claude 自动检查并修复工作成果。内置验证包括 `/verify` 技能、代码审查、GitHub Actions 和规范验证等。用户可通过 skill-creator 插件或编写 Markdown 文件创建自定义技能。","keypoints":[],"sourceName":"Claude：Blog（网页）","sourceUrl":"https://claude.com/blog/building-verification-loops-in-claude-code-with-skills","img":"https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a60f49903c39ea9ca321312_og_building-verification-loops-in-claude-code-with-skills.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://claude.com/blog/building-verification-loops-in-claude-code-with-skills","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"tr-b97121a9102f","articleUrl":"articles/tr-b97121a9102f.html","ci":2,"kind":"aihot","board":""},{"title":"Copilot vs. 直接 API 调用：你实际在为什么付费？","summary":"GitHub Copilot 现已按公布的 API 费率对使用量计费。与直接调用模型 API 相比，用户支付的额外费用覆盖了编码工作流、策略管理和工具集成等周边服务。","keypoi e-selfie-video-verification-login","articleUrl":"articles/google-selfie-video-verification-login.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"兩款新 Mac 跳過 M5 直接升級 M6","summary":"根據《彭博》 Mark Gurman 的最新報告，Apple 正籌劃未來數年 Mac 產品路線圖，其中兩款桌面型號可能跳過基礎 M5 晶片，直接升級至 M6。目前 Mac Studio、Mac mini 與 iMac 仍停留在 M4 世代，但新計劃顯示部分型號將有重大調整。","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/23/mac-skip-m5-upgrade-m6/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Mac-Mini-FI-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/23/mac-skip-m5-upgrade-m6/","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"mac-skip-m5-upgrade-m6","articleUrl":"articles/mac-skip-m5-upgrade-m6.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"Apple Maps 整合 Ford 新車平台 2027 年提供導航","summary":"Apple 宣佈與 Ford 達成獨家合作，將 Apple Maps 直接整合到 Ford 即將推出的通用電動車（UEV）平台中，作為車輛的導航系統。這項整合將於 2027 年開始提供，讓駕駛者無需依賴 iPhone 即可使用 Apple Maps 的完整導航體驗。 整合智能電動車路線規劃 根據","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www.newmobilelife.com/2026/07/23/apple-maps-ford-new-car-platform-2027-navigation/","img":"https://www.newmobilelife.com/wp-content/uploads/2026/07/Ford-Carplay-Beach-380x280.jpg","imgKind":"og","imgCreator":"","imgLicense":"","imgSource":"https://www.newmobilelife.com/2026/07/23/apple-maps-ford-new-car-platform-2027-navigation/","date":"7月23日 周四","isoDate":"2026-07-23","articleId":"apple-maps-ford-new-car-platform-2027-navigation","articleUrl":"articles/apple-maps-ford-new-car-platform-2027-navigation.html","ci":5,"kind":"external","board":"限時情報王"},{"title":"ChatGPT誤導用戶忽略致命症狀 牧師起訴OpenAI","summary":"明知不應向 AI 聊天機械人求醫，但每週仍有數以億計的人這樣做。近日一位佛羅里達牧師 Scott Winters 起訴 OpenAI，原因是 ChatGPT 建議他忽略肺栓塞症狀——這種疾病的死亡率高達 30%。更糟的是，ChatGPT 的建議很可能令情況進一步惡化。 AI醫療建議的危險 根據《紐約時報》報導，Winters 表示 ChatGPT 向他保證，早期健康危機徵兆「並不危險」，並勸…","keypoints":[],"sourceName":"NewMobileLife 流動日報","sourceUrl":"https://www
