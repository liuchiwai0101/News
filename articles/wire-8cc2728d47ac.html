<h1>五年規劃提出以北都作為高等教育和創新科技發展主要增長引擎</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870308_1_M_20260916192811.jpg" alt=""></p><h3>重點內容</h3><p>香港第一個五年規劃提出加速提效北部都會區的建設，以北部都會區作為高等教育和創新科技發展的主要增長引擎，形成「產、學、研」深度融合的創新生態圈。</p><p>河套香港園區一號大樓將命名為「河套學研壹號」；香港賽馬會慈善信託基金亦會撥備30億元，支持興建另一座綜合教學科研大樓，兩座大樓相輔相成，為北都大學城加速建設揭開序幕。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870308-20260916.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：五年規劃提出以北都作為高等教育和創新科技發展主要增長引擎</li></ul>
