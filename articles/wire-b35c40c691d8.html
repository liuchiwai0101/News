<h1>許正宇：香港可在三個方向助力兩岸和港澳開拓更廣闊發展空間</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870104_2_M_20260915204505.jpg" alt=""></p><h3>重點內容</h3><p>財經事務及庫務局局長許正宇，在海峽兩岸暨港澳經貿論壇説，香港可以在三個方向，發揮所長，包括發揮國際金融中心和離岸人民幣業務優勢，強化資產及財富管理中心功能，助力兩岸和港澳地區，在新格局下開拓更廣闊的發展空間。 編輯：王濱南</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870104-20260915.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：許正宇：香港可在三個方向助力兩岸和港澳開拓更廣闊發展空間</li></ul>
