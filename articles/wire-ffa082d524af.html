<h1>黃澤林亞運網球男單奪金　港隊今屆第八金</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872537_1_M_20261003112158.jpg" alt=""></p><h3>正文</h3><p>名古屋亞運網球項目男單決賽，本港首席網球手黃澤林直落兩盤擊敗國家隊球手吳易昺，歷史性為港隊取得首面亞運網球男單金牌。</p><p>賽事頭號種子、世界排名100位的黃澤林，面對世界排名低11位的國家隊球手吳易昺，首盤兩度破對方發球局，先以6:2勝出。</p><p>第二盤，黃澤林延續好表現，再破對方發球局，最終以6:4再下一城。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872537-20261003.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：黃澤林亞運網球男單奪金　港隊今屆第八金</li></ul>
