<h1>WorkBuddy上線遠程控制，國內也有了最絲滑的Agent工作方式</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：數字生命卡茲克），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/58768062-2f38-4135-bdd9-d3a5e47328a7/thumb/" alt=""></p><h3>重點內容</h3><p>WorkBuddy更新上線遠程控制功能，將PC、App和小程序打通，手機端可實時同步電腦端的任務、對話、工作空間和產物，支持一台手機連接多台電腦並隨時切換。App需升級至1.2.0及以上，電腦端需升級至5.3.8及以上，連接無需掃碼。本次更新還新增資料庫（我的文檔與團隊空間）、Markdown多人共同編輯、AI原生審閲模式，以及將資料庫內容生成可發佈鏈接的HTML網站。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&amp;mid=2647685179&amp;idx=1&amp;sn=4cbee32b677b57a9dc6ec2a79d6f72c7" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
