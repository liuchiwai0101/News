<h1>馬斯克警告AI產業明年或面臨嚴重資金短缺</h1>
<div class="notice">內容機器翻譯自第三方媒體（TVB · 橙新聞），僅供參考，以原文為準。</div><p><img src="https://cdn.orangenews.hk/images/2026/02/12/aef635ff7764472daa86fca50a797251.jpg" alt=""></p><h3>正文</h3><p>SpaceX及特斯拉行政總裁馬斯克表示，隨人工智能(AI)行業等待帶來收益的數據中心運作，這些企業可能很快會陷入嚴重的現金短缺。他認為，數據中心啟用延誤的話，將令AI公司需要額外「數以千億美元」資金。</p><h3>各方報道</h3><ul><li><a href="https://news.tvb.com/sc/1207811-%E9%A6%AC%E6%96%AF%E5%85%8B%E8%AD%A6%E5%91%8AAI%E7%94%A2%E6%A5%AD%E6%98%8E%E5%B9%B4%E6%88%96%E9%9D%A2%E8%87%A8%E5%9A%B4%E9%87%8D%E8%B3%87%E9%87%91%E7%9F%AD%E7%BC%BA" target="_blank" rel="noopener noreferrer">TVB</a>：馬斯克警告AI產業明年或面臨嚴重資金短缺</li><li><a href="https://www.orangenews.hk/biz/VbkuzB8/%E9%A6%AC%E6%96%AF%E5%85%8B%E8%AD%A6%E5%91%8A-AI%E8%A1%8C%E6%A5%AD%E6%98%8E%E5%B9%B4%E6%88%96%E9%9D%A2%E8%87%A8%E5%9A%B4%E9%87%8D%E8%B3%87%E9%87%91%E7%9F%AD%E7%BC%BA.shtml" target="_blank" rel="noopener noreferrer">橙新聞</a>：馬斯克警告：AI行業明年或面臨嚴重資金短缺</li></ul>
