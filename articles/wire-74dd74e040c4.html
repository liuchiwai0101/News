<h1>男子被發現於尖沙咀海面漂浮　送院後證實死亡</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872366_1_M_20261002074452.jpg" alt=""></p><h3>重點內容</h3><p>一名男子昨晚被發現在尖沙咀梳士巴利道對開海面漂浮，送院後證實死亡。</p><p>警方在昨晚9時許接獲途人報案指，懷疑有人在梳士巴利道30號對開約30米海面漂浮。警方接報到場後，救起一名年約40歲的男子，他昏迷被送往伊利沙伯醫院，其後證實死亡。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872366-20261002.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：男子被發現於尖沙咀海面漂浮　送院後證實死亡</li></ul>
