<h1>貝森特：與中國就貿易和人工智能進行非常成功的接觸</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870873_1_M_20260921080703.jpg" alt=""></p><h3>重點內容</h3><p>中美兩國經貿團隊，在美國紐約舉行中美經貿磋商。</p><p>率領美方團隊的財長貝森特説，與中國就貿易和人工智能議題，進行非常成功的接觸，美中同意再次就人工智能進行會晤。他又透露，美國提議建立兩國之間的通知機制。</p><p>而美國貿易代表格里爾表示，美中貿易委員會將會組織化，兩國團隊正繼續就貿易委員會問題展開工作。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870873-20260921.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：貝森特：與中國就貿易和人工智能進行非常成功的接觸</li></ul>
