<h1>旅發局：「世界綵燈大街」參觀人流眾多　晚上十時停止排隊入展區</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871585_1_M_20260925211844.jpg" alt=""></p><h3>重點內容</h3><p>旅發局公佈，維園「國際中秋綵燈匯」人流管制最新安排，因應「世界綵燈大街」現時參觀人流眾多，考慮到公眾安全及秩序，將於晚上10時停止排隊進入展區。</p><p>旅發局呼籲參觀人士遵從現場工作人員指示，所有綵燈展出日期將延長至10月4日，感謝市民及旅客的踴躍支持及配合。</p><p>旅發局亦指，會因應現場實際情況，適時在官方網站公佈最新安排。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871585-20260925.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：旅發局：「世界綵燈大街」參觀人流眾多　晚上十時停止排隊入展區</li></ul>
