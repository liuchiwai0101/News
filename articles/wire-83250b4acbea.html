<h1>中美高層紐約會談 為特朗普習近平峯會鋪路</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/8600/15870725062_120c91470a_b.jpg" alt=""></p><p>美國財政部長貝森特與中國國務院副總理何立峯20日在紐約舉行高層會談，圍繞貿易休戰延長、人工智能監管、關鍵礦產供應及伊朗問題等議題展開磋商，為特朗普與習近平數日後的白宮會晤做準備。分析認為，雙方短期內或難取得重大突破，但有望就維持經貿關係穩定、避免緊張局勢升級達成有限共識。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/中美高层纽约会谈-为特朗普习近平峰会铺路/a-79346677?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：中美高層紐約會談 為特朗普習近平峯會鋪路</li></ul>
