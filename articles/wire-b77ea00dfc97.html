<h1>金沙中國擬發優先票據 為現有債務再融資及作一般企業用途</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2024/09/20240909_FI_source-web_01928-1.jpg" alt=""></p><h3>正文</h3><p>金沙中國(01928)開市前發公告，表示擬向專業投資者發發優先票據，發行本金額及其他條款尚待落實。</p><p>該公司表示，擬將今次發行集資所得淨額及手頭現金，悉數贖回7億美元、息率2.3%的2027年票據尚未償付本金額及任何應計利息、償還2024年SCL循環融資的未償還結餘，以及用作一般企業用途，包括資本開支。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17054073-%e9%87%91%e6%b2%99%e4%b8%ad%e5%9c%8b%e6%93%ac%e7%99%bc%e5%84%aa%e5%85%88%e7%a5%a8%e6%93%9a-%e7%82%ba%e7%8f%be%e6%9c%89%e5%82%b5%e5%8b%99%e5%86%8d%e8%9e%8d%e8%b3%87%e5%8f%8a%e4%bd%9c%e4%b8%80%e8%88%ac" target="_blank" rel="noopener noreferrer">巴士的報</a>：金沙中國擬發優先票據 為現有債務再融資及作一般企業用途</li></ul>
