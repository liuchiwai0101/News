<h1>Meta 探索分層興趣表示以優化廣告深度漏斗</h1>
<div class="notice">內容機器翻譯自第三方媒體（Meta Engineering Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://engineering.fb.com/wp-content/uploads/2026/07/image2_6a0f44.jpg" alt=""></p><h3>重點內容</h3><p>Meta 提出分層興趣表示，一種基於 Transformer 圖學習與自監督跨視圖蒸餾的上游表示層，為廣告實體學習統一嵌入。該系統在數十億真實交互數據上端到端訓練，輸出通用嵌入和 Bag-of-Meaning 興趣 token，旨在連接稀疏的深度漏斗信號與廣告主供給。該技術可集成至 Meta 的生成式廣告模型（GEM）、Andromeda 及自適應排序模型。</p><p><a href="https://engineering.fb.com/2026/07/15/ai-research/exploring-hierarchical-interest-representation-for-meta-ads-deep-funnel-optimization" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
