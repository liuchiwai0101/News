<h1>元朗白沙村一個衣紙倉庫發生三級火</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1876887_2_M_20261107012728.jpg" alt=""></p><h3>正文</h3><p>元朗白沙村一個衣紙倉庫發生三級火，現已救熄。火警期間，包括附近居民在內約12人要一度疏散，暫時未有人員受傷報告。</p><p>火警在昨晚10時58分發生，大約半小時後升為三級，消防動用3條喉及3隊煙帽隊灌救，至午夜12時45分大致救熄。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1876887-20261107.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：元朗白沙村一個衣紙倉庫發生三級火</li></ul>
