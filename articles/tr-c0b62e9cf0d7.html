<h1>MVICAD2：引入延遲與膨脹的多視圖獨立成分分析</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>巴黎-薩克雷大學等機構提出MVICAD2，允許不同被試的腦源在時間延遲和膨脹兩方面存在差異，以解決MVICA假設過於嚴格、僅估計延遲不足以刻畫聽覺刺激等腦動態的問題。該模型源可識別，似然有閉式近似，並通過正則化與優化提升性能。模擬顯示其優於現有方法，Cam-CAN數據集驗證了延遲和膨脹與衰老相關。</p><p><a href="https://machinelearning.apple.com/research/mvicad2-delays-dilations" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
