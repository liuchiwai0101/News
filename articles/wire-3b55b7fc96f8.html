<h1>港隊男子七人欖球隊亞運晉級決賽　將與國家隊爭奪金牌</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872543_1_M_20261003144246.jpg" alt=""></p><h3>正文</h3><p>名古屋亞運七人欖球賽，男子港隊晉級決賽，將與國家隊爭奪金牌。</p><p>爭取衞冕的港隊在四強以35:14擊敗韓國，至於另一場四強賽，國家隊以10:7贏日本隊。</p><p>女子方面，上屆取得銅牌的港隊在準決賽以12:27不敵日本隊，將與泰國隊爭奪銅牌。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872543-20261003.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：港隊男子七人欖球隊亞運晉級決賽　將與國家隊爭奪金牌</li></ul>
