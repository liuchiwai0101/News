<h1>尼日利亞翁多州疑似甲醇中毒事件增至48人死亡</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870520_1_M_20260918035610.jpg" alt=""></p><h3>重點內容</h3><p>尼日利亞翁多州政府表示，居民飲用當地釀造的酒精飲品後疑似中毒事件持續蔓延，增至48人死亡。死者的尿液樣本檢測結果顯示，事件疑似與攝入甲醇中毒有關。警方拘捕15名涉嫌生產、銷售該酒精飲品的人。</p><p>當局説，兩個社區9月初接連出現居民飲用相關酒精飲品後就醫的情況，醫療機構已經報告超過182宗相關病例。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870520-20260918.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：尼日利亞翁多州疑似甲醇中毒事件增至48人死亡</li></ul>
