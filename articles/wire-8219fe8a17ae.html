<h1>武術雙料冠軍梁宇航首徵亞運　李思穎場地單車賽爭牌</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869977_1_M_20260914193714.jpg" alt=""></p><h3>重點內容</h3><p>名古屋亞運週六開幕，港隊單車隊將派出23人出戰。在上屆亞運奪得兩銀一銅的李思穎説，備戰狀態不錯，今屆不會參加公路賽，將留力在場地賽及世錦賽。</p><p>至於武術賽事，港隊派出6男4女，出戰套路及散打項目。曾在世錦賽及世界盃奪冠的梁宇航，將首度徵戰亞運。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869977-20260914.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：武術雙料冠軍梁宇航首徵亞運　李思穎場地單車賽爭牌</li></ul>
