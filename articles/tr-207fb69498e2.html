<h1>Meta 發佈開源模型 Muse Glimmer</h1>
<div class="notice">內容機器翻譯自第三方媒體（X：AI at Meta (@AIatMeta)），僅供參考，以原文為準。</div><p><img src="https://pbs.twimg.com/media/HPWkSuDbkAExHc7.png:large" alt=""></p><h3>重點內容</h3><p>推出 Muse Glimmer，一款開放權重、300 億參數的模型，專為本地、常駐運行的智能體工作流優化。 與同尺寸領先模型相比，Muse Glimmer 在關鍵智能體用例和基準測試中表現出色，並設計為完全在消費級硬件（如 Mac 或配備高性能 GPU 的 PC）上運行。 秉承我們長期分享基礎 AI 研究的傳統，我們以寬鬆的 Apache 2.0 許可證發佈模型權重。</p><p><a href="https://x.com/AIatMeta/status/2086757844544811485" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
