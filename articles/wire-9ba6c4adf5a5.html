<h1>滙控季績前受壓暫逆市跌約0.7% 市場料第3季列帳基準税前利潤約升33%</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="https://image.bastillepost.com/640x/wp-content/uploads/hongkong/2024/04/20240430_FI_source-web_00005-7.jpg" alt=""></p><h3>正文</h3><p>滙控(00005)將於明天(10月27日)中午派發第3季成績表，儘管市場料季度列帳基準税前盈利有望升約33%，但該股績前仍受壓。</p><p>截至下午約2時14分，滙控報141.4元，跌0.77%，成交10.25億元；該股早市最低曾見140.3元，當時跌幅達1.54%，今日最高僅見142.5元，與上日收市持平。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17048682-%e6%bb%99%e6%8e%a7%e5%ad%a3%e7%b8%be%e5%89%8d%e5%8f%97%e5%a3%93%e6%9a%ab%e9%80%86%e5%b8%82%e8%b7%8c%e7%b4%840-7-%e5%b8%82%e5%a0%b4%e6%96%99%e7%ac%ac3%e5%ad%a3%e5%88%97%e5%b8%b3%e5%9f%ba%e6%ba%96" target="_blank" rel="noopener noreferrer">巴士的報</a>：滙控季績前受壓暫逆市跌約0.7% 市場料第3季列帳基準税前利潤約升33%</li></ul>
