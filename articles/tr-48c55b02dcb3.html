<h1>Claude 現已支持 Gmail 郵件與 Google Drive 文件管理</h1>
<div class="notice">內容機器翻譯自第三方媒體（X：Claude (@claudeai)），僅供參考，以原文為準。</div><p><img src="https://pbs.twimg.com/media/HQBxdhmXAAAEjuD.jpg:large" alt=""></p><h3>重點內容</h3><p>Claude 現在可以在 Gmail 中發送郵件，並管理 Google Drive 中的文件。 讓 Claude 回覆某個郵件線程，它會起草併發送回復。你可以控制何時需要你的批准。 從連接器菜單中選擇連接 Gmail 或 Google Drive 即可試用。所有付費套餐均可用。</p><p><a href="https://x.com/claudeai/status/2089806039088517356" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
