<div class="notice">內容機器翻譯自第三方媒體（Cursor Blog），僅供參考，以原文為準。</div><p><img src="https://ptht05hbb1ssoooe.public.blob.vercel-storage.com/assets/blog/router-method-og-image-G6nMkmFok7yHqd6AHHlaPfWFcU1sbm.png" alt=""></p><h3>重點內容</h3><p>Cursor Router 通過 Compass 複雜度預測器和基於真實開發者流量的任務分類法，為每個對話輪次匹配最合適的模型。Auto Intelligence 模式在用户滿意度超過 Fable 的同時成本降低 68%，Auto Balance 模式以低於 Opus 4.8 成本 41% 實現更優表現。系統從實時流量中學習模型在不同任務類別上的表現差異，以數據驅動方式替代基準分數推斷。</p><p><a href="https://cursor.com/blog/how-cursor-router-works" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
