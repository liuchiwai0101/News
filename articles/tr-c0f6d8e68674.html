<h1>螞蟻百靈與 ASystem 團隊打通單機 Agentic RL 後訓練閉環</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：螞蟻百靈（Ling）），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/58768062-2f38-4135-bdd9-d3a5e47328a7/thumb/" alt=""></p><h3>重點內容</h3><p>螞蟻百靈與 ASystem 團隊合作，用 Ling-3.0-tiny 和 AReno 在 DGX Spark 上跑通單機 Agentic RL 後訓練閉環。以井字棋為最小驗證任務，用 GSPO 算法訓練 400 步後，rollout/rewards_mean 從約 -0.5 升至 0.4，response_len 降至約 850 tokens，工具調用與動作選擇趨於穩定。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzkyODk2MDQwNw%3D%3D&amp;mid=2247487525&amp;idx=1&amp;sn=b9def9117e34b45fce50ab76eeed726c" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
