<h1>李在明：韓方不會派兵到霍爾木茲海峽介入中東戰事</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870649_1_M_20260918184049.jpg" alt=""></p><h3>重點內容</h3><p>韓國總統李在明表示，韓方不會派兵到霍爾木茲海峽，介入中東戰事。</p><p>李在明強調，韓方始終堅持不會為了參戰或介入戰爭而派遣兵力，這個原則今後也不會改變。但韓國與其他國家一樣，必須採取最低限度措施，確保本國商船航行安全，保障原油運輸暢通，以及維護公民生命安全，因此韓軍派出「青海部隊」，在霍爾木茲海峽保護公民，並且不排除會適度加強部署。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870649-20260918.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：李在明：韓方不會派兵到霍爾木茲海峽介入中東戰事</li></ul>
