<h1>《商報》：德國政府擬阻止中遠海運收購物流企業Zippel</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/7080/7278319352_98d124048d_b.jpg" alt=""></p><p>德國聯邦政府據報計劃阻止中遠海運收購德國物流公司Zippel。《商報》援引一份政府內部文件稱存在“重大安全顧慮”，擔心交易或使德國在關鍵物流節點形成戰略依賴並在政治衝突中被用作施壓手段。最終決定尚未作出，但據報道多個聯邦部門均反對該筆交易。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/《商报》：德国政府拟阻止中远海运收购物流企业zippel/a-79476866?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：《商報》：德國政府擬阻止中遠海運收購物流企業Zippel</li></ul>
