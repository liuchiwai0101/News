<h1>諾貝爾經濟學獎揭曉 美國兩學者共享殊榮</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873634_1_M_20261012194759.jpg" alt=""></p><h3>正文</h3><p>瑞典皇家科學院宣佈，將今年諾貝爾經濟學獎授予美國經濟學家霍爾和伍德福德，以表彰他們在奠定宏觀經濟穩定政策的微觀經濟學基礎研究領域的突出貢獻。</p><p>瑞典皇家科學院公報説，兩名獲獎者開發新的宏觀經濟模型，顯著提升實施有效經濟穩定政策的能力。藉助他們的模型，政府和中央銀行可以通過適時採取財政和貨幣政策措施，減少經濟波動幅度。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/诺贝尔经济学奖揭晓-美国两学者共享殊荣/a-79641735?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：諾貝爾經濟學獎揭曉 美國兩學者共享殊榮</li></ul>
