<h1>元朗錦上路掌牛山及井坑山附近發生山火　暫未有傷亡報告</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873493_1_M_20261011153920.jpg" alt=""></p><h3>重點內容</h3><p>元朗發生山火，暫時未有傷亡報告。 早上11時許，消防接獲多宗報案，指元朗錦上路掌牛山及井坑山附近發生山火，火線長達30米，消防到場撲救，政府飛行服務隊派直升機在上空投擲水彈。 消防正調查山火原因。 編輯：陳樂謙</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873493-20261011.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：元朗錦上路掌牛山及井坑山附近發生山火　暫未有傷亡報告</li><li><a href="https://hk.news.yahoo.com/%E9%8C%A6%E4%B8%8A%E8%B7%AF%E6%8E%8C%E7%89%9B%E5%B1%B1%E5%8F%8A%E4%BA%95%E5%9D%91%E5%B1%B1%E7%99%BC%E7%94%9F%E5%B1%B1%E7%81%AB-%E5%91%8830%E7%B1%B3%E7%81%AB%E9%BE%8D-%E9%A3%9B%E8%A1%8C%E6%9C%8D%E5%8B%99%E9%9A%8A%E7%9B%B4%E5%8D%87%E6%A9%9F%E6%93%B2%E6%B0%B4%E5%BD%88%E6%92%B2%E6%95%91-073000683.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：錦上路掌牛山及井坑山發生山火　呈30米火龍　飛行服務隊直升機擲水彈撲救</li></ul>
