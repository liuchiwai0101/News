<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>連續擴散與流匹配模型有望成為語言建模中自迴歸方法的有力替代，可解鎖加速採樣與傾斜等連續模態優勢。近期研究通過高斯分佈與one-hot編碼數據分佈間的簡單流匹配過程，實現離散數據的連續生成，並藉助分類流映射（CFMs）驗證了加速採樣的可行性，樣本質量具有競爭力。</p><p><a href="https://machinelearning.apple.com/research/scaling-categorical-flow-maps" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
