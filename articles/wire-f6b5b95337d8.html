<h1>威院地盤貨櫃辦公室昨晚冒煙　院方指醫院運作及病人服務不受影響</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869996_1_M_20260915012100.jpg" alt=""></p><h3>重點內容</h3><p>沙田威爾斯醫院一個地盤的貨櫃辦公室，昨晚9時許有濃煙冒出，無人受傷。</p><p>院方發言人回覆查詢時表示，接獲重建工程承建商通知，昨晚約9時46分，地盤內一個貨櫃發生火警，地盤職員隨即報警求助，消防接報後將火救熄。</p><p>院方表示事件中無人受傷，醫院運作及病人服務不受影響，已經責成承建商調查事件及採取措施，確保地盤的消防安全。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869996-20260915.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：威院地盤貨櫃辦公室昨晚冒煙　院方指醫院運作及病人服務不受影響</li></ul>
