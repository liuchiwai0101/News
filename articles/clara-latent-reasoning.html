<h1>Apple 提出 CLaRa：用連續潛在推理橋接檢索與生成</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>Apple 機器學習研究團隊提出 CLaRa，一種通過連續潛在推理橋接檢索與生成的新方法。該方法在檢索增強生成（RAG）中引入連續潛在空間，使模型在生成答案前先進行隱式推理，從而緩解長上下文帶來的性能下降。CLaRa 在多個知識密集型基準上提升了 LLM 的準確率與效率。</p><p><a href="https://machinelearning.apple.com/research/clara-latent-reasoning" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
