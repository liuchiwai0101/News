<h1>創夢天地折讓逾一成配股</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2024/07/01119-K.jpg" alt=""></p><h3>正文</h3><p>創夢天地(01119)公佈配股，每股配售價0.31元，較昨日收市價折讓約10.14%。</p><p>公司表示，擬將配售事項所得款項淨額約5663萬元，悉數用於AI智能體相關技術研發、遊戲產品運營推廣及遊戲研發。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/16984734-%e5%89%b5%e5%a4%a2%e5%a4%a9%e5%9c%b0%e6%8a%98%e8%ae%93%e9%80%be%e4%b8%80%e6%88%90%e9%85%8d%e8%82%a1" target="_blank" rel="noopener noreferrer">巴士的報</a>：創夢天地折讓逾一成配股</li></ul>
