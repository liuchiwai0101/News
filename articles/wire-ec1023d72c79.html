<h1>慈雲山男子私家車內被發現藏有懷疑含依託咪酯煙彈被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870746_1_M_20260919185346.jpg" alt=""></p><h3>重點內容</h3><p>一名36歲男子在慈雲山一輛私家車內，被發現藏有懷疑含有依託咪酯的煙彈，涉嫌管有危險藥物被捕。</p><p>警方早上9時許接獲市民報案，懷疑被捕男子在慈雲山道8號一輛停泊在路邊的私家車內暈倒，警員到場後，在私家車內檢獲4粒懷疑含有依託咪酯的煙彈，市值約1200元。</p><p>被捕男子亦涉嫌「沒有展示有效的車輛牌照」及「沒有展示配予該車輛的登記號碼」而被票控。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870746-20260919.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：慈雲山男子私家車內被發現藏有懷疑含依託咪酯煙彈被捕</li></ul>
