<h1>油麻地單位夫妻鬧離婚　夫慘遭玻璃樽撲頭披血</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞 · Yahoo 港聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/1e1f71662c8cc25bc74259dd920493642e03a6af5bda26c8cbcf3eddeb74a7c7/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fd29szjachogqwa.cloudfront.net%2Fimages%2Fuser-uploaded%2Fbkn-20261030080011762-1030-00822-001-01b_8474.jpg" alt=""></p><h3>正文</h3><p>一對夫妻在彌敦道458號美景大廈一單位疑因離婚問題發生爭執，期間妻子情緒激動，以玻璃樽襲擊丈夫頭部。警員到場經初步調查，以涉嫌「襲擊他人造成身體傷害」拘捕一名38歲女子，頭部流血紅腫清醒的丈夫則由救護車送往伊利沙伯醫院治理。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E6%B2%B9%E9%BA%BB%E5%9C%B0%E5%96%AE%E4%BD%8D%E5%A4%AB%E5%A6%BB%E9%AC%A7%E9%9B%A2%E5%A9%9A-%E5%A4%AB%E6%85%98%E9%81%AD%E7%8E%BB%E7%92%83%E6%A8%BD%E6%89%91%E9%A0%AD%E6%8A%AB%E8%A1%80-050818676.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：油麻地單位夫妻鬧離婚　夫慘遭玻璃樽撲頭披血</li></ul>
