<h1>政府澄清明早在哥連臣角火葬場附近一帶並沒有特別交通管制措施</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870762_1_M_20260919213507.jpg" alt=""></p><h3>重點內容</h3><p>網上流傳哥連臣角火葬場明早將有封路措施，禁止所有靈車及旅遊巴士進入。</p><p>政府發言人澄清，明早在哥連臣角火葬場附近一帶並沒有特別交通管制措施，已預約火化服務的車輛，可按現場警方及食環署職員的安排和指示，有序進出火葬場。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870762-20260919.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：政府澄清明早在哥連臣角火葬場附近一帶並沒有特別交通管制措施</li></ul>
