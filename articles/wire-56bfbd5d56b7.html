<h1>李家超稱會以多元方式支援院校　優先推動新田及洪水橋大學城建設</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870309_1_M_20260916192941.jpg" alt=""></p><h3>重點內容</h3><p>第一個五年規劃提出加快建設北都大學城，推動專上教育擴容提質。大學城總面積擴容至超過1000公頃。</p><p>行政長官李家超表示，政府會以免地價、貸款等多元方式支援院校，並優先推動新田及洪水橋大學城建設，目標最快2027年起有院校率先進駐。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870309-20260916.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：李家超稱會以多元方式支援院校　優先推動新田及洪水橋大學城建設</li></ul>
