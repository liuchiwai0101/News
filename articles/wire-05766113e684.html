<h1>澳洲選手失禁仍完賽惹議 公開道歉並放棄積分</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/8114/8657120528_e88bbb1cc5_b.jpg" alt=""></p><p>澳大利亞女將喬安娜·維特日克上週六在HYROX體能耐力賽北京站比賽期間失禁後仍堅持完賽並奪冠，引發衞生安全爭議。面對持續發酵的批評聲浪，她週四公開道歉，承認自己當時應該退賽，並宣佈放棄比賽成績積分。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/澳洲选手失禁仍完赛惹议-公开道歉并放弃积分/a-79322230?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：澳洲選手失禁仍完賽惹議 公開道歉並放棄積分</li></ul>
