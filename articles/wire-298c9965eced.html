<h1>寄往泰國的郵遞服務恢復正常</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>香港郵政今日（十一月三日）宣佈，接獲泰國郵政機關通知，早前受水浸而影響的郵件派遞服務，現已恢復正常。</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202611/03/P2026110300381.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：寄往泰國的郵遞服務恢復正常</li></ul>
