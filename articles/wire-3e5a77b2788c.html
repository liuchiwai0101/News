<h1>東盟盃港隊2:0挫汶萊　決賽對柬埔寨</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872235_1_M_20261001072657.jpg" alt=""></p><h3>正文</h3><p>國際足協東盟盃在啟德主場館上演第二場分組賽，中國香港以2:0擊敗汶萊，決賽將對柬埔寨。</p><p>換邊後不久，汶萊有球員犯規，經VAR介入後判罰紅牌，港隊以眾凌寡，陳肇鈞59分鐘接應右路傳中入楔頂入，為港隊打破僵局。</p><p>安永佳補時階段施射破網，幫港隊鎖定2:0勝局。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872235-20261001.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：東盟盃港隊2:0挫汶萊　決賽對柬埔寨</li></ul>
