<h1>美國針對中東地區發布新安全警報</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870804_1_M_20260920130952.jpg" alt=""></p><h3>重點內容</h3><p>美國駐中東多國大使館當地星期六發布新的安全警報，表示也門胡塞武裝對沙特發動新一輪襲擊，軍事衝突有可能迅速升級，建議身處中東地區的美國人保持高度警惕，並為旅程可能中斷做好準備。</p><p>沙特主導的多國聯軍發言人説，沙特防空部隊凌晨攔截一枚胡塞武裝向沙特首都利雅得發射的彈道導彈。胡塞武裝説，襲擊了利雅得的敏感目標，以及沙特阿美石油公司的設施。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870804-20260920.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：美國針對中東地區發布新安全警報</li></ul>
