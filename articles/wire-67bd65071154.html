<h1>巴基斯坦有警察檢查站爆炸　最少11死18傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871699_1_M_20260927020803.jpg" alt=""></p><h3>重點內容</h3><p>巴基斯坦有警察檢查站發生爆炸，最少11人死亡、18人受傷。</p><p>新華社引述警方消息人士報道，事發在當地星期六下午，警察檢查站位於巴基斯坦西北部開伯爾-普什圖省。事發時，檢查站附近正舉行群眾集會，死傷者中有警察和平民。</p><p>巴基斯坦官方緊急救援組織發言人説，救援工作仍在進行，救援人員在現場發現11具遺體，傷者被送往附近醫院救治，部分傷勢嚴重。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871699-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：巴基斯坦有警察檢查站爆炸　最少11死18傷</li></ul>
