<h1>元朗游泳池暫時關閉</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>電台及電視台當值宣佈員注意： 請盡快播出下列報告，並於適當時間重複廣播： 游泳人士請注意：康樂及文化事務署（康文署）今日（十一月二十三日）宣佈，由於元朗區的元朗游泳池發現有少量嘔吐物，現已暫時關閉，以便進行清潔消毒。 游泳池將於明日（十一月二十四日）上午六時三十分重開。 康文署呼籲泳客顧己及人，合力保持泳池清潔衞生，落水前不要吃得過飽，有需要應先使用洗手間。</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202611/23/P2026112300730.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：元朗游泳池暫時關閉</li></ul>
