<h1>GitHub Copilot app 初學者教程：用 My work 面板管理你的工作</h1>
<div class="notice">內容機器翻譯自第三方媒體（GitHub Blog），僅供參考，以原文為準。</div><p><img src="https://github.blog/wp-content/uploads/2026/08/Screenshot-2026-08-17-at-5.41.11-PM.png" alt=""></p><h3>重點內容</h3><p>GitHub Copilot app 的 My work 面板將拉取請求和問題集中在一處管理，內置 All、Active、Review requests、Done 四個默認視圖，並支持創建自定義視圖與過濾器。用户可從問題或拉取請求直接啓動新的智能體會話，也可批量選擇多個條目創建會話，還能在列表視圖和表格視圖間切換，並調整倉庫範圍或新建問題。</p><p><a href="https://github.blog/ai-and-ml/github-copilot/github-copilot-app-for-beginners-managing-your-work" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
