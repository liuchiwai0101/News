<h1>《環看天下》：手機短劇外國興起　英國成歐洲最大觀眾市場</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1877641_1_M_20261113084933.jpg" alt=""></p><h3>正文</h3><p>在手機上觀看「微短劇」的人越來越多。有數據顯示，上月份全球海外的微短劇前100大排行榜，有82部就由中國業界推出。</p><p>這股熱潮更加已擴展至外國。有報道指，今年上半年，印尼、印度、巴西、菲律賓和墨西哥為海外短劇APP下載量最大的5個國家，佔近6成半；而美國、日本、韓國、英國和巴西，是付費短劇淨收入最大的5個國家。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1877641-20261113.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：《環看天下》：手機短劇外國興起　英國成歐洲最大觀眾市場</li></ul>
