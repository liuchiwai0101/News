<h1>北京警告人工智能風險 專家：政治安全是其首要關切</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3893/14748862006_ecfb4beb13_b.jpg" alt=""></p><p>中國國安部部長陳一新發表有關人工智能安全的文章，引發國際媒體的關注。陳一新在文中特別強調，敵對勢力利用人工智能對中國實施輿論戰、認知戰，直接威脅到政治安全、制度安全、意識形態安全。德國之聲就此採訪墨卡託中國研究中心專家阿爾塞薩蒂。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/北京警告人工智能风险-专家：政治安全是其首要关切/a-79280247?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：北京警告人工智能風險 專家：政治安全是其首要關切</li></ul>
