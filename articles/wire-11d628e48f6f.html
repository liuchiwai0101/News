<h1>一名19歲女子懷疑墮入電話騙案　損失約100萬元</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869877_1_M_20260913225756.jpg" alt=""></p><h3>重點內容</h3><p>一名19歲女子懷疑墮入電話騙案，損失約100萬元。</p><p>警方表示，凌晨約1時接獲該名19歲女子從科技大學宿舍報案，表示接獲來電，對方聲稱為入境處職員，提及她與一宗「洗黑錢」案件有關。她按對方指示，將大約100萬元轉帳到指定户口。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869877-20260913.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：一名19歲女子懷疑墮入電話騙案　損失約100萬元</li></ul>
