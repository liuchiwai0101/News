<h1>菲律賓客輪起火事故增至35人死亡　仍有54人失聯</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869730_1_M_20260912011512.jpg" alt=""></p><h3>重點內容</h3><p>菲律賓巴拉望省附近海域客輪起火事故，增至35人遇難，仍有54人失聯。</p><p>事發在星期三晚，載有132人的客輪從首都馬尼拉出發後，在科倫鎮附近海域起火。菲律賓傳媒報道，目前有43人倖存，救援人員星期五晚在客輪上發現30具遺體。</p><p>當局發布的視像畫面顯示，客輪嚴重燒燬，現場可見灰燼和燒焦的金屬。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869730-20260912.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：菲律賓客輪起火事故增至35人死亡　仍有54人失聯</li></ul>
