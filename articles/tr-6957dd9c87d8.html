<h1>當“遺忘”無需成本：利用低影響力數據點降低機器學習計算開銷</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>蘋果機器學習研究團隊提出，在模型遺忘任務中，對訓練數據中影響可忽略的點無需逐一移除，從而降低計算成本。通過對比語言與視覺任務中的影響力函數，他們識別出對模型輸出影響極小的數據子集，並據此優化遺忘流程。該方法挑戰了現有遺忘技術對所有遺忘集數據點一視同仁的做法。</p><p><a href="https://machinelearning.apple.com/research/unlearning-low-influence-points" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
