<h1>簡啟恩：「軟對抗」變得隱蔽　未來要加強國安教育</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>重點內容</h3><p>負責國家安全的警務處副處長簡啟恩表示，拘捕書店相關人士的案件無濫捕，又説不能一概而論日後悼念六四事件有無問題，公眾要思考會否墮入法網。</p><p>今日起退休前休假的簡啟恩説，受到地緣政治影響，外國勢力幹預無減少，「軟對抗」變得隱蔽，未來要加強國安教育。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871069-20260922.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：簡啟恩：「軟對抗」變得隱蔽　未來要加強國安教育</li><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871031-20260922.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：簡啟恩：軟對抗變得隱蔽　並無因國安法及維護國家安全條例而減少</li></ul>
