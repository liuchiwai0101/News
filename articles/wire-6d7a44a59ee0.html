<h1>知情人士：習近平預計將當面要求特朗普停止對台軍售</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/2503/4217661984_fec1fcdf69_b.jpg" alt=""></p><p>特習會還未開始，台灣問題已成焦點。據知情人士向路透社透露，中國領導人習近平本週訪問華盛頓期間，預計將敦促美國總統特朗普根據1982年的一份中美聯合公報停止對台軍售，並指出習近平可能會在參觀美國國家檔案館時提出這一要求。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/知情人士：习近平预计将当面要求特朗普停止对台军售/a-79367747?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：知情人士：習近平預計將當面要求特朗普停止對台軍售</li></ul>
