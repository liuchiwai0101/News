<h1>習近平與夫人彭麗媛登上專機啟程回國　國事訪美行程圓滿結束</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>重點內容</h3><p>國家主席習近平圓滿結束國事訪問美國的三天行程。</p><p>習近平與夫人彭麗媛於當地星期五下午登上專機，啟程回國。</p><p>離開華盛頓時，美國政府高級官員到機場送行，機場鳴放21響禮炮。</p><p>在前往機場途中，華僑華人和留學生代表在道路兩旁，揮舞中美兩國國旗，熱烈祝賀習近平訪問圓滿成功。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871598-20260926.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：習近平與夫人彭麗媛登上專機啟程回國　國事訪美行程圓滿結束</li></ul>
