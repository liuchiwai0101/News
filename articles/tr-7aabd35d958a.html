<h1>Slack 如何構建人機智能體團隊：對話即知識</h1>
<div class="notice">內容機器翻譯自第三方媒體（Claude：Blog（網頁）），僅供參考，以原文為準。</div><p><img src="https://cdn.prod.website-files.com/68a44d4040f98a4adf2207b6/6a85fdd8c172c1f5ac0f312c_og_turning-conversation-into-knowledge-how-slack-builds-human-agent-teams.jpg" alt=""></p><h3>重點內容</h3><p>Slack 首席產品官 Jaime DeLanghe 分享了將對話轉化為機構知識、構建人機智能體團隊的最佳實踐。她主張默認使用公開頻道，讓智能體從可見對話中學習，並建議將會議、郵件、日曆等上下文連接起來以減少重複勞動。在 Slack 中由 Claude 驅動的智能體負責起草、總結、監控等生產工作，人類負責審查、決策與交接，形成循環協作。</p><p><a href="https://claude.com/blog/turning-conversation-into-knowledge-how-slack-builds-human-agent-teams" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
