<h1>商務部：延長對美國相關做法措施貿易壁壘調查期限</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872214_1_M_20261001003914.jpg" alt=""></p><h3>重點內容</h3><p>在北京，商務部公佈，決定延長對美國破壞全球產供鏈、美國阻礙綠色產品貿易相關做法和措施貿易壁壘調查的期限。</p><p>商務部今年3月發布公告，決定對美國破壞全球產供鏈相關做法和措施發起貿易壁壘調查，對美國阻礙綠色產品貿易相關做法和措施發起貿易壁壘調查。商務部近日再發公告，表示鑑於案情複雜，決定將兩宗調查期限延長至今年12月27日。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872214-20261001.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：商務部：延長對美國相關做法措施貿易壁壘調查期限</li></ul>
