<h1>伊朗稱下週一將在阿曼開會討論霍爾木茲海峽商運航線</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869732_1_M_20260912011606.jpg" alt=""></p><h3>重點內容</h3><p>伊朗外交部表示，伊朗、伊拉克等波斯灣沿岸國家，將於下星期一在阿曼舉行地區會議，就建立霍爾木茲海峽商業航運安全航線交換意見。</p><p>伊朗外交部在聲明中表示，今次會議旨在促進地區各國之間的相互瞭解，並有助於加強地區共同安全。</p><p>伊朗和阿曼都毗鄰霍爾木茲海峽，兩國已就相關水道未來的管理方式進行幾星期的討論。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869732-20260912.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：伊朗稱下週一將在阿曼開會討論霍爾木茲海峽商運航線</li></ul>
