<h1>港鐵藍田站連續兩日事故影響列車服務</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873955_1_M_20261014195149.jpg" alt=""></p><h3>正文</h3><p>港鐵藍田站連續兩日發生事故，今早月台機房有電線過熱冒煙，導致觀塘綫列車一度不停藍田站約一小時，港鐵向受影響乘客致歉，會調查與週二的事故有否關連。</p><p>運輸及物流局局長陳美寶要求港鐵深入及全面調查，並全面檢視系統的安全性，一個月內提交報告。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873955-20261014.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：港鐵藍田站連續兩日事故影響列車服務</li></ul>
