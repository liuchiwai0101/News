<h1>非華裔男子疑於黃石碼頭對開遇溺　送院後不治</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871702_1_M_20260927052027.jpg" alt=""></p><h3>重點內容</h3><p>西貢黃石碼頭對開昨晚懷疑有人遇溺，送院後不治。</p><p>警方在昨晚10時左右接獲途人報案，指懷疑有人於北潭路黃石碼頭對開約20米海面遇溺。</p><p>警方接報到場，將該名26歲非華裔男子救起，他昏迷被送往將軍澳醫院治理，其後證實死亡，死因有待驗屍後確定。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871702-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：非華裔男子疑於黃石碼頭對開遇溺　送院後不治</li></ul>
