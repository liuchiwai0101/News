<h1>小米發佈並開源 MiMo-V2.6 系列，擴展強化學習規模邁向自我提升</h1>
<div class="notice">內容機器翻譯自第三方媒體（小米 MiMo），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3893/14748862006_ecfb4beb13_b.jpg" alt=""></p><h3>AI 導讀</h3><p>Xiaomi MiMo 於今日正式發佈並開源 MiMo-V2.6 系列模型，包含 Pro 與 Flash 兩個原生全模態模型，稱這是探索 RSI（遞歸自我改進）路徑的關鍵一步。</p><h3>推薦理由</h3><p>官方給出 RL 訓練成本、步數與多項評測分數等細節，並同步開源權重與訓練環境，讀者可據此評估其性價比與復現價值。</p><p><a href="https://mp.weixin.qq.com/s?__biz=Mzk3NTkxMTM2NA%3D%3D&amp;amp;mid=2247484969&amp;amp;idx=1&amp;amp;sn=76c4757b26a2b646e1b690bf78c386d8" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
