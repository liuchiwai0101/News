<h1>彩雲邨觀日樓下午有高空墮物　7歲女童手部受傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871762_1_M_20260927210119.jpg" alt=""></p><h3>重點內容</h3><p>彩雲邨觀日樓下午有高空墮物，一名7歲女童手部受傷，暫未有人被捕。</p><p>警方下午近5時，接獲保安員報案，指觀日樓對開有女童懷疑被高處墮下的木塊擊中受傷。警方初步調查相信，女童是被一塊直徑約5吋的圓形木塊擊中，她接受治理後拒絕送院。</p><p>案件列作「高空墮物有人受傷」，交由黃大仙警區刑事調查隊跟進。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871762-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：彩雲邨觀日樓下午有高空墮物　7歲女童手部受傷</li></ul>
