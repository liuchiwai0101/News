<h1>丘應樺：外商對香港營商環境非常有信心</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871261_1_M_20260923193406.jpg" alt=""></p><h3>重點內容</h3><p>商務及經濟發展局局長丘應樺出席本台節目時表示，無論地緣政治如何，在商貿方面香港都佔有重要地位；又指數字顯示，外商對香港的營商環境非常有信心。</p><p>丘應樺又指，成立更多駐外地經貿辦，有助瞭解海外商機，協助香港及內地企業「出海」。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871261-20260923.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：丘應樺：外商對香港營商環境非常有信心</li><li><a href="https://hk.news.yahoo.com/%E6%96%BD%E6%94%BF%E5%A0%B1%E5%91%8A-%E4%B8%98%E6%87%89%E6%A8%BA-%E7%84%A1%E8%AB%96%E5%9C%B0%E7%B7%A3%E6%94%BF%E6%B2%BB%E6%B3%A2%E5%8B%95-%E5%A4%96%E5%95%86%E5%B0%8D%E9%A6%99%E6%B8%AF%E7%87%9F%E5%95%86%E7%92%B0%E5%A2%83%E6%9C%89%E4%BF%A1%E5%BF%83-012226180.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：施政報告｜丘應樺：無論地緣政治波動　外商對香港營商環境有信心</li></ul>
