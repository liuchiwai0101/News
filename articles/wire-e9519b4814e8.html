<h1>尼日利亞軍機失事墮河　機上32人全部罹難</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872812_1_M_20261006045344.jpg" alt=""></p><h3>重點內容</h3><p>尼日利亞一架載有32人的軍機，在西南部墜毀，機上全部人證實罹難。</p><p>事發在星期一早上，一架軍用飛機執行例行任務期間，在翁多州失事墮河，機上有25名乘客和7名機組人員。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872812-20261006.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：尼日利亞軍機失事墮河　機上32人全部罹難</li></ul>
