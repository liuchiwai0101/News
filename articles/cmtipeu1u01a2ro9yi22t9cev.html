<h1>路透社调查：美国 AI 数据中心现大量幽灵用电需求，得州等多州出手整治</h1>
<p>据路透社报道，美国中西部、中大西洋和南部地区超大型用电户（主要为数据中心）提出的用电申请已超过 700 吉瓦，超过全美数据中心实际用电量估计的十倍，其中相当一部分可能是重复提交或缺乏资金能力的幻象需求。</p>
