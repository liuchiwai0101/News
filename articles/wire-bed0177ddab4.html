<h1>李家超：扭轉生育率不易　冀克服結構因素</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870464_1_M_20260917192118.jpg" alt=""></p><h3>重點內容</h3><p>行政長官李家超出席《香港第一個五年規劃》及新一份《施政報告》的電台聯播節目。他表示，要扭轉生育率不容易，今次是因地制宜推出措施，希望克服結構因素。</p><p>有居於公屋的聽眾希望重推租置計劃；李家超表示，政府沒放棄租置計劃，房屋局會研究如何處理。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870464-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：李家超：扭轉生育率不易　冀克服結構因素</li></ul>
