<h1>深圳三方會晤談核裁軍，讓中國坐上“大人的桌子”？</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/65535/52442554861_d7215bda95_b.jpg" alt=""></p><h3>正文</h3><p>白宮週五宣佈，特朗普下週在深圳APEC會議期間將與普京和習近平舉行首次三方會晤，推動核裁軍，但美方官員預計不會達成協議。特朗普與習近平還將商討人工智能安全溝通渠道。美方官員稱，特朗普預計不會提及黃仁勳與黃樂的關係。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/深圳三方会晤谈核裁军，让中国坐上-大人的桌子-？/a-79947810?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：深圳三方會晤談核裁軍，讓中國坐上“大人的桌子”？</li></ul>
