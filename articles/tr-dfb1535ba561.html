<h1>WhatsApp 如何用端到端加密與可驗證性構建 Scam Alert 詐騙提醒功能</h1>
<div class="notice">內容機器翻譯自第三方媒體（Meta Engineering Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://engineering.fb.com/wp-content/uploads/2026/07/WhatsApp-Scam-Alert.png" alt=""></p><h3>重點內容</h3><p>WhatsApp 推出可選功能 Scam Alert，通過端到端加密保護下在設備端運行機器學習模型，識別潛在詐騙消息，且消息內容不會離開設備或自動上報。該功能遵循僅設備端處理、無自動上報、用户控制三大原則，模型權重公開供獨立驗證，遙測數據經差分隱私聚合處理。目前已在 Beta 版有限推出，並邀請安全研究社區參與測試。</p><p><a href="https://engineering.fb.com/2026/08/12/security/how-were-building-scam-alert-whatsapp" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
