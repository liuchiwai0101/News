<h1>Meta 廣告排序的多階段序列模型：從用户序列到 LLM 式擴展定律</h1>
<div class="notice">內容機器翻譯自第三方媒體（Meta Engineering Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://engineering.fb.com/wp-content/uploads/2026/05/Meta-Mult-stage-Ads-Ranking.png" alt=""></p><h3>重點內容</h3><p>Meta 推出多階段序列模型，將離線用户建模與在線排序解耦，並採用密集 token 化與目標感知注意力，使序列學習具備可預測的 LLM 式擴展定律。該架構已為 Instagram 轉化率帶來 6% 的累計提升，Facebook 轉化率提升 3%、廣告點擊量提升 3.5%，併成為 Meta 生成式廣告推薦模型（GEM）的核心組件。</p><p><a href="https://engineering.fb.com/2026/08/05/ml-applications/from-user-sequences-to-scaling-laws-a-multi-stage-architecture-for-metas-ads-ranking" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
