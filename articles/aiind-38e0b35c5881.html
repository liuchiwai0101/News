<h1>民主黨擬推「超級AI禁令」 比照核武級別罰則 違規恐判20年或公司死刑</h1>
<div class="notice">內容機器翻譯自第三方媒體（鉅亨網），僅供參考，以原文為準。</div><p><img src="https://cimg.cnyes.cool/prod/news/6649036/o/d3764fbbac4eeb2db3083c8add7a2aa1.jpg" alt=""></p><h3>正文</h3><p>美民主黨掌參眾兩院後，ASI禁令再受關注，提案主張全面禁止研發與部署超越人類掌控的人工超級智慧。&amp;#10;法案由桑德斯與卡薩爾提出，擬設AI部監管前沿模型，算力達10的25次方以上系統先強制暫緩。&amp;#10;違規企業恐被撤照、解散並沒收資產，個人最高20年監禁；市場憂技術定義不明將增估值風險。</p><h3>各方報道</h3><ul><li><a href="https://news.cnyes.com/news/id/6649036" target="_blank" rel="noopener noreferrer">鉅亨網</a>：民主黨擬推「超級AI禁令」 比照核武級別罰則 違規恐判20年或公司死刑</li></ul>
