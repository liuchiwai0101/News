<h1>大坳門路凌晨發生交通意外　電單車司機死亡</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870137_1_M_20260916042553.jpg" alt=""></p><h3>重點內容</h3><p>大坳門路凌晨發生致命交通意外，一名電單車司機死亡。</p><p>警方在午夜12時44分接獲報案，指大坳門路近清水灣二灘有電單車懷疑發生交通意外翻側。</p><p>警員到場後發現21歲電單車男司機受傷昏迷，送往將軍澳醫院搶救，其後在凌晨接近1時半證實不治。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870137-20260916.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：大坳門路凌晨發生交通意外　電單車司機死亡</li></ul>
