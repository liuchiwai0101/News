<h1>小童手臂卡車廂扶手 港鐵觀塘綫往調景嶺方向服務一度受阻</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2023/10/20231004_CR_港鐵調景嶺站03_source-bp_-e1700030361878.jpg" alt=""></p><h3>正文</h3><p>港鐵調景嶺站，一名小童的手臂懷疑不慎卡於扶手欄杆，需要協助解困，事件令觀塘綫往調景嶺方向的列車服務一度受阻。</p><p>有網民表示，列車突然廣播要求所有乘客在觀塘站落車，現場一度混亂。網上流傳的圖片顯示，調景嶺站外有消防車及救護車停候。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17041217-%e5%b0%8f%e7%ab%a5%e6%89%8b%e8%87%82%e5%8d%a1%e8%bb%8a%e5%bb%82%e6%89%b6%e6%89%8b-%e6%b8%af%e9%90%b5%e8%a7%80%e5%a1%98%e7%b6%ab%e5%be%80%e8%aa%bf%e6%99%af%e5%b6%ba%e6%96%b9%e5%90%91%e6%9c%8d%e5%8b%99" target="_blank" rel="noopener noreferrer">巴士的報</a>：小童手臂卡車廂扶手 港鐵觀塘綫往調景嶺方向服務一度受阻</li></ul>
