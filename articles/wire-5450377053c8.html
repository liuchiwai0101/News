<h1>貓眼如何啟發機器人的照相機技術發展</h1>
<div class="notice">內容機器翻譯自第三方媒體（BBC 中文），僅供參考，以原文為準。</div><p><img src="https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/6dfd/live/64147be0-b8ed-11f1-8220-a767279e7104.jpg" alt=""></p><h3>重點內容</h3><p>那一刻不僅救了他一命，也被認為啟發了肖發明用於道路標線的反光道路標記，在他的祖國英國通常被稱為「貓眼」（貓眼路釘）。</p><p>到肖於1976年去世時，貓眼已被生產了約1500萬枚。這些道路標記及其各種變體至今仍在世界各地的道路上使用。</p><h3>各方報道</h3><ul><li><a href="https://www.bbc.com/zhongwen/articles/crz9zd51289jo/trad?at_medium=RSS&amp;at_campaign=rss" target="_blank" rel="noopener noreferrer">BBC 中文</a>：貓眼如何啟發機器人的照相機技術發展</li></ul>
