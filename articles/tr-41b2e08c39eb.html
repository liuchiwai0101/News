<h1>歐盟《人工智能法案》透明度規則生效，違規最高罰 1500 萬歐元</h1>
<div class="notice">內容機器翻譯自第三方媒體（The Verge：AI（RSS）），僅供參考，以原文為準。</div><p><img src="https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/EU-AI-label-icons-hero.jpg?quality=90&amp;amp;strip=all&amp;amp;crop=0%2C10.732984293194%2C100%2C78.534031413613&amp;amp;w=1200" alt=""></p><h3>重點內容</h3><p>歐盟《人工智能法案》下的新透明度義務於 8 月 2 日生效，要求公司披露用户何時與 AI 模型互動，併為合成音視頻和文本添加機器可讀標記。歐盟還推出了一套可選的 AI 披露標籤供平台採用，但標註要求本身是強制性的。違規公司面臨最高 1500 萬歐元（約 1720 萬美元）或全球年營業額 3% 的罰款，8 月 2 日前推出的模型有 4 個月寬限期。</p><p><a href="https://www.theverge.com/ai-artificial-intelligence/974571/eu-ai-act-transparency-labels-rules-deepfakes" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
