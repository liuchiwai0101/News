<h1>中國歐盟商會：歐中貿易失衡不可持續</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3846/14667017161_22a3502fb3_b.jpg" alt=""></p><p>中國歐盟商會週二（9月22日）發佈最新年度報告，對中國國內消費疲軟以及由此帶來的出口強勁表示擔憂。根據中國的數據，今年頭8個月，歐盟對中國的貿易逆差高達2420億歐元，超過同期美國對中國的貿易逆差。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/中国欧盟商会：欧中贸易失衡不可持续/a-79376658?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：中國歐盟商會：歐中貿易失衡不可持續</li></ul>
