<h1>伊朗稱於霍爾木茲海峽捕獲美國無人潛航器</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871772_1_M_20260928002528.jpg" alt=""></p><h3>重點內容</h3><p>伊朗伊斯蘭革命衞隊發表聲明，指革命衞隊海軍在霍爾木茲海峽捕獲一艘正執行間諜任務的美國無人潛航器。</p><p>聲明強調，霍爾木茲海峽處於封鎖狀態，將持續並果斷應對這條戰略水道內的危險活動，以及未經授權的航行行為。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871772-20260928.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：伊朗稱於霍爾木茲海峽捕獲美國無人潛航器</li></ul>
