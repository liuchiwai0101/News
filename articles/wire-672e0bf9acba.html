<h1>日本群馬縣有豬場爆發豬瘟疫情</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873496_1_M_20261011153648.jpg" alt=""></p><h3>重點內容</h3><p>群馬縣政府表示，涉事農場過去的星期五通報，有幼豬出現腹瀉等疑似豬瘟症狀，當局隨後派員到農場檢查，檢測結果證實農場飼養的豬感染豬瘟。</p><p>農林水產省説，將採取屠宰、焚燒及掩埋等防疫措施，徹底消毒農場，防止野生動物進入，並派流行病學調查小組，實地調查傳播途徑。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873496-20261011.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：日本群馬縣有豬場爆發豬瘟疫情</li></ul>
