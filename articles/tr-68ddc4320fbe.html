<h1>Linear 如何構建 Linear Agent：在系統提示詞、工具設計與系統技能中劃定邊界</h1>
<div class="notice">內容機器翻譯自第三方媒體（Linear：Now（RSS）），僅供參考，以原文為準。</div><p><img src="https://webassets.linear.app/images/ornj730p/production/dae4b553082699cef05f6074d9e81b4c1cb187a4-2400x1350.jpg?q=95&amp;amp;auto=format&amp;amp;dpr=2" alt=""></p><h3>重點內容</h3><p>Linear Agent 的價值在於完成未預設的工作，因此團隊未為其編寫固定路徑，而是通過系統提示詞、工具設計、產品模型、運行範圍及底層自定義 harness 劃定邊界。系統提示詞聚焦溝通風格、硬性邊界與產品概念解釋；工具設計將約束編碼進參數，使無效操作難以執行。團隊還引入系統技能作為組合單元，按需漸進加載，避免一次性暴露過多上下文。</p><p><a href="https://linear.app/now/how-we-built-linear-agent" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
