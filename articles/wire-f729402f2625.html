<h1>亞殘運田徑　多名港隊代表完成100米短跑賽事</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874754_1_M_20261021125252.jpg" alt=""></p><h3>正文</h3><p>亞殘運田徑項目，港隊上午出戰兩項100米決賽。</p><p>女子方面，任國芬在T36級100米賽事，跑出今季最佳的15秒76，取得第5名。隊友王穎晞及餘春麗分別以15秒81及18秒28完成賽事，排名第6及第7。賽事由國家隊代表史逸婷，以13秒56奪得金牌。</p><p>男子T35級100米決賽方面，港隊代表鮑錐耀，以14秒96完成賽事，取得第6名。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874754-20261021.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：亞殘運田徑　多名港隊代表完成100米短跑賽事</li></ul>
