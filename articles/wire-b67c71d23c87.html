<h1>歐盟擬設中國混動車進口配額 最快12月生效</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3893/14748862006_ecfb4beb13_b.jpg" alt=""></p><h3>正文</h3><p>歐盟與中國上週就混動汽車貿易達成「諒解」。週日，彭博、《金融時報》等媒體消息指出，歐盟擬將2027年中國混合動力汽車進口量限制在每年35萬輛，超出配額的車輛可能面臨額外關税。這項安排旨在緩解歐中貿易緊張，為雙方重新平衡貿易關係爭取空間。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/歐盟擬設中國混動車進口配額-最快12月生效/a-79636608?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：歐盟擬設中國混動車進口配額 最快12月生效</li></ul>
