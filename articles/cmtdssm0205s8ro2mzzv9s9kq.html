<h1>Cursor回应OpenAI将封禁其模型访问</h1>
<div class="notice">內容機器翻譯自第三方媒體（X：Michael Truell (@mntruell)），僅供參考，以原文為準。</div>正文 · AI 翻译<p>我们很遗憾地看到，OpenAI 发布声明称计划在三个月内阻止 Cursor 用户访问 OpenAI 模型。</p><p>OpenAI 模型承载了约 5% 的 Cursor 用户流量，我们正在与 OpenAI 团队沟通以解决此事。</p><p>Cursor 是 OpenAI 最早的客户之一，多年来我们与他们的团队密切合作，并且我们一直信赖他们的平台能作为我们业务的中立基础设施。</p>
