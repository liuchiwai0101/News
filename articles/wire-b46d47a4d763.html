<h1>大埔輕型貨車疑撞斃72歲過路婦人　68歲司機被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870671_1_M_20260918230842.jpg" alt=""></p><h3>重點內容</h3><p>大埔發生致命交通意外，一名72歲婦人死亡，警方拘捕一名68歲司機。</p><p>事發在下午3時許，一輛輕型貨車駛至大埔安泰路及安邦路交界時，懷疑撞倒該名正在行人過路處過路的婦人，她頭部受傷，昏迷送往威爾斯親王醫院治理，其後至晚上7時許不治。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870671-20260918.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：大埔輕型貨車疑撞斃72歲過路婦人　68歲司機被捕</li></ul>
