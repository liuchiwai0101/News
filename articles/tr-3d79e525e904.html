<h1>超越下一個 token 預測：擴散語言模型與自迴歸語言模型的性能對比研究</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>蘋果機器學習研究團隊系統對比了擴散語言模型（DLMs）與自迴歸語言模型（ARMs）的性能表現。ARMs 雖在多項 NLP 任務上精度領先，但因逐 token 生成的順序依賴導致算術強度較低。DLMs 作為新興範式展現出潛力，研究對其性能特徵進行了詳細刻畫。</p><p><a href="https://machinelearning.apple.com/research/diffusion-autoregressive-performance" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
