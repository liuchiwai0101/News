<h1>Google 大規模 AI 組織調整背後的混亂政治</h1>
<div class="notice">內容機器翻譯自第三方媒體（The Verge：AI（RSS）），僅供參考，以原文為準。</div><p><img src="https://platform.theverge.com/wp-content/uploads/sites/2/2026/08/gettyimages-2276578156.jpg?quality=90&amp;amp;strip=all&amp;amp;crop=0%2C10.752607989199%2C100%2C78.494784021602&amp;amp;w=1200" alt=""></p><h3>重點內容</h3><p>Google 宣佈迄今最大規模 AI 組織調整：Demis Hassabis 卸任 DeepMind 日常管理以專注 AGI 研究，CTO Koray Kavukcuoglu 接任；27 年老將 Jeff Dean 與三位頂級研究員離職創辦 AI 初創公司。內部員工認為調整源於產品提速壓力、Hassabis 影響力下降及與美國國防部合作引發的倫理衝突。</p><p><a href="https://www.theverge.com/tech/976108/google-ai-leadership-shakeup-jeff-dean-demis-hassabis-deepmind" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
