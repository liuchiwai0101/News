<h1>亞運女子自由泳接力賽　港隊總成績第四晉身決賽</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870802_1_M_20260920130651.jpg" alt=""></p><h3>重點內容</h3><p>名古屋亞運游泳賽事，港隊在女子4X100自由泳接力項目，初賽總成績第四名，晉身今晚舉行的決賽。</p><p>賽事共有10隊、分兩組比賽，總成績前八名晉級。</p><p>港隊派出馬紫玲、王欣桐、李芯瑤、簡綽桐出戰，游出3分45秒39時間，小組首名躋身決賽。上屆杭州亞運銅牌功臣之一、「女飛魚」何詩蓓就未有在初賽亮相。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870802-20260920.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：亞運女子自由泳接力賽　港隊總成績第四晉身決賽</li></ul>
