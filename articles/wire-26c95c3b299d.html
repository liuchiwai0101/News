<h1>瀑布灣八旬翁浮屍岸邊 死因待查</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞 · Yahoo 港聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/c48aa133f37243c91c4a04bb87e05cf96e7663f217f5635a1f4a8e01ecfbb965/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fmedia.zenfs.com%2Fen%2Fam730_578%2Fc6ed0b9861f34fdb584469fb709a2848.jpg" alt=""></p><h3>正文</h3><p>香港仔瀑布灣道一石灘，週二（27日）下午3時許，警方接獲途人報案，指發現有一名男子在岸邊漂浮。警方消防接報到場，當場證實男子死亡。經調查死者80歲姓梁，其死因有待調查，案件被列作屍體發現跟進。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E7%80%91%E5%B8%83%E7%81%A3%E5%85%AB%E6%97%AC%E7%BF%81%E6%B5%AE%E5%B1%8D%E5%B2%B8%E9%82%8A-%E6%AD%BB%E5%9B%A0%E5%BE%85%E6%9F%A5-020335984.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：瀑布灣八旬翁浮屍岸邊 死因待查</li></ul>
