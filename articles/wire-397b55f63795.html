<h1>荃灣近水灣泳灘早泳　89歲婦人遇溺不治</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871706_1_M_20260927082559.jpg" alt=""></p><h3>重點內容</h3><p>荃灣近水灣泳灘發生泳客遇溺意外，一名89歲婦人不治。</p><p>事發清晨約5時20分，有人報案，指一名遊早泳的老婦出海約一小時仍未見回岸蹤影。</p><p>消防接報到場，其後在海上救起一名婦人，送往仁濟醫院後證實不治。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871706-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：荃灣近水灣泳灘早泳　89歲婦人遇溺不治</li></ul>
