<h1>曼谷暴雨成災　多條主要幹道水浸　機場暫維持正常運作</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871687_1_M_20260926203857.jpg" alt=""></p><h3>重點內容</h3><p>曼谷48小時內累計雨量接近300毫米，多條主要幹道水浸，路透社的畫面見到，部分路段水深及腰，有汽車拋錨。</p><p>曼谷市長差察説，暴雨引發的危機可能危及民眾生命安全或造成財產損失；政府會借用學校作臨時避難中心，呼籲住在運河一帶的居民盡快撤離。</p><p>曼谷機場目前維持正常運作，當局建議前往機場的旅客，提早兩三小時出發。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871687-20260926.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：曼谷暴雨成災　多條主要幹道水浸　機場暫維持正常運作</li></ul>
