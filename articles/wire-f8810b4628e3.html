<h1>中大新傳學院網站一度被導向至博彩網頁　中大稱無發現資料外洩</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870111_1_M_20260915213357.jpg" alt=""></p><h3>重點內容</h3><p>中大新聞與傳播學院網站，一度被導向至博彩網頁，已即時暫停網站運作，現階段沒有發現個人敏感資料外洩。</p><p>中大表示，新聞與傳播學院早上發現事件，學院已呈報大學資訊科技服務處跟進保安事宜，學院正修復網站及調查事件。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870111-20260915.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：中大新傳學院網站一度被導向至博彩網頁　中大稱無發現資料外洩</li></ul>
