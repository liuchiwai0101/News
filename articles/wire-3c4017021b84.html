<h1>荷里活廣場襲擊案　被告承認兩項誤殺罪被判無限期醫院令</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871065_1_M_20260922120700.jpg" alt=""></p><h3>重點內容</h3><p>一名男子涉嫌2023年在鑽石山荷里活廣場以刀襲擊兩名女子，兩人傷重不治。被告今早在高等法院被判處無限期醫院令。</p><p>40歲多歲的被告基於減責神智失常，承認兩項誤殺罪。法官杜麗冰指出，案件是悲劇，根據精神科報告建議，判被告無限期醫院令。</p><p>案情指，被告2023年6月2日在荷里活廣場3樓殺害兩名女子。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871065-20260922.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：荷里活廣場襲擊案　被告承認兩項誤殺罪被判無限期醫院令</li></ul>
