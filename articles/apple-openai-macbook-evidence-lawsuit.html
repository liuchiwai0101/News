<h1>Apple 指控 OpenAI 竊密　展示 MacBook 關鍵證據</h1>
<p>Apple 在與 OpenAI 的持續訴訟中提交新文件，並推動加快證據開示程序。根據最新文件，Apple 指稱對前工程師 Chang Liu 使用的筆記本電腦進行初步法證檢查後，發現了「令人震驚的證據」。該訴訟始於今年七月，Apple 指控前員工為 OpenAI 利益竊取商業機密，並隨後申請初步禁令及要求法院加快包括早期文件生產和關鍵人員供詞在內的調查程序。OpenAI 則呼籲駁回此案。 MacBook 檢查揭示四項違規 Chang Liu 曾是 Apple…</p>
