<h1>土耳其伊斯坦布爾槍擊案最少3死1傷　一名疑兇被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870133_1_M_20260916024830.jpg" alt=""></p><h3>重點內容</h3><p>土耳其伊斯坦布爾發生槍擊案，造成最少3死1傷。</p><p>當地傳媒報道，案發在星期二下午，法提赫區一間找換店的東主懷疑與顧客爭執，之後有人開槍，造成多人受傷。</p><p>報道指伊斯坦布爾警方在現場拘捕一名疑兇，但未有公佈其身分；當局仍在調查案件。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870133-20260916.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：土耳其伊斯坦布爾槍擊案最少3死1傷　一名疑兇被捕</li></ul>
