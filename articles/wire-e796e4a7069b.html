<h1>一紙禁令逼機主,忍痛排長隊;滿城拋售無人機,二手價暴跌</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3094/2381363327_7c5589d3a1_b.jpg" alt=""></p><p>不久前，北京出台了新規，不僅僅全市範圍內禁飛無人機，還禁止民眾在自家存放無人機，期限是11月15日。最近幾天，北京的無人機持有者紛紛湧向指定回收點，希望能高價出售無人機。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/一纸禁令逼机主-忍痛排长队-满城抛售无人机-二手价暴跌/a-79338850?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：一紙禁令逼機主,忍痛排長隊;滿城拋售無人機,二手價暴跌</li></ul>
