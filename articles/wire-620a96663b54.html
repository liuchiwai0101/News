<h1>漁護署加強三個營地管理及垃圾收集　衞生秩序良好</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872633_1_M_20261004145832.jpg" alt=""></p><h3>正文</h3><p>漁護署表示，按計劃加強三個營地的管理及垃圾收集，包括鹹田灣、浪茄灣和西灣，並加派人員日夜巡邏同駐守，向營友宣傳露營禮儀及應有行為，並對違規行為果斷執法。</p><p>署方表示，三個營地昨晚共有約240個帳篷。駐守三個營地的工作人員在夜間、凌晨和早上加強巡邏，無發現違規情況。</p><p>根據現場觀察，營友早上離開時都將營地收拾乾淨，自備膠袋帶走垃圾，營地衞生和秩序良好。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872633-20261004.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：漁護署加強三個營地管理及垃圾收集　衞生秩序良好</li></ul>
