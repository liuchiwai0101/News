<h1>2026年夏季開源模型生態觀察：中國前沿模型規模領先，AMD與NVIDIA主導發佈量</h1>
<div class="notice">內容機器翻譯自第三方媒體（Hugging Face：Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://huggingface.co/blog/assets/state-of-open-models-summer-2026/thumbnail.png" alt=""></p><h3>重點內容</h3><p>2026年1至8月，Hugging Face公開模型倉庫從243萬增至296萬，但85.6%的模型下載量不足200次，1.5%的倉庫佔據99.2%下載量。中國實驗室月度最大開源模型參數規模在754B至2.78萬億之間，美國實驗室七個月中五個月低於130B。AMD與NVIDIA各發布超200個新模型倉庫，成為發佈開源模型最多的機構。</p><p><a href="https://huggingface.co/blog/state-of-open-models-summer-2026" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
