<h1>贛鋒鋰業季度盈利升近36%  首三季升逾195倍</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2024/06/20231206_FI_source-web_01772.jpg" alt=""></p><h3>正文</h3><p>贛鋒鋰業(01772)公佈，截至9月30日止第三季盈利約7.55億元（人民幣．下同），升35.6%，每股盈利36分，扣除非經常性損益之盈利7.8億元，升28倍。</p><p>首三季盈利50億元，升195.4倍，每股盈利2.4元，扣除非經常性損益之盈利46.4億元，升5.9倍，營業收入361億元，升1.5倍，主因鋰系列產品售價回升及鋰電池系列產品銷量增加所致。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/16984613-%e8%b4%9b%e9%8b%92%e9%8b%b0%e6%a5%ad%e5%ad%a3%e5%ba%a6%e7%9b%88%e5%88%a9%e5%8d%87%e8%bf%9136-%e9%a6%96%e4%b8%89%e5%ad%a3%e5%8d%87%e9%80%be195%e5%80%8d" target="_blank" rel="noopener noreferrer">巴士的報</a>：贛鋒鋰業季度盈利升近36%  首三季升逾195倍</li></ul>
