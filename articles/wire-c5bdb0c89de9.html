<h1>亞運網球女單項目國家隊包辦金銀牌　實現六連冠</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872469_1_M_20261002204059.jpg" alt=""></p><h3>重點內容</h3><p>名古屋亞運網球女單項目，國家隊球手包辦金銀牌，王曦雨在決賽以盤數2:0擊敗隊友張帥，取得金牌。國家隊在這個項目實現六連冠。</p><p>王曦雨在第一盤表現明顯佔優，張帥出現較多失誤，兩度被破發，王曦雨先以6:2贏首盤；第二盤張帥形勢繼續處於下風，只保住一個發球局，最終王曦雨以6:1再下一城，奪得金牌。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872469-20261002.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：亞運網球女單項目國家隊包辦金銀牌　實現六連冠</li></ul>
