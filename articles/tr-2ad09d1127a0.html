<h1>GRPO 超越英語：多語言與非英語環境下的大規模研究</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>一項大規模實證研究考察了 GRPO 在多語言和非英語環境下的表現，覆蓋多種基礎模型、訓練語言及推理語言獎勵設置。研究發現，以母語進行推理訓練與英語推理訓練之間的性能差距很小，表明 RLVR 在非英語場景下同樣有效。該研究為多語言推理模型的強化學習訓練提供了重要參考。</p><p><a href="https://machinelearning.apple.com/research/grpo-beyond-english" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
