<h1>小紅書聯合浙大、復旦提出 CULTURE-MT：首個面向社媒翻譯的「文化有效性」評測基準，入選 ICML 2026</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：小紅書技術（dots.llm）），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/e2d90aa3-a20a-4720-9149-e0385015f94d/thumb/" alt=""></p><h3>重點內容</h3><p>小紅書聯合浙江大學、復旦大學提出 CULTURE-MT，這是首個面向中英社媒筆記翻譯、兼顧文化符號傳遞與情感共鳴的評測基準，並首次提出「文化有效性」評估標準與自動評估模型 JUDGER（準確率 86.03%）。</p><p><a href="https://mp.weixin.qq.com/s?__biz=Mzg4OTc2MzczNg%3D%3D&amp;mid=2247496008&amp;idx=1&amp;sn=08f2ce717483f63bc00a2181e59e3f40" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
