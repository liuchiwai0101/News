<h1>在俄羅斯無人機轟炸中，烏克蘭鐵路冒著恐懼匍匐前進</h1>
<div class="notice">內容機器翻譯自第三方媒體（BBC 中文），僅供參考，以原文為準。</div><p><img src="https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/c0d8/live/c6492e40-c0be-11f1-a64c-550be9e3c66b.jpg" alt=""></p><h3>重點內容</h3><p>自2022年俄羅斯全面入侵以來，烏克蘭鐵路一直維繫着國家運轉。但據國有營運商表示，攻擊正不斷加劇，自那時以來所有針對機車的襲擊中，超過一半都發生在今年。</p><p>來自哈爾科夫（Kharkiv），27歲的市場營銷專員尤利婭·波諾馬連科（Yuliia Ponomarenko）上月前往華沙途中，在接近烏克蘭與波蘭邊境時，旅程突然中斷。</p><h3>各方報道</h3><ul><li><a href="https://www.bbc.com/zhongwen/articles/cqdjv34xrmd3o/trad?at_medium=RSS&amp;at_campaign=rss" target="_blank" rel="noopener noreferrer">BBC 中文</a>：在俄羅斯無人機轟炸中，烏克蘭鐵路冒著恐懼匍匐前進</li></ul>
