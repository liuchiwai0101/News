<h1>警方將軍澳區內打擊單車違法行為　票控7名青年</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871733_1_M_20260927151602.jpg" alt=""></p><h3>重點內容</h3><p>警方持續打擊非法使用電動可移動工具以及單車違法行為，近日在將軍澳區內以傳票方式檢控7名介乎14至17歲青年，涉及「夜間或能見度低時未亮前白後紅車燈」及「沒有明顯需要在行人路騎踏單車」等違法行為。</p><p>警方表示，將會持續執法，打擊不同類型的違法行為，確保道路安全，呼籲公眾為自己及其他道路使用者的生命及財產安全，應遵守交通規則。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871733-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：警方將軍澳區內打擊單車違法行為　票控7名青年</li></ul>
