<h1>海螺水泥季度淨利按年跌近89%</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="https://image.bastillepost.com/640x/wp-content/uploads/hongkong/2025/03/20230731_FI_source-web_00914.jpg" alt=""></p><h3>正文</h3><p>海螺水泥(00914)公佈，截至9 月30日第三季度，經調整後歸屬上市公司股東淨利2.16億元(人民幣‧下同)，按年跌88.92%。 扣除非經損益淨利潤1.06億元，按年跌93.92%。 營業收入192.96億元，按年跌3.83%。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17065358-%e6%b5%b7%e8%9e%ba%e6%b0%b4%e6%b3%a5%e5%ad%a3%e5%ba%a6%e6%b7%a8%e5%88%a9%e6%8c%89%e5%b9%b4%e8%b7%8c%e8%bf%9189" target="_blank" rel="noopener noreferrer">巴士的報</a>：海螺水泥季度淨利按年跌近89%</li></ul>
