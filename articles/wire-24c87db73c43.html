<h1>海關於文錦渡入境運菜貨車檢市值188萬元懷疑私煙</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>重點內容</h3><p>海關前日在文錦渡管制站檢獲約36萬支懷疑私煙，估計市值約188萬元，應課税值約118萬元。</p><p>海關人員當日在管制站截查一輛報稱載有蔬菜的入境貨車。經檢查後，在車上63個發泡膠箱內發現混雜於蔬菜中的懷疑私煙。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872413-20261002.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：海關於文錦渡入境運菜貨車檢市值188萬元懷疑私煙</li></ul>
