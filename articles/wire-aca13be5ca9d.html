<h1>流浮山鳳降村一個貨倉發生三級火　消防到場撲救</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870428_1_M_20260917143816.jpg" alt=""></p><h3>重點內容</h3><p>流浮山鳳降村一個貨倉發生三級火警。消防員動用兩條喉及兩隊煙帽隊灌救，暫未接獲受傷報告。</p><p>消防處表示，下午1時15分接獲報告指鳳降村一個貨倉發生火警，並於下午1時29分將火警升為三級。消防人員正進行滅火行動。</p><p>處方表示，如市民受到隨風飄散的煙霧和異味影響，請關閉門窗及保持鎮定。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870428-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：流浮山鳳降村一個貨倉發生三級火　消防到場撲救</li></ul>
