<h1>特朗普在白宮為習近平舉行歡迎儀式</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871453_1_M_20260924221524.jpg" alt=""></p><h3>重點內容</h3><p>美國總統特朗普在白宮，為國事訪問美國的國家主席習近平，舉行隆重歡迎儀式。</p><p>特朗普與夫人梅拉尼婭，當地時間星期四早上，在白宮親自迎接習近平與夫人彭麗媛。習近平與特朗普握手。</p><p>參與這場在白宮南草坪、國事廳及玫瑰園舉行的歡迎儀式的包括來自美軍各軍種超過470名軍人。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871453-20260924.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：特朗普在白宮為習近平舉行歡迎儀式</li></ul>
