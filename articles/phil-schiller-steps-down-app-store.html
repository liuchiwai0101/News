<h1>Phil Schiller 卸任 App Store 及 Apple 活動負責人　由服務團隊接管</h1>
<p>根據彭博社最新報導，Apple 資深高管 Phil Schiller 已卸任領導 App Store 及 Apple 活動的職務。這一變動標誌著他在 Apple 數十載職業生涯中的又一進展。Schiller 此前自 2020 年起擔任「Apple Fellow」，負責相關業務直至現在。 轉為參與未指明項目 儘管不再主管…</p>
