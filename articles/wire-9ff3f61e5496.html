<h1>女子行李藏約150萬元大麻花　被海關拘捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869728_1_M_20260911223939.jpg" alt=""></p><h3>重點內容</h3><p>一名抵港旅客被發現寄艙行李內有約7.5公斤懷疑大麻花，市值約150萬元，被海關拘捕。</p><p>涉事的31歲內地女旅客今日從泰國曼谷經台灣飛抵本港。海關表示，會繼續根據情報分析，加強打擊販運毒品活動，同時呼籲市民提高警覺，切勿貪圖金錢利益而參與販毒活動，不要接受任何人士聘請或委託運送受管制物品進出香港，亦切勿於未確定物品屬性的情況下，貿然協助他人運送。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869728-20260911.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：女子行李藏約150萬元大麻花　被海關拘捕</li></ul>
