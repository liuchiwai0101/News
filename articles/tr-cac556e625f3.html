<h1>Mojo 語言正式開源，編譯器與工具鏈全面開放</h1>
<div class="notice">內容機器翻譯自第三方媒體（Hacker News 熱門（buzzing.cc 中文翻譯）），僅供參考，以原文為準。</div><p><img src="https://cdn.prod.website-files.com/68c9c3107effc2ea46e1a82c/6a84597ae2a73bd4973f801f_Mojo-OSS-Blog-Compressed.jpeg" alt=""></p><h3>重點內容</h3><p>Mojo🔥 語言現已正式開源，採用 Apache 2.0 許可證（含 LLVM 例外），編譯器、工具鏈及全部源碼已發佈至 modular GitHub 倉庫。Mojo 上週剛達成 1.0 版本（源碼穩定），此次開源涵蓋整個編譯器與工具鏈。目前暫不接受編譯器相關貢獻，計劃年底前開放，標準庫自 2024 年起已接受社區貢獻。</p><p><a href="https://www.modular.com/blog/mojo-open-source" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
