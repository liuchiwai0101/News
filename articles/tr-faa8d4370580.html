<h1>GLM-5.3上線：AA智能指數60分並列開源第一，成本更低</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：智譜（GLM）），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/15e3a534-b721-4500-92c6-4b4bc8a2fbda/thumb/" alt=""></p><h3>重點內容</h3><p>GLM-5.3 API即日上線，擅長複雜編碼、防禦性網絡安全與長程任務，在AA綜合智能指數中取得60分，與Claude Fable 5、GPT-5.6 Sol等閉源旗艦同級，並與Kimi K3並列開源模型第一。該模型以更小參數規模和更低調用成本降低前沿智能門檻，單任務成本為旗艦模型中最低。API定價與GLM-5.2持平，模型權重將於下週五開源。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzkyMzI3NzQ0Mg%3D%3D&amp;mid=2247494105&amp;idx=1&amp;sn=8d7409e0fb846a3c7803c142b5d1a8e7" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
