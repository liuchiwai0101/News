<h1>海關檢134支減肥針劑市值約10萬元　拘捕一名女子</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872746_1_M_20261005140544.jpg" alt=""></p><h3>正文</h3><p>海關檢獲134支懷疑含有第一部毒藥的減肥針劑，估計市值約10萬元。</p><p>關員本月2日在空郵中心查驗一件從日本抵港的郵包，在包裹內發現並檢獲54支懷疑含有第一部毒藥的受管制減肥針劑。</p><p>跟進調查後，關員同日採取監控遞送行動，在屯門的收貨住宅地址拘捕30歲的女收件人，並在上址再檢獲80支懷疑含有第一部毒藥的受管制減肥針劑。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872746-20261005.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：海關檢134支減肥針劑市值約10萬元　拘捕一名女子</li></ul>
