<h1>一艘移民船在英倫海峽傾覆　造成3人死亡</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871899_1_M_20260928205010.jpg" alt=""></p><h3>重點內容</h3><p>法國傳媒引述當地救援部門報道，涉事船隻當地星期一載著105人，從法國北部加來海峽省出發，試圖穿越英倫海峽，但在加來海峽省維桑附近傾覆，造成3人死亡、4人輕傷。</p><p>近年有不少來自非洲及中東的民眾為躲避戰亂逃至歐洲，其中部分人從法國經英倫海峽偷渡至英國，不時發生偷渡船傾覆事件。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871899-20260928.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：一艘移民船在英倫海峽傾覆　造成3人死亡</li></ul>
