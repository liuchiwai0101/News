<h1>Cloudflare 如何用軟件工廠將 Astro 的 GitHub issue 數降至零</h1>
<div class="notice">內容機器翻譯自第三方媒體（Cloudflare Blog），僅供參考，以原文為準。</div><p><img src="https://blog.cloudflare.com/_emdash/api/media/file/01KZ4K04GMZNVQZJVRZ5MVH1HX.png" alt=""></p><h3>重點內容</h3><p>Cloudflare 在 Astro 倉庫上運行自動化 triage 流水線，通過隔離的 AI 子代理復現、診斷並修復 bug，將開放 issue 從 200 多個降至約 30 個，預計下月歸零。該流水線由 issue 標籤驅動，修復後自動發佈預覽版本供用户驗證。其底層引擎已發展為 Flue，一個開源的平台無關框架，用於構建持久化智能體與工作流。</p><p><a href="https://blog.cloudflare.com/astro-issue-triage" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
