<h1>國慶黃金周第二天截至晚上9時逾95萬人次出入境</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872488_1_M_20261002230031.jpg" alt=""></p><h3>正文</h3><p>內地國慶黃金周第二天，入境處表示，今日截至晚上9時，本港有超過95萬4千人次經各管制站出入境。</p><p>當中，有近47萬8千人次入境，內地旅客佔超過22萬7千人次，最多內地旅客經西九龍高鐵站入境。</p><p>出境有超過47萬7千人次，本港居民佔近28萬人次，最多港人經羅湖口岸出境。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872488-20261002.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：國慶黃金周第二天截至晚上9時逾95萬人次出入境</li></ul>
