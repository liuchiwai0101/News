<h1>米埔5隻唐狗懷疑被人下毒致死　警方列作「殘酷對待動物」案處理</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874384_1_M_20261018172821.jpg" alt=""></p><h3>正文</h3><p>警方拘捕一名45歲女子，涉嫌殘酷對待動物，她獲準保釋，下月上旬向警方報到。</p><p>警方本月14日接獲途人報案，指在天水圍洪安裏一間店鋪，發現一隻貓被放置於一個沒有食水及糧食的籠內，懷疑該貓隻曾被人不恰當對待。經初步調查，拘捕該名懷疑涉事女子。</p><p>案件由元朗警區刑事支援隊跟進。該貓隻已交由相關機構人員照顧及作進一步檢查。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874384-20261018.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：米埔5隻唐狗懷疑被人下毒致死　警方列作「殘酷對待動物」案處理</li></ul>
