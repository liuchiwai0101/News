<h1>陳茂波：市場對中美元首會面解讀正面</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871677_1_M_20260926192655.jpg" alt=""></p><h3>重點內容</h3><p>中美元首於美國會晤，財政司司長陳茂波相信，市場對會面後訊息解讀比較積極正面，投資者佈局亦會比較安心。</p><p>陳茂波認為，香港只要不斷提升競爭力，守穩金融安全底線，就可以一直推動發展。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871677-20260926.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：陳茂波：市場對中美元首會面解讀正面</li></ul>
