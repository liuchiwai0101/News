<h1>美國上訴法院推翻禁令，Perplexity AI 購物智能體重返 Amazon</h1>
<div class="notice">內容機器翻譯自第三方媒體（The Decoder），僅供參考，以原文為準。</div><p><img src="https://the-decoder.com/wp-content/uploads/2026/03/amazon_vs_perplexity_lawsuit-1200x670.png" alt=""></p><h3>重點內容</h3><p>美國第九巡迴上訴法院推翻了此前阻止 Perplexity 在 Amazon 平台使用 AI 購物智能體的禁令，認定是用户而非 Perplexity 本身通過智能體訪問 Amazon，因此違反聯邦計算機欺詐法的指控難以成立。這是美國聯邦上訴法院首次就 AI 智能體合法性作出裁決，但案件本身尚未了結。Amazon 表示不同意該裁決並正在評估下一步選項。</p><p><a href="https://the-decoder.com/us-appeals-court-allows-perplexitys-ai-shopping-agent-back-on-amazon" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
