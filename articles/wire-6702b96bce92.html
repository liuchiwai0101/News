<h1>德語媒體：德國不再充當歐盟對華政策的“剎車片”</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3893/14748862006_ecfb4beb13_b.jpg" alt=""></p><h3>重點內容</h3><p>《南德意志報》評論寫道，因為擔心中國的報復措施會損害本國經濟利益，過去德國政府總是阻撓歐盟出台強硬的對華政策，但面臨日益強勁的“中國衝擊2.0”，柏林的立場似乎正在發生變化。《法蘭克福匯報》稱，德法正在聯手推動建立歐盟新型貿易保護機制，以便在遭遇中國經濟脅迫時，能夠迅速做出反應。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/德语媒体：德国不再充当欧盟对华政策的-刹车片/a-79553403?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：德語媒體：德國不再充當歐盟對華政策的“剎車片”</li></ul>
