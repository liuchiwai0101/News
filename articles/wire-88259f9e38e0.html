<h1>海關在機場檢獲約7公斤懷疑大麻花　拘捕3名內地男子</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>重點內容</h3><p>海關在機場檢獲約7公斤懷疑大麻花，估計市值共約140萬元，拘捕3名內地男子。</p><p>被捕旅客年齡介乎35至40歲，均由泰國曼谷飛抵本港，在清關時，其中兩人的隨身揹包及行李內的零食包裝，分別被發現藏有重約1公斤及6公斤的懷疑大麻花。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870752-20260919.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：海關在機場檢獲約7公斤懷疑大麻花　拘捕3名內地男子</li></ul>
