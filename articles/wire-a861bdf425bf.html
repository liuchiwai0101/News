<h1>董建華週日公祭安排獲邀人士出席　前特首辦籲市民往弔唁處悼念</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870501_1_M_20260917223638.jpg" alt=""></p><h3>重點內容</h3><p>前任行政長官辦公室表示，全國政協前副主席、香港首兩任行政長官董建華公祭儀式週日舉行，基於場地所限，儀式將會安排獲邀請人士出席。</p><p>市民可前往民政事務總署明日起一連三日設置的3個弔唁處簽署弔唁冊，以表達悼念。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870501-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：董建華週日公祭安排獲邀人士出席　前特首辦籲市民往弔唁處悼念</li></ul>
