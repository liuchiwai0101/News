<h1>Adobe 將 Photoshop 等工具整合至 Slack　推出 MCP 應用強化協作</h1>
<p>Adobe 正式將其創意與生產力工具直接引入 Slack，讓團隊能在專案討論的對話視窗中，直接進行圖片、影片、設計及 PDF 的建立與編輯，無需切換至其他應用程式。 逾七十種專業工具透過 Slackbot 運作 新推出的 Adobe for Slack MCP 應用包含超過 70 種專業級工具，涵蓋 Firefly、Adobe Express、Photoshop、Premiere、Acrobat、InDesign、Illustrator、Stock…</p>
