<h1>「出海專班」成立至今約340間企業來港註冊</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872467_1_M_20261002200511.jpg" alt=""></p><h3>重點內容</h3><p>商務及經濟發展局局長丘應樺表示，「內地企業出海專班」成立至今，有約340間企業來港註冊。</p><p>而創新科技及工業局局長孫東表示，《五年規劃》提出，本地創新活動總開支佔本地生產總值3%，是參照國際標準制定指標。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872467-20261002.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：「出海專班」成立至今約340間企業來港註冊</li></ul>
