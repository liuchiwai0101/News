<h1>iPhone 18 Pro 動態島可同時顯示三個即時活動　第三個僅限系統功能</h1>
<div class="notice">內容機器翻譯自第三方媒體（NewMobileLife 流動日報），僅供參考，以原文為準。</div><p><img src="https://www.newmobilelife.com/wp-content/uploads/2026/10/iPhone-18-Pro-Dynamic-Island-Live-Activity.jpg" alt=""></p><p>Apple 在 <a href="https://www.newmobilelife.com/tag/iPhone-18-Pro/" target="_blank" rel="noopener noreferrer">iPhone 18 Pro</a> 型號上收窄了動態島所在的開孔，令動態島可同時支援最多三個即時活動，但這項支援附帶一個限制。</p><h3>第三個即時活動僅限系統</h3><p>據程式碼研究者 pdfu 指出，在 iOS 27 中，第三個即時活動只會是系統活動，例如「正在播放」或導航，不能來自另一個應用程式。因此，若 iPhone 18 Pro 用户發現動態島顯示的即時活動數量未如預期，原因即在於此。</p><img src="https://www.newmobilelife.com/wp-content/uploads/2026/09/iphone18pro.webp" alt="與 iPhone 18 Pro 相關的圖片">
