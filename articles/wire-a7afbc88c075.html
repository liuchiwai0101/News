<h1>基民盟已在三場地方選舉中失利 默茨宣佈無辭職打算</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/7032/6536097779_a0e9213ae9_b.jpg" alt=""></p><p>週日（9月20日），德國基民盟在梅克倫堡-前波莫瑞州和城市州柏林舉行的地方選舉中均遭敗績。根據出口民調，選擇黨在梅克倫堡-前波莫瑞州地方選舉中拔得頭籌。左翼黨則在柏林大敗默茨領導的基民盟。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/基民盟已在三场地方选举中失利-默茨宣布无辞职打算/a-79347413?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：基民盟已在三場地方選舉中失利 默茨宣佈無辭職打算</li></ul>
