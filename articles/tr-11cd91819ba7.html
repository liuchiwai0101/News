<h1>MiniMax H3 發佈：開源全能多模態生成模型，支持 2K 原生立體聲視頻</h1>
<div class="notice">內容機器翻譯自第三方媒體（MiniMax：Blog（網頁）），僅供參考，以原文為準。</div><p><img src="https://file.cdn.minimax.io/public/3df321d9-42bd-4be0-ac58-71f22377a11f.png" alt=""></p><h3>重點內容</h3><p>MiniMax 正式推出全能多模態生成模型 H3，可聯合理解文本、圖像、視頻和音頻，生成最高 2K 分辨率、15 秒時長且帶原生立體聲的視頻。H3 在指令跟隨、文字與品牌呈現、V2V 動作遷移上表現突出，2K 下每秒價格低於主流模型三分之一，768p 下低於主流 720p 價格一半。官方計劃近日開源模型權重，以支持開源社區並加速硬件兼容。</p><p><a href="https://www.minimax.io/blog/minimax-h3" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
