<h1>LangChain 詳解：什麼是 AI 智能體？</h1>
<div class="notice">內容機器翻譯自第三方媒體（LangChain：Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://cdn.prod.website-files.com/65c81e88c254bb0f97633a71/6a7c02f0b0e21ce4ca96be81_blue-77%20characters%20max.png" alt=""></p><h3>重點內容</h3><p>AI 智能體是在大語言模型循環中自主運行的系統，通過反覆調用模型、觀察結果並調整下一步行動來完成複雜任務。工作流（workflow）則是對固定步驟的預編排，兩者互補：工作流保證確定性，智能體提供靈活性。理解二者差異是構建可靠、可投入生產的自主系統的關鍵。</p><p><a href="https://www.langchain.com/blog/what-is-an-agent" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
