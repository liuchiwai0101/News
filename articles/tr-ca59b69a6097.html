<h1>開源「活人感寫作.skill」：一個幫你寫出沒有AI味的文字的通用寫作技能</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：數字生命卡茲克），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/be6a1d1f-2d14-4d0e-ae9b-9bf1875fc9a2/thumb/" alt=""></p><h3>重點內容</h3><p>數字生命卡茲克開源「活人感寫作.skill」（英文名 human Writing.skill），旨在去除AI味、幫用户寫出有真實生活感的文字。該Skill鼓勵用户提供真實案例與情感，並針對辭章端禁用AI常用口癖和黑話，同時適配Qwen 3.8 Max、DeepSeek V4 Pro、Kimi K3等模型，可直接用於WorkBuddy、千問辦公等產品。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&amp;mid=2647684946&amp;idx=1&amp;sn=ae7edcc572b998dc4e1ac3591977aa85" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
