<h1>國慶黃金周首日　59萬多人次入境及49萬多人次出境</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>正文</h3><p>昨日內地國慶黃金周首日，本港共有108萬人次進出境，當中入境有59萬多人次，出境49萬多人次。</p><p>有27萬7000多人次的內地旅客入境。最多人經落馬洲支線入境，其次為羅湖入境，分別有超過11萬5000人次及接近11萬人次。</p><p>出境內地旅客有20萬9000多人次。最多人經羅湖出境，有近11萬3000人次。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872406-20261002.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：國慶黃金周首日　59萬多人次入境及49萬多人次出境</li></ul>
