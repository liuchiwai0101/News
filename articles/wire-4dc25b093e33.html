<h1>林紹波：機場三跑具長遠效益　為未來發展作準備</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869708_1_M_20260911193830.jpg" alt=""></p><h3>重點內容</h3><p>國泰集團行政總裁林紹波説，支持香港國際航空樞紐發展，機場三跑具長遠效益，為航空業未來，數十年發展作預備。 他又提到國泰，積極參與香港社會發展。 編輯：王濱南</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869708-20260911.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：林紹波：機場三跑具長遠效益　為未來發展作準備</li></ul>
