<h1>日本茨城縣南部發生4.8級地震</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870345_1_M_20260917001259.jpg" alt=""></p><h3>重點內容</h3><p>日本茨城縣南部地區當地凌晨發生4.8級地震，首都東京震感明顯。</p><p>日本氣象廳説，地震發生在當地時間凌晨零時7分，震源深度約70公里，地震並無引發海嘯風險。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870345-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：日本茨城縣南部發生4.8級地震</li></ul>
