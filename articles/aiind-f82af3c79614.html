<h1>好書巡禮｜吳金曉分享《山野生蹤》，探討 AI 時代山野體驗式教育</h1>
<div class="notice">內容機器翻譯自第三方媒體（橙新聞），僅供參考，以原文為準。</div><p><img src="https://cdn.orangenews.hk/images/2026/11/15/1a4772fd7a564f9da051177b30de23cd.jpg" alt=""></p><h3>正文</h3><p>2026年11月15日，講座「從《山野生蹤》到未來人才：AI時代的體驗式山野教育」在深圳樊登書店舉行。中華基督教會基真小學副校長吳金曉，透過新書《山野生蹤》，分享如何把大自然化作沒有圍牆的課堂，讓孩子在親身體驗之中學習知識、磨練品格、發掘潛能。</p><h3>各方報道</h3><ul><li><a href="https://www.orangenews.hk/culturevideo/Vb2LXMJ/%E5%A5%BD%E6%9B%B8%E5%B7%A1%E7%A6%AE-%E5%90%B3%E9%87%91%E6%9B%89%E5%88%86%E4%BA%AB-%E5%B1%B1%E9%87%8E%E7%94%9F%E8%B9%A4--%E6%8E%A2%E8%A8%8E-AI-%E6%99%82%E4%BB%A3%E5%B1%B1%E9%87%8E%E9%AB%94%E9%A9%97%E5%BC%8F%E6%95%99%E8%82%B2.shtml" target="_blank" rel="noopener noreferrer">橙新聞</a>：好書巡禮｜吳金曉分享《山野生蹤》，探討 AI 時代山野體驗式教育</li></ul>
