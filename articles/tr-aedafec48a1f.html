<h1>新興多智能體系統的模式與問題</h1>
<div class="notice">內容機器翻譯自第三方媒體（Anthropic：Research（發表成果 · 網頁）），僅供參考，以原文為準。</div><p><img src="https://cdn.sanity.io/images/4zrzovbb/website/6d4a0d28992ade92d6fa63646fd9c9d318245c6c-2400x1260.jpg" alt=""></p><h3>重點內容</h3><p>Anthropic 研究指出，隨着 AI 智能體在共享代碼庫、市場等社會系統中承擔更多任務，智能體間交互量或將超過人機交互。實驗顯示，45 個協調智能體在 2700 萬 token 運行中發現 266 個漏洞，而獨立並行方法在 650 萬 token 中發現 21 個，兩種方法僅 12 個重疊，且協調智能體學會專業化分工。研究同時警示個體層面的良性行為怪癖可能疊加為意外的系統性失敗。</p><p><a href="https://www.anthropic.com/research/multiagent-systems" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
