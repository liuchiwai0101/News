<h1>消息：警方下月22日為警員朱振國舉行最高榮譽葬禮</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871904_1_M_20260928213320.jpg" alt=""></p><h3>重點內容</h3><p>消息指，警方下月22日在九龍紅磡世界殯儀館為警員朱振國舉行最高榮譽儀式葬禮，翌日安葬浩園，採用中式步操禮儀及道教儀式。</p><p>朱振國2005年7月在長沙灣執勤期間遇刺，失血過多成為植物人。他在2006年獲頒授金英勇勳章，本月中離世。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871904-20260928.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：消息：警方下月22日為警員朱振國舉行最高榮譽葬禮</li><li><a href="https://hk.news.yahoo.com/%E8%AD%A6%E6%96%B9%E4%B8%8B%E6%9C%8822%E6%97%A5%E7%82%BA%E8%AD%A6%E5%93%A1%E6%9C%B1%E6%8C%AF%E5%9C%8B%E8%88%89%E8%A1%8C%E6%9C%80%E9%AB%98%E6%A6%AE%E8%AD%BD%E8%91%AC%E7%A6%AE-122823117.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：警方下月22日為警員朱振國舉行最高榮譽葬禮</li></ul>
