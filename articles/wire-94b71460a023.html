<h1>美國一架小型醫療飛機失聯　海岸警衞隊正在搜索</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872594_1_M_20261004013050.jpg" alt=""></p><h3>正文</h3><p>美國一架載有6人的小型醫療飛機，飛行途中失聯，美國海岸警衞隊正在搜索。</p><p>美國海岸警衞隊表示，涉事飛機載有4名機組人員和2名乘客，星期六清晨從北大西洋的英國海外領地百慕達起飛，原定前往馬薩諸塞州波士頓，但飛行途中失聯。海岸警衞隊正在馬薩諸塞州以南的空中和水面，搜索飛機。</p><p>美國國家運輸安全委員會表示，已經知悉事件，正在瞭解情況，暫時未有信息可以發布。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872594-20261004.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：美國一架小型醫療飛機失聯　海岸警衞隊正在搜索</li></ul>
