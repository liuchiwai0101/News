<h1>藍田平田邨服務設施大樓傳異味　揭57歲男倒斃房間</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/26897f471c4b9c3ea615f6665183c5cbba0ef14536f216cb46324ab2ffc18fdd/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fmedia.zenfs.com%2Fno%2Fam730_578%2F05ae2dd786ae8bdfd36808010bb977b5.jpg" alt=""></p><h3>重點內容</h3><p>藍田發生猝死事件。昨日(9日)晚上約9時，警方接獲藍田平田邨服務設施大樓職員報案，指上址一房間傳出異味。消防到場破門入內，發現57歲姓鍾男子暈倒在內，經救護員檢查後證實已當場死亡，死因有待驗屍後確定。據指，事主有身體病紀錄。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E8%97%8D%E7%94%B0%E5%B9%B3%E7%94%B0%E9%82%A8%E6%9C%8D%E5%8B%99%E8%A8%AD%E6%96%BD%E5%A4%A7%E6%A8%93%E5%82%B3%E7%95%B0%E5%91%B3-%E6%8F%AD57%E6%AD%B2%E7%94%B7%E5%80%92%E6%96%83%E6%88%BF%E9%96%93-053000496.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：藍田平田邨服務設施大樓傳異味　揭57歲男倒斃房間</li></ul>
