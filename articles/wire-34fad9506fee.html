<h1>特朗普宣佈“能源停火”後 烏稱能源設施遭俄襲擊</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/8600/15870725062_120c91470a_b.jpg" alt=""></p><h3>正文</h3><p>在與俄羅斯達成柴油協議後，美國總統特朗普宣佈基輔與莫斯科之間已達成一項“能源停火”安排。僅僅幾個小時後烏稱其能源設施再遭到襲擊。與此同時，歐盟批准了針對莫斯科有史以來規模最大的制裁措施。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/特朗普宣布-能源停火-后-乌称能源设施遭俄袭击/a-79652601?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：特朗普宣佈“能源停火”後 烏稱能源設施遭俄襲擊</li></ul>
