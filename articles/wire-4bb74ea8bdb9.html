<h1>石鼓洲焚化爐發生三級火　無人受傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · 巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2026/10/865313152_122121685509360225_8424636230864262087_n.jpg" alt=""></p><h3>正文</h3><p>石鼓洲旁人工島綜合廢物管理設施第1期發生三級火，暫未接獲受傷報告。</p><p>火警發生在下午12時43分，警方接獲職員報案，消防到場，於下午1時24分將火警升為三級，動用兩條喉及兩隊煙帽隊灌救，並派出4輛救護車在場戒備。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1875361-20261026.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：石鼓洲焚化爐發生三級火　無人受傷</li><li><a href="https://www.bastillepost.com/hongkong/article/17048692-%e7%9f%b3%e9%bc%93%e6%b4%b2%e7%84%9a%e5%8c%96%e7%88%90%e7%99%bc%e7%94%9f%e4%b8%89%e7%b4%9a%e7%81%ab-%e7%84%a1%e4%ba%ba%e5%8f%97%e5%82%b7" target="_blank" rel="noopener noreferrer">巴士的報</a>：石鼓洲焚化爐發生三級火 無人受傷</li></ul>
