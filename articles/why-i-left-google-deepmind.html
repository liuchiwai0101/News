<h1>前谷歌DeepMind研究員因公司簽署無限制軍事AI協議而離職</h1>
<div class="notice">內容機器翻譯自第三方媒體（Hacker News 熱門（buzzing.cc 中文翻譯）），僅供參考，以原文為準。</div><p><img src="https://assets.turntrout.com/static/images/card_images/why-i-left-google-deepmind.jpg" alt=""></p><h3>重點內容</h3><p>前谷歌DeepMind研究員Alex Turner因谷歌向國土安全部出售雲服務並最終簽署無限制軍事AI協議而離職。他曾起草25頁提案要求加入禁止殺手機器人和大規模監控的合同條款，但提案被CEO轉交後無人跟進。Turner指出，包括Jeff Dean和Stuart Russell在內的多位AI倫理領袖在關鍵時刻未能兑現承諾。</p><p><a href="https://turntrout.com/why-i-left-google-deepmind" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
