<h1>Mariano-Florentino (Tino) Cuéllar 加入 Anthropic 出任首席全球事務官</h1>
<div class="notice">內容機器翻譯自第三方媒體（Anthropic：Newsroom（網頁）），僅供參考，以原文為準。</div><p><img src="https://cdn.sanity.io/images/4zrzovbb/website/6d4a0d28992ade92d6fa63646fd9c9d318245c6c-2400x1260.jpg" alt=""></p><h3>重點內容</h3><p>Anthropic 任命 Mariano-Florentino (Tino) Cuéllar 為首任首席全球事務官，負責全球政策、國際戰略參與及政府關係事務。Cuéllar 曾任卡內基國際和平基金會主席、加州最高法院法官，並自 2026 年 1 月起擔任 Anthropic 長期利益信託受託人，現已卸任該職務加入公司。</p><p><a href="https://www.anthropic.com/news/tino-cuellar" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
