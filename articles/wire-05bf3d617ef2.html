<h1>天文台預料香港有局部地區雷暴</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870010_1_M_20260915055612.jpg" alt=""></p><h3>重點內容</h3><p>天文台在凌晨4時42分發出雷暴警告，其後更新警告信息，表示預料香港有局部地區雷暴。</p><p>天文台提醒市民，如果身處室外，要到安全地方躲避；以及離開水面、切勿在户外游泳或進行其他户外水上運動；並切勿站立於高地或接近導電的物體、樹木或桅杆。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870010-20260915.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：天文台預料香港有局部地區雷暴</li></ul>
