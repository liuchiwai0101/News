<h1>OpenRouter 推出實時網頁搜索基準測試：如何為智能體選擇引擎、深度與模型</h1>
<div class="notice">內容機器翻譯自第三方媒體（OpenRouter：Announcements（RSS）），僅供參考，以原文為準。</div><p><img src="https://openrouter.ai/blog/images/web-search-benchmark.png" alt=""></p><h3>重點內容</h3><p>OpenRouter 發佈實時排行榜，系統評測模型、搜索引擎、搜索方法與預算四類配置組合。數據顯示，將搜索預算從 1 輪增至 25 輪可使 BrowseComp 得分近乎翻倍，成本僅增 2.5-7 倍；模型選擇比引擎更重要，平均分差 15 分 vs 10 分。失敗率高的任務應降低搜索深度以控制成本。</p><p><a href="https://openrouter.ai/blog/announcements/web-search-benchmark" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
