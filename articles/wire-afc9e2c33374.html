<h1>中國鋁業第3季純利升59.1%</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2025/10/02600-Web.jpg" alt=""></p><h3>正文</h3><p>中國鋁業(02600)公佈，截至2026年9月底止季度歸屬上市公司股東淨利潤60.44億元(人民幣．下同)，按年升59.1%。</p><p>若將2026年首9個月合計，該公司營業收入1,765.16億元，按年升5.69%；歸屬上市公司股東淨利潤179.16億元，升64.83%。營活動產生現金流淨額409.92億元，按年昃升61.47%。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17077922-%e4%b8%ad%e5%9c%8b%e9%8b%81%e6%a5%ad%e7%ac%ac3%e5%ad%a3%e7%b4%94%e5%88%a9%e5%8d%8759-1" target="_blank" rel="noopener noreferrer">巴士的報</a>：中國鋁業第3季純利升59.1%</li></ul>
