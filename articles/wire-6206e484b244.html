<h1>進口冷藏雞腿樣本檢出獸藥殘餘含量超標</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>食物環境衞生署食物安全中心（中心）今日（十一月六日）公佈，一個進口冷藏雞腿樣本被檢出獸藥殘餘強力黴素含量超標。市民應停止食用受影響批次產品，業界如持有受影響批次產品，亦應立即停止使...</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202611/06/P2026110600654.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：進口冷藏雞腿樣本檢出獸藥殘餘含量超標</li></ul>
