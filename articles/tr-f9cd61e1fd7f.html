<h1>GLM-5.3 發佈：編程能力開源第一，並湧現網絡安全能力</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：智譜（GLM）），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/58768062-2f38-4135-bdd9-d3a5e47328a7/thumb/" alt=""></p><h3>重點內容</h3><p>智譜發佈GLM-5.3，基於與GLM-5.2相同的基座，通過極致的後訓練Scaling提升智能上界，編程能力較前代提升50%，在Terminal Bench 3.0等公開基準中取得開源第一，並接近Claude Fable 5。模型在白盒代碼審查等安全任務中表現持平Mythos 5，在CyberGym測試中得分84.5%。模型權重將在兩週後開源，即日起上線ZCode、AutoClaw等工具。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzkyMzI3NzQ0Mg%3D%3D&amp;mid=2247494084&amp;idx=1&amp;sn=a2e5cd9a534a4825feb3633ea1b6d492" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
