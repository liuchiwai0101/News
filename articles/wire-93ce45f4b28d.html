<h1>德語媒體：歐盟必須出台強硬的對華政策</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/8114/8657120528_e88bbb1cc5_b.jpg" alt=""></p><p>《法蘭克福匯報》評論寫道，面對來勢兇猛的中國衝擊2.0，歐盟必須保護其工業核心，但貿易保護主義絕非解決問題的靈丹妙藥，歐洲也應努力提升自身競爭力。《日報》指出，歐中經濟的相互依賴並非單行線，中國經濟也同樣無法擺脱對歐盟統一市場的依賴。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/德语媒体：欧盟必须出台强硬的对华政策/a-79312703?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：德語媒體：歐盟必須出台強硬的對華政策</li></ul>
