<h1>颱風杜鵑料為日本伊豆群島及關東帶來暴雨</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870842_1_M_20260920210204.jpg" alt=""></p><h3>重點內容</h3><p>颱風杜鵑預料將會橫過日本本州以南海域，明天早上迫近伊豆群島，屆時伊豆群島及關東一帶預料會有暴雨。</p><p>日本氣象廳預計，靜岡縣和伊豆群島明天可能出現大暴雨，雨量不排除超越往年9月全月的紀錄。當局呼籲民眾注意颱風相關的災害，包括巨浪、山泥傾瀉、水浸和洪水。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870842-20260920.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：颱風杜鵑料為日本伊豆群島及關東帶來暴雨</li></ul>
