<h1>印度宗教節慶活動發生人踩人　最少17死25傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874336_1_M_20261018052825.jpg" alt=""></p><h3>正文</h3><p>印度東部加爾各答發生人踩人，最少17人死亡、25人受傷。</p><p>當地傳媒報道，現場是加爾各答一處宗教節慶活動，當地星期六晚突然下大雨，導致民眾湧向臨時搭建的活動場地出口處，引發人踩人。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874336-20261018.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：印度宗教節慶活動發生人踩人　最少17死25傷</li></ul>
