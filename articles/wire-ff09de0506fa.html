<h1>亞運七欖賽事展開　港隊男女子組勝出首場分組賽</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872275_1_M_20261001124131.jpg" alt=""></p><h3>正文</h3><p>名古屋亞運七人欖球賽展開，衞冕的中國香港男子隊在首場分組賽，以45:0擊敗烏茲別克。</p><p>港隊全場有7次達陣，完上半場領先26:0，下半場再取19分大勝對手。</p><p>女子方面，上屆銅牌得主的港隊首場分組賽面對印度，完上半場以21:0領先，全場以33:7勝出。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872275-20261001.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：亞運七欖賽事展開　港隊男女子組勝出首場分組賽</li></ul>
