<h1>港鐵：現時藍田站沒有列車服務　藍田站暫時關閉</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873852_1_M_20261014090838.jpg" alt=""></p><h3>正文</h3><p>港鐵表示，由於藍田站月台有設備冒煙，現時觀塘綫列車不停藍田站，港鐵及消防人員正在現場處理。現時藍田站沒有列車服務，藍田站暫時關閉。</p><p>港鐵正安排免費接駁巴士，行駛觀塘至油塘站，呼籲請乘客為行程預留充裕時間。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873852-20261014.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：港鐵：現時藍田站沒有列車服務　藍田站暫時關閉</li></ul>
