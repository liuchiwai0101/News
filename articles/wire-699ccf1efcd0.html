<h1>巴基斯坦有武裝分子綁架多名警員　暫未有組織承認責任</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874333_1_M_20261018023505.jpg" alt=""></p><h3>正文</h3><p>巴基斯坦俾路支省有武裝分子綁架多名警員，暫時未有組織承認責任。</p><p>俾路支省官員説，多名攜帶自動武器的武裝分子，當地星期六在連接奎達與卡拉奇的高速公路上，攔截一輛載有警員的車輛，釋放司機和3名乘客後，脅持車上20名警員駛離現場。</p><p>安全部隊正在搜索武裝分子及失蹤警員，暫時未有組織宣稱策劃今次綁架事件。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874333-20261018.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：巴基斯坦有武裝分子綁架多名警員　暫未有組織承認責任</li></ul>
