<h1>Apple 提出 LLM 函數調用不確定性量化方法</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>Apple 機器學習研究團隊提出一種針對大語言模型函數調用的不確定性量化方法，旨在提升 LLM 在自主任務執行中的可靠性。該方法通過量化模型對函數調用參數和決策的置信度，幫助識別潛在錯誤調用。該研究目前處於學術探索階段，未公佈具體模型版本或開源計劃。</p><p><a href="https://machinelearning.apple.com/research/uncertainty-quantification-function-calling" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
