<h1>民政事務總署開放19間社區會堂和社區中心作臨時避暑中心</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869799_1_M_20260912181441.jpg" alt=""></p><h3>重點內容</h3><p>酷熱天氣警告現正生效。民政事務總署開放19間社區會堂和社區中心作臨時避暑中心。</p><p>臨時避暑中心會在酷熱天氣警告生效期間全日開放予市民避暑。晩上10時半至翌晨8時，臨時避暑中心亦供應被鋪及睡覺的地方予有需要人士。中心內有人員當值。</p><p>市民如需進一步資料，可於午夜前致電民政事務總署熱線2572 8427查詢。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869799-20260912.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：民政事務總署開放19間社區會堂和社區中心作臨時避暑中心</li></ul>
