<h1>黃色火災危險警告</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>電台、電視台當值宣佈員注意： 為大眾安全起見，請播放下列警告： 火災危險警告 天文台已於今日（十月二十三日）發出紅色火災危險警告，表示火警極易發生，市民應小心防火。 市民前往郊野旅行，最好帶備乾糧或已經煮熟的食物，並應小心防止山火。在郊野非法生火的人士，可被罰款二萬五千元及入獄一年。</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202610/25/P2026102500143.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：黃色火災危險警告</li><li><a href="https://www.info.gov.hk/gia/general/202610/23/P2026102300116.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：紅色火災危險警告</li></ul>
