<h1>民安隊少年團出戰青少年制服團隊匹克球邀請賽 女子組奪亞軍</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2026/11/img_74e4e472_01.jpg" alt=""></p><h3>正文</h3><p>民安隊少年團出戰懲教署主辦「2026年青少年制服團隊匹克球邀請賽—國慶杯」，與各制服團體青少年切磋球技。團員賽場上全情投入、拼勁十足，憑默契勇奪女子組亞軍，為國慶添光彩。民安隊全年招募，籲有志服務社會</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17090829-%e6%b0%91%e5%ae%89%e9%9a%8a%e5%b0%91%e5%b9%b4%e5%9c%98%e5%87%ba%e6%88%b0%e9%9d%92%e5%b0%91%e5%b9%b4%e5%88%b6%e6%9c%8d%e5%9c%98%e9%9a%8a%e5%8c%b9%e5%85%8b%e7%90%83%e9%82%80%e8%ab%8b%e8%b3%bd-%e5%a5%b3" target="_blank" rel="noopener noreferrer">巴士的報</a>：民安隊少年團出戰青少年制服團隊匹克球邀請賽 女子組奪亞軍</li></ul>
