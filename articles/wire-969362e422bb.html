<h1>警方稱疑飲免費飲品後不適學生無中毒跡象　無發現飲品有針孔刺穿</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871280_1_M_20260923224738.jpg" alt=""></p><h3>重點內容</h3><p>有中學在星期二舉行運動會，場外有公司免費派發運動飲品，有16名學生懷疑飲用後不適送院。</p><p>警方説，涉事學生並無中毒跡象，經已出院，經調查並無發現飲品有針孔刺穿，又或被注入不明液體。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871280-20260923.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：警方稱疑飲免費飲品後不適學生無中毒跡象　無發現飲品有針孔刺穿</li></ul>
