<h1>AutoGPT 如何用 AGENTS.md 和技能門控管理 AI 生成的拉取請求</h1>
<div class="notice">內容機器翻譯自第三方媒體（GitHub Blog），僅供參考，以原文為準。</div><p><img src="https://github.blog/wp-content/uploads/2026/01/00ab37fbbb9bc343b007734b0e5805a26e747c90d955750bd976cb9ce84f6a2a-1920x1080-1.png" alt=""></p><h3>重點內容</h3><p>AutoGPT 維護者發現，AI 智能體不會主動閲讀文檔，因此將指令放在 AGENTS.md 和技能文件中，並置於代碼目錄旁。他們通過強制 PR 模板、測試計劃、CI 覆蓋率門檻和 CLA 簽名等門控機制，將智能體提交的 PR 從“不可用”轉變為“可用但不符合路線圖”。其中 CLA 簽名因需瀏覽器和 OAuth 流程，被用作區分人類與智能體的“人類探測器”。</p><p><a href="https://github.blog/open-source/maintainers/your-contributors-are-ai-first-now-is-your-project" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
