<h1>壁屋監獄一名懲教人員遭在囚人士襲擊　送院治理</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · 政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1877020_1_M_20261108171635.jpg" alt=""></p><h3>正文</h3><p>今早約7時，一名23歲男性在囚人士在囚室外突然情緒失控，襲擊一名懲教人員。在場懲教人員立即制止施襲者，並召喚支援人員到場。</p><p>被襲懲教人員面部受傷，涉案在囚人士並無表面傷痕。經院所醫生檢查及治理後，他們均被送往公立醫院作進一步診治。事件已轉交警方調查。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1877020-20261108.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：壁屋監獄一名懲教人員遭在囚人士襲擊　送院治理</li><li><a href="https://www.info.gov.hk/gia/general/202611/08/P2026110800450.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：懲教人員制止在囚人士襲擊職員</li></ul>
