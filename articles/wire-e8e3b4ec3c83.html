<h1>國泰暫停往返迪拜及利雅得客運航班至明年1月31日</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871812_1_M_20260928102819.jpg" alt=""></p><h3>重點內容</h3><p>國泰航空宣佈，鑑於中東局勢最新發展，往返迪拜及利雅得的客運航班將會暫停服務至明年1月31日，國泰將會為受影響旅客提供靈活票務安排，包括重新預訂機票、更改航點或退票。 國泰表示，會繼續密切關注中東局勢最新發展。 編輯：譚佩貞</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871812-20260928.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：國泰暫停往返迪拜及利雅得客運航班至明年1月31日</li></ul>
