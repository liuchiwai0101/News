<h1>菲律賓巴拉望省附近海域有渡輪起火至少5死逾80人失蹤</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869494_1_M_20260910085949.jpg" alt=""></p><h3>重點內容</h3><p>菲律賓巴拉望省附近海域有渡輪起火，海岸防衞隊説，根據名單船上共有134人，至今有42人獲救，5人死亡，87人下落不明，搜救行動繼續。</p><p>報道指，起火渡輪是從馬尼拉出發，向南駛往巴拉望省北部渡假勝地科隆，期間起火，海岸防衞隊在社交平台上載影片，顯示整艘船被大火吞噬。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869494-20260910.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：菲律賓巴拉望省附近海域有渡輪起火至少5死逾80人失蹤</li></ul>
