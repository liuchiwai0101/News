<h1>Populous 如何用 Runway 呈現全球標誌性場館設計</h1>
<div class="notice">內容機器翻譯自第三方媒體（Runway：News（網頁）），僅供參考，以原文為準。</div><p><img src="https://d3phaj0sisr2ct.cloudfront.net/site/images/sanity/2026/08/081726-populous-52250684-ddde-4d30-a4fe-d480460a9e1f.png" alt=""></p><h3>重點內容</h3><p>全球設計公司 Populous 高級建築師 Georgina Myers 介紹團隊用 Runway 輔助體育場館概念設計：過去完整視頻需外部渲染團隊至少三週，且提交前兩週須凍結設計模型；如今 Runway 能生成傳達尺度感的完整渲染和航拍圖，將視覺製作時間縮短，讓設計師把時間還給設計本身。該工具已用於利雅得 MBS 體育場等中東項目，支持 9 種不同活動模式的場景迭代。</p><p><a href="https://runwayml.com/news/customers/populous" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
