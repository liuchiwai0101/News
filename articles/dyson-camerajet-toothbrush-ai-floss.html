<h1>Dyson 推出內置鏡頭電動牙刷　AI 輔助自動清潔牙縫</h1>
<p>Dyson 再次擴展其個人護理產品線，這次焦點從頭髮轉向牙齒。該公司推出了首款在刷頭中整合鏡頭的電動牙刷 CameraJet，售價為 499 美元，並提供陶瓷藍及陶瓷粉兩種顏色選擇。這款裝置即日起上市，除了能透過 Wi-Fi 將口腔內部影像即時串流至手機供用戶檢視外，還結合了 AI 演算法來偵測牙縫並噴射漱口水進行清潔。因此，當用戶使用 CameraJet 刷牙時，它同時也能處理牙線清潔的工作。 AI 技術精準定位牙縫 CameraJet 的核心在於其 Gap Optical Targeting…</p>
