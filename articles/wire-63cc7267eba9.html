<h1>一名男子在油麻地涉嫌爆竊被捕　逃走時從大廈單位墮下受傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869874_1_M_20260913221140.jpg" alt=""></p><h3>重點內容</h3><p>一名非華裔男子在油麻地涉嫌爆竊，逃走期間從大廈單位墮下受傷，清醒送院治理。</p><p>警方下午1時許接報，表示油麻地上海街一幢大廈單位內有聲響，懷疑被人爆竊。人員到場後，44歲非華裔男子企圖逃走，並從單位墮下，報稱腰痛，清醒被送往廣華醫院治理。</p><p>警方以涉嫌爆竊及外出時沒有攜帶身份證明文件，將他拘捕，單位損失財物有待點算。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869874-20260913.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：一名男子在油麻地涉嫌爆竊被捕　逃走時從大廈單位墮下受傷</li></ul>
