<h1>對台軍售卡關之際 川普被揭露曾向習近平兜售武器</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/5247/5278410612_a9c94ecbe0_b.jpg" alt=""></p><p>美國駐中大使龐德偉（David Perdue）週日受訪時被問及對台軍售議題。他稱，川普一直告訴習近平，美國本來就會向世界各地出售武器，甚至曾問習近平「要不要也買一些？」但白宮隨後澄清，目前沒有計劃對中國軍售。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/對台軍售卡關之際-川普被揭露曾向習近平兜售武器/a-79452431?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：對台軍售卡關之際 川普被揭露曾向習近平兜售武器</li></ul>
