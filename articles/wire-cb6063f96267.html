<h1>滔搏中期純利倒退16% 初段股價不跌反升 最多漲逾13%</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="https://image.bastillepost.com/640x/wp-content/uploads/hongkong/2024/09/06110.jpg" alt=""></p><h3>正文</h3><p>滔搏(06110)昨晚派發中期成績表，純利按年倒退16%，該股早市初段卻不跌反升，最多升超過13%。 截至上午約9時50分，滔搏報1.085元，升10.15%，成交2,970萬元；稍早前該股一度衝上1.115元，漲13.2%。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17069678-%e6%bb%94%e6%90%8f%e4%b8%ad%e6%9c%9f%e7%b4%94%e5%88%a9%e5%80%92%e9%80%8016-%e5%88%9d%e6%ae%b5%e8%82%a1%e5%83%b9%e4%b8%8d%e8%b7%8c%e5%8f%8d%e5%8d%87-%e6%9c%80%e5%a4%9a%e6%bc%b2%e9%80%be13" target="_blank" rel="noopener noreferrer">巴士的報</a>：滔搏中期純利倒退16% 初段股價不跌反升 最多漲逾13%</li></ul>
