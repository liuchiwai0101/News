<h1>Apple：所有已收到的訂單均會在處理前接受審核</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869937_1_M_20260914132206.jpg" alt=""></p><h3>重點內容</h3><p>一批市民報警，懷疑被盜用信用卡訂購新手機，警方至昨晚接獲超過700人報案。</p><p>接受預訂手機的公司Apple，發言人回覆查詢時表示，所有已收到的訂單，均會在處理前接受審核。他們正盡快識別及取消任何可能已被提交的欺詐交易。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869937-20260914.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：Apple：所有已收到的訂單均會在處理前接受審核</li></ul>
