<h1>Apple Music 引入多語言語義檢索系統</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>Apple 機器學習研究團隊為 Apple Music 搜索引入多語言語義檢索系統，覆蓋 150 多個國家及地區的數十種語言。該系統利用多語言嵌入向量模型，將用户查詢與歌曲等內容的語義表示映射到同一向量空間，實現跨語言匹配。檢索準確率較此前基於關鍵詞的系統提升 30% 以上，同時保持毫秒級響應延遲。</p><p><a href="https://machinelearning.apple.com/research/multilingual-semantic-retrieval" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
