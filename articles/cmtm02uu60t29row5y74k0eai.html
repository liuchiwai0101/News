<h1>OpenAI 推出 Daybreak for Frontline Defenders，投入10亿美元支持一线网络防御</h1>
<p>OpenAI 发布 Daybreak for Frontline Defenders 全球计划，承诺提供10亿美元的 Daybreak 补贴访问、培训、技术支持与合作，计划在未来六个月内消耗，优先支持水处理、电网、州和地方政府、社区银行、非营利组织和开源维护者等资源有限的一线防御者。</p>
