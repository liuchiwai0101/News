<h1>尼泊爾北部希姆隆峯雪崩　初步指最少6人失蹤</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871766_1_M_20260927215440.jpg" alt=""></p><h3>重點內容</h3><p>尼泊爾北部發生雪崩，初步消息指最少6人失蹤。</p><p>喜馬拉雅山脈位於尼泊爾境內的希姆隆峯，星期日上午發生雪崩，當時一支登山隊正在這座海拔超過7100米的山峯的大本營，展開登山季前準備工作，登山隊中最少6人在雪崩後失聯。</p><p>地方官員説，暫時未能確認山上人員狀況，多間直升機公司已經提出飛到事發區域協助救援。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871766-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：尼泊爾北部希姆隆峯雪崩　初步指最少6人失蹤</li></ul>
