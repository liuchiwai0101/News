<h1>生數科技發佈 Vidu S2：含 Avatar 與 Editing 雙模型，探索空間視頻</h1>
<div class="notice">內容機器翻譯自第三方媒體（生數科技），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3893/14748862006_ecfb4beb13_b.jpg" alt=""></p><h3>AI 導讀</h3><p>生數科技正式發佈 Vidu S2，包含面向數字角色實時交互的 Vidu S2-Avatar 和麪向視頻流實時編輯的 Vidu S2-Editing，並探索麪向 VR 頭顯的實時空間視頻生成與編輯。</p><h3>推薦理由</h3><p>官方發佈 Vidu S2 雙模型，給出實時交互、編輯與空間視頻的技術路線和評測數字，讀者可對照判斷其流式生成思路。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzkzMDQ5NTQwMQ%3D%3D&amp;amp;mid=2247489246&amp;amp;idx=2&amp;amp;sn=b23b39da69f6c75594eccac11854111f" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
