<h1>Mac App Store 應用可放棄支援 Intel Mac　簡化開發並優化下載大小</h1>
<p>Apple 今日通知開發者，凡是在 Mac App Store 上架且要求 macOS 13 或更高版本的通用應用程式，現在可以移除對 Intel 架構 Mac 電腦的支援。此舉旨在讓開發者能夠簡化程式碼維護流程，同時減少用戶的下載檔案大小以及佔用的裝置儲存空間。 停止更新但保留舊版 一旦應用程式放棄對 Intel 型號的支援，這些版本將不再為 Intel…</p>
