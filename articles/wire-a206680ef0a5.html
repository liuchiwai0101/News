<h1>名古屋亞運再多兩名運動員興奮劑檢測陽性　被臨時禁賽</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872481_1_M_20261002215158.jpg" alt=""></p><h3>正文</h3><p>再多兩名參與名古屋亞運的運動員，興奮劑檢測呈陽性，被臨時禁賽。</p><p>獨立反興奮劑組織「國際檢查機構」表示，一名哈薩克田徑選手和一名塔吉克網球選手的樣本驗出禁用物質，被臨時禁賽。</p><p>機構表示，兩名運動員有權向國際體育仲裁法庭提出異議，也有權再次進行檢測。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872481-20261003.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：名古屋亞運再多兩名運動員興奮劑檢測陽性　被臨時禁賽</li></ul>
