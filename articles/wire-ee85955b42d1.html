<h1>巖盤浴瑜伽結業　海關接獲694宗舉報涉款約780萬元</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872668_1_M_20261004194126.jpg" alt=""></p><h3>重點內容</h3><p>提供瑜伽課堂的巖盤浴瑜伽Hotstone Yoga，日前突然宣佈全線結業。海關回覆查詢表示，截至今日傍晚六時，共接獲694宗舉報，涉款約780萬元。</p><p>海關早前接獲市民投訴，指在該中心購買了預繳式瑜伽服務課程，但因公司結業而未能將全部預繳式服務兑現。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872668-20261004.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：巖盤浴瑜伽結業　海關接獲694宗舉報涉款約780萬元</li></ul>
