<h1>特朗普稱美方官員與尋求結束美國對伊戰事斡旋方交談</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871918_1_M_20260929034254.jpg" alt=""></p><h3>重點內容</h3><p>美國總統特朗普説，美方官員在當地星期一，與尋求結束美國對伊朗戰事的斡旋方交談。</p><p>特朗普在白宮橢圓形辦公室向傳媒表示，在他看來，無論是以任何形式，美方都會贏，這場戰事很快就會結束，又指汽油價格將在美國打勝仗後，大幅下跌。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871918-20260929.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：特朗普稱美方官員與尋求結束美國對伊戰事斡旋方交談</li></ul>
