<h1>iPhone Duo 加入單手模式　iOS 27.3 Beta 外螢幕可左右移位</h1>
<div class="notice">內容機器翻譯自第三方媒體（NewMobileLife 流動日報），僅供參考，以原文為準。</div><p><img src="https://www.newmobilelife.com/wp-content/uploads/2026/11/iOS27-3-Reachability-Duo.jpg" alt=""></p><p>Apple 在 iOS 27.3 Beta 中將單手模式擴展至 <a href="https://www.newmobilelife.com/tag/iPhone-Duo" target="_blank" rel="noopener noreferrer">iPhone Duo</a>，讓用户在合上機身時把外螢幕內容向左或向右移位，以便拇指觸及。</p><h3>外螢幕內容左右移位</h3><p>當 iPhone Duo 合上時，在左邊緣短距離向左滑動，或在右邊緣短距離向右滑動，即可將外螢幕內容向左或向右移動。</p><p>單手模式可經「設定 ＞ 輔助使用 ＞ 觸控 ＞ 單手模式」開啟或關閉，更新至新軟件後預設為開啟。</p><img src="https://www.newmobilelife.com/wp-content/uploads/2026/09/duo-3.webp" alt="與 iPhone Duo 相關的圖片">
<p><a href="https://www.newmobilelife.com/2026/11/04/iphone-duo-reachability-beta/" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
