<h1>普京：必將回應烏克蘭對俄羅斯能源基建的襲擊</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1879141_1_M_20261125043936.jpg" alt=""></p><h3>正文</h3><p>俄羅斯總統普京表示，烏克蘭武裝部隊持續襲擊俄羅斯的燃料與能源基礎設施，俄方一定會作出回應。</p><p>普京説，雖然美國總統特朗普曾經要求烏克蘭停止這類襲擊，但烏方仍然繼續，推動局勢升級，普京指出，烏方的行動不會對俄方構成顯著後果。</p><p>俄羅斯國防部同日表示，武裝部隊出動無人機，襲擊烏克蘭三處變電站、以及一艘為烏軍運送軍民兩用物資的貨船。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1879141-20261125.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：普京：必將回應烏克蘭對俄羅斯能源基建的襲擊</li></ul>
