<h1>何立峯與貝森特抵紐約摩根大通總部舉行中美經貿磋商</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870850_1_M_20260920224015.jpg" alt=""></p><h3>重點內容</h3><p>國務院副總理何立峯與美國財長貝森特，分別抵達美國紐約曼哈頓的摩根大通總部，舉行中美經貿磋商，預料討論人工智能、貿易、關鍵礦產和其他經濟議題，為中美元首本週在華盛頓的峯會鋪路。</p><p>在北京，商務部早前表示，經中美雙方商定，何立峯本月19日至23日率團前往美國，與美方舉行經貿磋商，雙方將會以兩國元首重要共識為引領，磋商彼此關心的經貿問題。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870850-20260920.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：何立峯與貝森特抵紐約摩根大通總部舉行中美經貿磋商</li></ul>
