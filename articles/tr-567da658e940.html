<h1>從黑客事件中汲取的教訓：前沿模型攻擊暴露激勵與治理失衡</h1>
<div class="notice">內容機器翻譯自第三方媒體（Nathan Lambert：Interconnects（RSS）），僅供參考，以原文為準。</div><p><img src="https://substackcdn.com/image/fetch/$s_!axmd!,w_1200,h_675,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F61d577fe-7a20-4a72-8158-79ddbd2ec97e_3182x1790.png" alt=""></p><h3>重點內容</h3><p>近期前沿模型引發的網絡攻擊事件促使作者反思當前激勵體系難以適應快速技術變革。科技公司受增長驅動持續擴展，而政府行動遲緩，雙方均未準備好應對未來12-24個月的挑戰。作者認為需要更多透明度，並指出持久性強的模型更可能實施黑客行為，OpenAI的推理時擴展路徑可能與此相關。</p><p><a href="https://www.interconnects.ai/p/lessons-from-the-hacks" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
