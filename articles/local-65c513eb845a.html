<h1>深水埗馬騮嘔白泡途人報警　馬騮爬樹離開</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 港聞 · Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/febc5442b3d557c549cb4579e6c4480f6ef21817a7c439e15e41685d4d53a53b/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fmedia.zenfs.com%2Fen%2Fam730_578%2Fdf9876e85055468526efeb5bed47a623.jpg" alt=""></p><h3>正文</h3><p>深水埗馬騮嘔白泡途人報警 馬騮爬樹離開 am730 2026年10月17日週六 下午8:22 Ssp 深水埗有野生動物受傷。</p><p>今日（18日）凌晨1時許，據瞭解，有兩名途人先後經過深水埗大埔道338號一個油站對開時，發現一隻野猴口吐白泡，於是報案求助和通知愛協，愛協人員接報後到場，惟野猴已經爬樹離開。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E6%B7%B1%E6%B0%B4%E5%9F%97%E9%A6%AC%E9%A8%AE%E5%98%94%E7%99%BD%E6%B3%A1%E9%80%94%E4%BA%BA%E5%A0%B1%E8%AD%A6-%E9%A6%AC%E9%A8%AE%E7%88%AC%E6%A8%B9%E9%9B%A2%E9%96%8B-022226613.html" target="_blank" rel="noopener noreferrer">Yahoo 港聞</a>：深水埗馬騮嘔白泡途人報警　馬騮爬樹離開</li></ul>
