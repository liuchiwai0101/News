<h1>元朗火警特別通知</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>電台及電視台當值宣佈員注意，請盡快播出以下信息，並適時重播： 消防處昨日（十一月六日）晚上十時五十八分接獲報告，指元朗白沙村發生火警，並於昨日晚上十一時二十五分升為三級。消防人員正進行滅火行動。 如市民受到隨風飄散的煙霧和異味影響，請盡量留在室內及關閉門窗，並保持鎮定。</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202611/07/P2026110700038.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：元朗火警特別通知</li></ul>
