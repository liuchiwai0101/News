<h1>港鐵屯門第16區站二期項目補地價105億元</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870124_1_M_20260915231457.jpg" alt=""></p><h3>重點內容</h3><p>港鐵公佈，接受政府就屯門第16區站第二期項目提出的補地價金額要約，涉及約105億元。</p><p>補地價要約由政府於7月提出，並參照屯門用地位於鐵路沿綫後的市值作評定。根據項目協議，協定期數的屯門南延綫下調金額，可從地價中扣減。</p><p>項目於本月初由新地獨資投得，並取得基座商場未來擁有權。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870124-20260915.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：港鐵屯門第16區站二期項目補地價105億元</li></ul>
