<h1>滬指開市升21點 深成指升167點</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="https://image.bastillepost.com/640x/wp-content/uploads/hongkong/2024/04/20240307_FI_source-ap_AShare-15.png" alt=""></p><h3>正文</h3><p>內地股市初段向上，上證綜指以3,682點開市，升21點或0.58%。 深證成指開市報11,313點，更升167點或1.51%。 滬深300指數升32點或0.81%，開報4,089點；創業板指數開市報2,518點，升59點或2.44%。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17151467-%e6%bb%ac%e6%8c%87%e9%96%8b%e5%b8%82%e5%8d%8721%e9%bb%9e-%e6%b7%b1%e6%88%90%e6%8c%87%e5%8d%87167%e9%bb%9e" target="_blank" rel="noopener noreferrer">巴士的報</a>：滬指開市升21點 深成指升167點</li></ul>
