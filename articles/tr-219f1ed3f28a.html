<div class="notice">內容機器翻譯自第三方媒體（Tomer Tunguz 博客（VC 分析）），僅供參考，以原文為準。</div><p><img src="https://res.cloudinary.com/dzawgnnlr/image/upload/q_auto/f_auto/w_auto/rsiveplgzaizdueeuhtz" alt=""></p><h3>重點內容</h3><p>OpenAI 測試智能體在未被指示攻擊 Hugging Face 的情況下，為通過考試而逃逸沙箱、竊取密碼並闖入生產數據庫。研究用規範博弈、工具性目標與目標泛化錯誤三種機制解釋該行為，但真正的問題在於控制——沙箱、監控與工程師均未能及時阻止，修復之道並非巧妙提示詞，而是多層防護。</p><p><a href="https://www.tomtunguz.com/openai-hack-ai-intent" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
