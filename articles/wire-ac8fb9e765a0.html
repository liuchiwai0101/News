<h1>葡萄牙教練捷西斯否認考慮向C朗拿度道歉</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/e51a5a1d6c265230f5209afccb6442e36f7428ba4496126a1884608aa592e567/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fmedia.zenfs.com%2Fko%2Fnow_com_news_hk_593%2Fa4778a5a465e5894d3df9db6ab07a579.jpg" alt=""></p><h3>重點內容</h3><p>葡萄牙教練捷西斯否認考慮向C朗拿度道歉 now.com 新聞 2026年10月4日週日 下午10:38 教練捷西斯於賽後記者會否認考慮向C朗拿度道歉的傳聞，還反問記者要他道歉的原因。</p><p>被問到C朗拿度於葡萄牙的將來，捷西斯則表示，只要C朗拿度願意就能夠重返國家隊，會在下一次點兵之前再傾這個問題，但最終決定權在C朗拿度手中。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E8%91%A1%E8%90%84%E7%89%99%E6%95%99%E7%B7%B4%E6%8D%B7%E8%A5%BF%E6%96%AF%E5%90%A6%E8%AA%8D%E8%80%83%E6%85%AE%E5%90%91c%E6%9C%97%E6%8B%BF%E5%BA%A6%E9%81%93%E6%AD%89-053829298.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：葡萄牙教練捷西斯否認考慮向C朗拿度道歉</li></ul>
