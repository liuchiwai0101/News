<h1>中韓海上執法機構相隔4年再次舉行聯合巡航</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874306_1_M_20261017164719.jpg" alt=""></p><h3>正文</h3><p>中國與韓國海上執法機構時隔4年再次舉行聯合執法巡航。</p><p>聯合巡航為期10日，中國海警長山艦與韓國無窮花42漁業指導船在中韓漁業協定暫定措施水域，完成各項任務後返回碼頭。</p><p>央視報道，聯合巡航期間，雙方艦船依據中韓漁業協定，對兩國逾百艘作業漁船進行觀察記錄和登臨檢查，並對漁民展開宣傳教育，累計巡航超過271小時、1265海里，中韓暫定措施水域生產作業秩序總體良好。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874306-20261017.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：中韓海上執法機構相隔4年再次舉行聯合巡航</li></ul>
