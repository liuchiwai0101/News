<h1>Cloudflare 用身份感知分析捕捉失控 AI 行為</h1>
<div class="notice">內容機器翻譯自第三方媒體（Cloudflare Blog），僅供參考，以原文為準。</div><p><img src="https://blog.cloudflare.com/_emdash/api/media/file/01KZ7B4VA7KJWAWH8CXYKRWQSK.png" alt=""></p><h3>重點內容</h3><p>Cloudflare 推出身份感知 AI Gateway 與 User Insights，為每個請求綁定經 Access 驗證的用户身份，並基於賬户自身歷史行為建立基線，識別偏離正常模式的異常會話。該功能現處於開放測試階段，User Insights 已向所有 AI Gateway 客户免費開放。其異常檢測以近 30 天會話成本 p95 為基準，超過 2 倍即標記為可疑行為。</p><p><a href="https://blog.cloudflare.com/identity-aware-ai-gateway" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
