<h1>英揆：重新加入歐盟是英國未來處理對歐關係選項之一</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872215_1_M_20261001004444.jpg" alt=""></p><h3>正文</h3><p>英國首相貝安德表示，重新加入歐盟是英國未來處理對歐關係的選項之一。</p><p>貝安德在英國廣播公司當地星期三播出的訪談節目中被主持人問到是否希望英國重新加入歐盟，他回應時表示，英國脱歐弊大於利，希望在有生之年看到英國重新加入歐盟，又稱會考慮不同選項，包括維持現狀、重返關税同盟和單一市場等。</p><p>英國在2016年6月舉行全民公投，有五成二投票者選擇脱歐。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872215-20261001.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：英揆：重新加入歐盟是英國未來處理對歐關係選項之一</li></ul>
