<h1>選委會選舉丨科創界聚焦AI發展灣區融合 候選人為國際創科中心建設獻計獻策</h1>
<div class="notice">內容機器翻譯自第三方媒體（橙新聞），僅供參考，以原文為準。</div><p><img src="https://cdn.orangenews.hk/images/2026/11/14/a6eb9dc0493345cfa0ce1dcafb2390e1.jpg" alt=""></p><h3>正文</h3><p>2026年選舉委員會界別分組一般選舉將於11月22日投票。屬選舉委員會第二界別「專業界」下的科技創新界昨日（13日）舉行交流見面會，18名候選人圍繞人工智能（AI）發展、灣區融合及成果轉化等領域分享己見，現場氣氛熱烈。是次見面會由互聯網專業協會、香港資訊科技聯會、香港軟件行業協會及京港學術交流中心主辦。</p><h3>各方報道</h3><ul><li><a href="https://www.orangenews.hk/hongkong/VaufIC0/%E9%81%B8%E5%A7%94%E6%9C%83%E9%81%B8%E8%88%89-%E7%A7%91%E5%89%B5%E7%95%8C%E8%81%9A%E7%84%A6AI%E7%99%BC%E5%B1%95%E7%81%A3%E5%8D%80%E8%9E%8D%E5%90%88-%E5%80%99%E9%81%B8%E4%BA%BA%E7%82%BA%E5%9C%8B%E9%9A%9B%E5%89%B5%E7%A7%91%E4%B8%AD%E5%BF%83%E5%BB%BA%E8%A8%AD%E7%8D%BB%E8%A8%88%E7%8D%BB%E7%AD%96.shtml" target="_blank" rel="noopener noreferrer">橙新聞</a>：選委會選舉丨科創界聚焦AI發展灣區融合 候選人為國際創科中心建設獻計獻策</li></ul>
