<h1>卡塔爾説美國和伊朗仍就結束衝突談判</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872936_1_M_20261007041524.jpg" alt=""></p><h3>重點內容</h3><p>卡塔爾表示，美國和伊朗仍在就結束衝突進行磋商，並考慮各方的關切。</p><p>卡塔爾外交部媒體與傳播司司長哈什米當地星期二在例行記者會上説，談判仍在進行，衝突有關各方之間繼續通過卡塔爾及地區夥伴交換信息，各方正通過外交努力彌合分歧，但他拒絕就具體方案、分歧焦點或其他技術性細節發表評論，強調整個世界為這場衝突付出巨大代價，必須竭盡全力，通過談判桌上能夠達成的解決方案立即結束衝突。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872936-20261007.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：卡塔爾説美國和伊朗仍就結束衝突談判</li></ul>
