<h1>政府本週五起一連三日設三個弔唁處　供市民簽弔唁冊悼念董建華</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870335_1_M_20260916231240.jpg" alt=""></p><h3>重點內容</h3><p>全國政協前副主席、香港特區首兩任行政長官董建華本月8日逝世，享年89歲。民政事務總署由本週五起一連三日設置三個弔唁處，供市民簽署弔唁冊，以表達深切悼念。</p><p>簽署弔唁冊的時間為本週五和週六的上午9時至晚上9時，以及週日的上午9時至中午12時。弔唁處地點分別為銅鑼灣摩頓台活動中心、啟德社區會堂、以及荃灣西樓角花園多用途活動室。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870335-20260916.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：政府本週五起一連三日設三個弔唁處　供市民簽弔唁冊悼念董建華</li></ul>
