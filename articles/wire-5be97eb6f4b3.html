<h1>發放破產欠薪保障基金特惠款項個案刊憲</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>勞工處處長今日（十一月二十七日）根據《破產欠薪保障條例》（第380章）第16（1A）條及／或第18（2）條的規定，就僱員獲發破產欠薪保障基金特惠款項的個案於憲報刊登公告。 有關公告的詳情，請參閲 政府物流服務署電子憲報 網頁政府公告編號第7658號至7694號。</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202611/27/P2026112700245.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：發放破產欠薪保障基金特惠款項個案刊憲</li></ul>
