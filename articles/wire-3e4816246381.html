<h1>新世界發展今早停牌</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · 巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2024/06/bplib_20240626-132020_20240626_CR_New-World-1_source-web__704px.jpg" alt=""></p><h3>正文</h3><p>早前《彭博》引述據知情人士透露，鄭家純家族旗下投資機構周大福企業向銀行尋求約50億元新資金。</p><p>報道指，知情人士表示這筆融資將是一筆新增貸款，用於一般企業用途。惟周大福企業稱文章內容與事實不符。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1877642-20261113.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：新世界發展今早停牌</li><li><a href="https://www.bastillepost.com/hongkong/article/17173684-%e6%96%b0%e4%b8%96%e7%95%8c%e7%99%bc%e5%b1%95%e5%81%9c%e7%89%8c" target="_blank" rel="noopener noreferrer">巴士的報</a>：新世界發展停牌</li></ul>
