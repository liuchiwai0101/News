<h1>亞運場地單車男子團體競速賽　港隊擊敗馬來西亞取得銅牌</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>重點內容</h3><p>亞運場地單車項目賽事展開，港隊於男子團體競速賽奪得一面銅牌。</p><p>港隊由莫沚駿、杜棹熙和翁浚皓上陣，資格賽時間排名第4晉級，到初賽以44.116秒的成績晉身銅牌賽。</p><p>銅牌賽與馬來西亞隊對壘，造出43.507秒，較對手快超過0.8秒，奪得銅牌。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872010-20260929.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：亞運場地單車男子團體競速賽　港隊擊敗馬來西亞取得銅牌</li></ul>
