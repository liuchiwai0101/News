<h1>iOS 27 第 6 版公開測試版登場　RC 預計快將推出</h1>
<p>Apple 今日發佈 iOS 27、iPadOS 27、tvOS 27 及 macOS Golden Gate 的第六個公開測試版，讓擁有相容裝置的用戶可下載並試用最新軟件。此次更新距離第五個測試版僅一週，且在第八個開發者測試版發佈數小時後推出。 如何參與公開測試 用戶需先於 Apple 官方測試網站註冊，隨後在裝置上開啟「設定」應用程式，進入「一般」選項，選擇「軟體更新」，即可啟用公開測試版。 測試階段接近尾聲 目前 Beta…</p>
