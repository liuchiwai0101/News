<h1>民政事務總署已開放18間臨時避寒中心</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · 政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1878621_1_M_20261120181511.jpg" alt=""></p><h3>正文</h3><p>民政事務總署已在各區開放共18間臨時避寒中心，供有需要的市民避寒。中心會於寒冷天氣警告持續生效期間繼續開放。</p><p>各臨時避寒中心在開放期間會免費提供潔淨的墊褥和毛氈或棉被、熱食和熱水予入住人士使用。</p><p>任何人士如需使用避寒中心或查詢有關在中心派贈物品的安排，可致電民政事務總署熱線2572 8427。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1878621-20261120.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：民政事務總署已開放18間臨時避寒中心</li><li><a href="https://www.info.gov.hk/gia/general/202611/20/P2026112000577.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：民政事務總署已開放臨時避寒中心</li></ul>
