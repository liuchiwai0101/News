<h1>Research Gold 號稱“100%人類撰寫、絕不使用AI”，實則全程由AI驅動</h1>
<div class="notice">內容機器翻譯自第三方媒體（Hacker News 熱門（buzzing.cc 中文翻譯）），僅供參考，以原文為準。</div><p><img src="https://images.unsplash.com/photo-1581093577421-f561a654a353?crop&amp;#x3D;entropy&amp;amp;cs&amp;#x3D;tinysrgb&amp;amp;fit&amp;#x3D;max&amp;amp;fm&amp;#x3D;jpg&amp;amp;ixid&amp;#x3D;M3wxMTc3M3wwfDF8c2VhcmNofDExfHxyZXNlYXJjaGVyfGVufDB8fHx8MTc4NjM2OTE1Mnww&amp;amp;ixlib&amp;#x3D;rb-4.1.0&amp;amp;q&amp;#x3D;80&amp;amp;w&amp;#x3D;2000" alt=""></p><h3>重點內容</h3><p>面向醫學研究者的網站 Research Gold 宣稱其服務“100%由人類撰寫、絕不使用AI”，並列出多名博士審稿人。但調查發現，這些審稿人系AI生成、並不存在；部分真實方法學家的身份和照片未經許可被挪用。致電該公司時，自稱“Sarah”的AI助手堅稱自己是真人，郵件與聊天回覆也均為AI生成。</p><p><a href="https://www.404media.co/company-offering-100-human-written-never-ai-peer-review-is-entirely-ai" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
