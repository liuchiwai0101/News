<h1>人權組織：中國對酷刑“欲蓋彌彰” 良心犯成主要受害群體</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/8114/8657120528_e88bbb1cc5_b.jpg" alt=""></p><p>人權組織週三發佈報告稱，中國近年來持續存在針對良心犯的酷刑和虐待現象，包括毆打、刑訊逼供以及剝奪獲得適當醫療的權利，而涉嫌施害的執法和監管人員幾乎未被追究責任。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/人权组织：中国对酷刑-欲盖弥彰-良心犯成主要受害群体/a-79289213?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：人權組織：中國對酷刑“欲蓋彌彰” 良心犯成主要受害群體</li></ul>
