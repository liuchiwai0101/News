<h1>德語媒體：休戰期延長 火藥味未減</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/7032/6536097779_a0e9213ae9_b.jpg" alt=""></p><p>《新蘇黎世報》評論寫道，中美峯會上，兩國領導人笑逐顏開的姿態無法掩蓋中美之間的深層矛盾，兩個月的“休戰期”過後，全球經濟仍需面對貿易戰死灰復燃的風險。《南德意志報》評論稱，特朗普對習近平的極力討好也顯示出，華盛頓已經無法承受公開對抗中國的代價。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/德语媒体：休战期延长-火药味未减/a-79476387?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：德語媒體：休戰期延長 火藥味未減</li></ul>
