<h1>微軟首次披露OpenAI貢獻七成AI收入</h1>
<div class="notice">內容機器翻譯自第三方媒體（X：Rohan Paul (@rohanpaul_ai)），僅供參考，以原文為準。</div><p><img src="https://pbs.twimg.com/media/HPCf9OWaAAASeJr.jpg:large" alt=""></p><h3>重點內容</h3><p>微軟剛剛首次披露，OpenAI 貢獻了微軟約 70% 的 AI 收入，依據最新文件。 這一數據基於預期增長及此前與 OpenAI 相關收入的披露。 241 億美元中的大部分是 OpenAI 在微軟數據中心訓練和運行 ChatGPT 的雲賬單，再加上模型開發成本和 OpenAI 自身銷售的分成，全部由微軟合併計入收入。微軟同時還向 OpenAI 投入了 119 億美元。</p><p><a href="https://x.com/rohanpaul_ai/status/2085368375816163423" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
