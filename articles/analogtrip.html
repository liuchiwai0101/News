<h1>極簡離線旅行日誌　原價 US $0.99《AnalogTrip》限時免費</h1>
<p>AnalogTrip 是一款主打純粹體驗的離線旅行規劃與記錄工具，適合希望減少手機干擾、專注享受旅途的用戶。這款應用目前限時免費，讓你能夠以無廣告、無通知的方式，輕鬆管理行程、地圖與開支。 整合行程地圖與開支 AnalogTrip 將日程安排、地圖導航與費用追蹤整合於單一介面，無需切換畫面即可查看全天計畫。它支援完全離線使用，數據僅存於本地裝置，並提供真實步行路線繪製與多幣種開支統計功能，讓你放下手機後仍能高效掌握旅行細節，重溫每一段旅程的美好回憶。</p>
