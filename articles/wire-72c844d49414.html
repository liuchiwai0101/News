<h1>大角咀發生工業意外　男工人高處墮下昏迷送院</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870484_1_M_20260917201030.jpg" alt=""></p><h3>重點內容</h3><p>大角咀發生工業意外，一名男工人從高處墮下昏迷。</p><p>現場是海輝道10號私人屋苑「瓏璽」，警方晚上7時許接報，指一名60歲男工人在維修水箱期間，懷疑從3米高的水箱墮下，他頭部受傷昏迷，由救護車送往伊利沙伯醫院搶救。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870484-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：大角咀發生工業意外　男工人高處墮下昏迷送院</li></ul>
