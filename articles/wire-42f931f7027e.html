<h1>杜凱琹和吳詠琳亞運乒乓女雙擊敗新加坡選手晉四強　穩奪獎牌</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>重點內容</h3><p>名古屋亞運乒乓女雙賽事，本港組合杜凱琹、吳詠琳在八強戰3:0擊敗新加坡組合黎明映、舒麟茜，晉級準決賽，由於不設季軍戰，港隊將穩奪獎牌。</p><p>杜凱琹、吳詠琳面對新加坡對手，沒有遇到太大考驗，直落三局11:4、11:2和11:7勝出。</p><p>四強戰將於星期一上演，港隊組合會面對東道主日本組合張本美和、早田希娜，爭奪決賽席位。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871681-20260926.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：杜凱琹和吳詠琳亞運乒乓女雙擊敗新加坡選手晉四強　穩奪獎牌</li></ul>
