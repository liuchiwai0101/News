<h1>《環看天下》：印尼大火煙霧威脅鄰國　專家憂觸發驚人碳排放</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869225_1_M_20260908113718.jpg" alt=""></p><h3>重點內容</h3><p>印尼部分島嶼的大面積森林大火，未有受控跡象，造成的霧霾問題，近期更波及鄰國馬來西亞及新加坡，空氣污染曾經升至危及健康水平。</p><p>專家相信大火持續的原因之一，包括厄爾尼諾氣候現象增強，加劇旱情。科學界亦憂慮，區內有大量碳含量極高的「泥炭地」持續燃燒，釋出的温室氣體相當於一般森林火災的十倍，關注會否令全球氣候危機進一步惡化。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869225-20260908.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：《環看天下》：印尼大火煙霧威脅鄰國　專家憂觸發驚人碳排放</li></ul>
