<div class="notice">內容機器翻譯自第三方媒體（Alexandr Wang），僅供參考，以原文為準。</div><p><img src="https://pbs.twimg.com/profile_images/1631421210205749248/uohbT_40_400x400.jpg" alt=""></p><h3>AI 導讀</h3><p>Alexandr Wang 轉發 @trevin 分享的 Muse 提示詞，該提示詞也可用於 Instinct 和 Grok @bot，作用是掃描未來 14 天日曆、為異地會議自動添加 Travel time 通勤緩衝時間塊。</p><h3>推薦理由</h3><p>轉發了一份可直接複用的日曆通勤時間保護提示詞，含意圖識別、衝突處理和用户偏好記憶等實用設計。</p><p><a href="https://x.com/alexandr_wang/status/2101141362607632873" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
