<h1>陳美寶：考慮巴士加價申請不會只看短暫因素</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · 巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2026/10/202601009_CR_KWB04_source_licensed_.jpg" alt=""></p><h3>正文</h3><p>四間專營巴士公司申請加價，運輸及物流局局長陳美寶表示，所謂巴士公司「開天殺價」，政府「落地還錢」的説法﹐是反映政府的把關角色。</p><p>陳美寶出席本台節目時表示，考慮巴士加價申請時，不會只是看短暫因素﹐會重視對市民負擔能力及出行選擇的影響。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1875214-20261024.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：陳美寶：考慮巴士加價申請不會只看短暫因素</li><li><a href="https://www.bastillepost.com/hongkong/article/17040391-%e9%99%b3%e7%be%8e%e5%af%b6%ef%bc%9a%e5%af%a9%e6%89%b9%e5%b7%b4%e5%a3%ab%e5%8a%a0%e5%83%b9%e7%94%b3%e8%ab%8b%e9%87%8d%e8%a6%96%e5%b0%8d%e5%b8%82%e6%b0%91%e8%b2%a0%e6%93%94%e8%83%bd%e5%8a%9b-%e4%b8%8d" target="_blank" rel="noopener noreferrer">巴士的報</a>：陳美寶：審批巴士加價申請重視對市民負擔能力 不只看短暫因素</li></ul>
