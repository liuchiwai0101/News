<h1>中國動向中期業績盈轉虧 半年虧損約1,300萬人幣</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2024/06/20231020_FI_source-web_03818.jpg" alt=""></p><h3>正文</h3><p>中國動向(03818)公佈，截至2026年9月底止半年由盈轉虧，公司擁有人應佔虧損1,267.3萬元(人民幣‧下同)，董事會不擬派股息。 期內收入7.14億元，按年減少4.5%。毛利4.79億元，倒退6.3%；毛利率67.1%，按年下降1.2個百分點。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17259392-%e4%b8%ad%e5%9c%8b%e5%8b%95%e5%90%91%e4%b8%ad%e6%9c%9f%e6%a5%ad%e7%b8%be%e7%9b%88%e8%bd%89%e8%99%a7-%e5%8d%8a%e5%b9%b4%e8%99%a7%e6%90%8d%e7%b4%841300%e8%90%ac%e4%ba%ba%e5%b9%a3" target="_blank" rel="noopener noreferrer">巴士的報</a>：中國動向中期業績盈轉虧 半年虧損約1,300萬人幣</li></ul>
