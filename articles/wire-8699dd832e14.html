<h1>澳洲首次在海獅身上驗出H5N1禽流感</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869878_1_M_20260914001358.jpg" alt=""></p><h3>重點內容</h3><p>南澳環境部長伯克説，過去的星期五在袋鼠島南部發現一隻海獅死亡，檢測後證實牠體內有H5N1禽流感病毒。當局的數據顯示，全澳洲至今證實521宗動物感染H5N1禽流感的個案，當中大約一半在南澳。</p><p>當局統計，目前野生的澳洲海獅數量大約只有1萬2千隻，當中約85%生活在南澳，今次通報病例的袋鼠島海豹灣，是澳洲海獅全球第三大棲息地。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869878-20260914.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：澳洲首次在海獅身上驗出H5N1禽流感</li></ul>
