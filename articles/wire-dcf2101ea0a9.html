<h1>銅鑼灣住户火燒蜂巢　火舌跌落樓下單位冷氣機　幸未釀成火警</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞 · Yahoo 港聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/6030cb2d8327c50ea314a4061effb799bba2a383d11c5f6aca8b5c79d3c1307d/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fd29szjachogqwa.cloudfront.net%2Fimages%2Fuser-uploaded%2Fbkn-20261021085728263-1021-00822-001-01p_0363.jpg" alt=""></p><h3>正文</h3><p>銅鑼灣禮頓道32至34號星華大廈一住户報案，指懷疑樓上單位有人用火燒毀蜂巢，期間部分起火蜂巢跌落其單位外的冷氣機頂部。人員接報到場前火勢已熄滅，部分蜂巢殘留在大廈3樓一單位簷篷上，幸事件未釀成火警，經調查後列「誤會」處理。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E9%8A%85%E9%91%BC%E7%81%A3%E4%BD%8F%E6%88%B6%E7%81%AB%E7%87%92%E8%9C%82%E5%B7%A2-%E7%81%AB%E8%88%8C%E8%B7%8C%E8%90%BD%E6%A8%93%E4%B8%8B%E5%96%AE%E4%BD%8D%E5%86%B7%E6%B0%A3%E6%A9%9F-%E5%B9%B8%E6%9C%AA%E9%87%80%E6%88%90%E7%81%AB%E8%AD%A6-041013919.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：銅鑼灣住户火燒蜂巢　火舌跌落樓下單位冷氣機　幸未釀成火警</li></ul>
