<h1>恒指半日跌129點</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871364_1_M_20260924121219.jpg" alt=""></p><h3>重點內容</h3><p>港股延續跌勢，恒指今早曾跌近190點，低見24648點，半日收報24704點，跌129點，跌幅0.52%，成交額縮減至約822億元。</p><p>資源、醫藥、內房股向下，AI概念股亦普遍受壓。油價結束多日跌勢，3桶油升逾0.2%至2%以上。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871364-20260924.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：恒指半日跌129點</li></ul>
