<h1>海關於落馬洲管制站檢獲懷疑非法進口活貓　 一名旅客被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869875_1_M_20260913224115.jpg" alt=""></p><h3>重點內容</h3><p>海關在落馬洲支線管制站偵破一宗懷疑非法進口動物的案件，檢獲一隻懷疑非法進口活貓，估計市值共約2萬5千元，拘捕一名內地男子。</p><p>海關人員在管制站入境大堂截查一名61歲抵港內地男旅客，在他的行李內檢獲懷疑非法進口活貓，將他拘捕。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869875-20260913.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：海關於落馬洲管制站檢獲懷疑非法進口活貓　 一名旅客被捕</li></ul>
