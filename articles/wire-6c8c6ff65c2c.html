<h1>昂船洲泊岸船隻起火　消防籲受煙霧異味影響關門窗</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>正文</h3><p>昂船洲一艘已泊岸船隻發生火警，消防接報到場救火。 事發於今早近10時。消防處説，如市民受到隨風飄散的煙霧和異味影響，應盡量留在室內及關閉門窗，並保持鎮定。 編輯：汪溟曦</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874284-20261017.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：昂船洲泊岸船隻起火　消防籲受煙霧異味影響關門窗</li></ul>
