<h1>運輸署要求嶼巴加強服務　便利乘客往返大東山</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1877891_1_M_20261115183215.jpg" alt=""></p><h3>正文</h3><p>運輸署表示，大東山是秋季熱門景點，已要求新大嶼山巴士加強服務，應對乘客需求。</p><p>本週末，嶼巴已增加伯公坳巴士站往東湧的班次，涉及第3M、11及23號線。下午繁忙時段，聯合班次由約5分鐘一班加密至約3分鐘一班，並安排「吉車」由該站起載客，以進一步疏導乘客。</p><p>署方表示，會繼續與嶼巴緊密合作，密切監察情況，做好交通配套，又呼籲市民出行預留充裕交通時間。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1877891-20261115.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：運輸署要求嶼巴加強服務　便利乘客往返大東山</li></ul>
