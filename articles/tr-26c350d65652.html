<h1>SpaceXAI 單季資本開支 183.7 億美元，AI 投入接近微軟總資本開支四成</h1>
<div class="notice">內容機器翻譯自第三方媒體（Tomer Tunguz 博客（VC 分析）），僅供參考，以原文為準。</div><p><img src="https://res.cloudinary.com/dzawgnnlr/image/upload/q_auto/f_auto/w_auto/p0vhm7xwilftd2q52d0l" alt=""></p><h3>重點內容</h3><p>SpaceXAI 上季度資本開支 183.7 億美元，其中 158.3 億美元投向 AI，接近微軟同期總資本開支的 40%。其運營現金流僅覆蓋資本開支的 12%，主要靠舉債和股權融資，而微軟覆蓋率達 155%。公司股價較 6 月峯值腰斬，6 月發行的 250 億美元債券各期限均跌破面值。</p><p><a href="https://www.tomtunguz.com/the-newest-hyperscaler" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
