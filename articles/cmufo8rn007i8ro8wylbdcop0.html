<h1>NVIDIA 聯合 Google DeepMind 等機構開放 2800 多種病毒的蛋白複合物預測結構數據集</h1>
<div class="notice">內容機器翻譯自第三方媒體（NVIDIA），僅供參考，以原文為準。</div><p><img src="https://blogs.nvidia.com/wp-content/uploads/2026/09/AF-0000000212056767-master-black-background-scaled.png" alt=""></p><h3>AI 導讀</h3><p>NVIDIA 與 Google DeepMind、EMBL-EBI 等全球研究機構合作，通過 AlphaFold Database 開放發佈 2800 多種病毒的蛋白複合物預測 3D 結構，旨在為下一次疫情儲備知識。</p><h3>推薦理由</h3><p>原文給出數據集規模、覆蓋範圍和可複用的開源預測流程，讀者可以據此評估如何用於自己的蛋白結構研究。</p><p><a href="https://blogs.nvidia.com/blog/open-protein-dataset" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
