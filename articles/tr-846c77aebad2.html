<h1>Arbitrage：利用優勢感知投機實現高效推理</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>現代大語言模型通過長思維鏈實現強大推理能力，但推理計算成本高昂。投機解碼（Speculative Decoding）用快速但不精確的草稿模型提議 token，再由更強的目標模型並行驗證，以加速推理。然而，語義等價步驟中的 token 不匹配會導致不必要的拒絕，傳統 token 級投機解碼因此受限。</p><p><a href="https://machinelearning.apple.com/research/arbitrage-efficient-reasoning" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
