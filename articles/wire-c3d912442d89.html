<h1>陷爭議的德國科研“燈塔”：與中國合作時疏忽安全</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3846/14667017161_22a3502fb3_b.jpg" alt=""></p><p>德國頂尖信息技術安全研究中心CISPA被指在與中國的合作時未能有效保護數據安全。儘管是否存在數據泄露未得到證實，但一份獨立的外部調查報告指出，該研究中心在科研安全和商業秘密保護方面存在嚴重缺陷。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/陷争议的德国科研-灯塔-：与中国合作时疏忽安全/a-79410367?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：陷爭議的德國科研“燈塔”：與中國合作時疏忽安全</li></ul>
