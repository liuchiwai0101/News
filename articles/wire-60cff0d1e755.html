<h1>瑞典議會選舉　反對陣營微弱優勢領先執政聯盟</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869933_1_M_20260914124406.jpg" alt=""></p><h3>重點內容</h3><p>瑞典選舉委員會公佈初步點票結果顯示，左翼反對派陣營得票率，以微弱優勢，領先右翼執政聯盟。</p><p>委員會表示，在349個議會議席中，由前首相安德松率領的左翼陣營，預計將贏得176個席位，比現任首相克里斯特松領導的右翼執政聯盟多3席。</p><p>59歲的安德松説，他們正在領先，如果結果得到確認，瑞典將迎來新政府。</p><p>點票工作仍在進行中，最終結果最快可能在星期三揭曉。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869933-20260914.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：瑞典議會選舉　反對陣營微弱優勢領先執政聯盟</li></ul>
