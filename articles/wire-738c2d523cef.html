<h1>支持與台灣維持邦交  巴拉圭、伯利茲兩位部長遭中國製裁</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/5720/21667172841_c459656c59_b.jpg" alt=""></p><h3>正文</h3><p>北京宣佈制裁家巴拉圭和伯利茲的兩位部長，理由是他們“頑固支持與台灣保持邦交關係”，並形容他們是“反華政客”，“出於一己私利”而支持與台灣維持邦交。路透社指出，中方制裁措施大致上是象徵性質，因為台灣邦交國的官員通常不會造訪中國。此前，中國也曾對友台的歐美政治人物施加類似措施。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/支持与台湾维持邦交-巴拉圭、伯利兹两位部长遭中国制裁/a-79642796?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：支持與台灣維持邦交  巴拉圭、伯利茲兩位部長遭中國製裁</li></ul>
