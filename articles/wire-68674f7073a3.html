<h1>數據顯示週末最少3艘船在霍爾木茲海峽遇襲</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872808_1_M_20261006032822.jpg" alt=""></p><h3>正文</h3><p>數據顯示，近日最少3艘船在霍爾木茲海峽遇襲。</p><p>英國海上貿易行動辦公室通報，2艘運油輪和1艘石油氣運輸船，過去的週末在霍爾木茲海峽被不明發射物擊中，有關方面正在調查。</p><p>辦公室又指，一艘運油輪星期一駛到霍爾木茲海峽南岸，在阿曼海塞卜以北約11海里，被伊朗革命衞隊要求掉頭，否則會發動攻擊，運油輪其後改變航道。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872808-20261006.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：數據顯示週末最少3艘船在霍爾木茲海峽遇襲</li></ul>
