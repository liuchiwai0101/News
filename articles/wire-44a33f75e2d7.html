<h1>教宗良十四世完成手術後首次露面　感謝公眾禱告支持</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874412_1_M_20261019052406.jpg" alt=""></p><h3>正文</h3><p>教宗良十四世完成肺部手術後首次公開露面，星期日於梵蒂岡主持每週例行禱告。</p><p>良十四世在聖伯多祿大殿的露台向群眾揮手，大批民眾鼓掌歡呼。他感謝過去數天為他禱告的人，説真切地感受到大家的支持，他又感謝羅馬傑梅利醫院的團隊。</p><p>上週完成手術切除部分右肺的良十四世説，這段經歷讓他對所有正在與病痛鬥爭的人感同身受，他在未來一段日子會逐步恢復公務。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874412-20261019.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：教宗良十四世完成手術後首次露面　感謝公眾禱告支持</li></ul>
