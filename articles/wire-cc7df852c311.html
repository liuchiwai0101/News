<h1>日韓股市初段齊反彈逾1%</h1>
<div class="notice">內容機器翻譯自第三方媒體（巴士的報），僅供參考，以原文為準。</div><p><img src="http://media.bastillepost.com/wp-content/uploads/hongkong/2025/05/20250507_FI_source-ap_Japan_Financial_Markets.jpg" alt=""></p><h3>正文</h3><p>日韓股市初段雙雙反彈，暫時升幅均超過1%。 截至香港時間上午約8時21分，日經平均指數升924點或1.62%，報57,935點。 南韓首爾綜合指數暫也升75點或1.61%，報4,773點。</p><h3>各方報道</h3><ul><li><a href="https://www.bastillepost.com/hongkong/article/17265047-%e6%97%a5%e9%9f%93%e8%82%a1%e5%b8%82%e5%88%9d%e6%ae%b5%e9%bd%8a%e5%8f%8d%e5%bd%88%e9%80%be1" target="_blank" rel="noopener noreferrer">巴士的報</a>：日韓股市初段齊反彈逾1%</li></ul>
