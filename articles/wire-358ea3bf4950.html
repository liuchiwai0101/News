<h1>亞運帆船項目　港隊增添一銀一銅</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872282_1_M_20261001133124.jpg" alt=""></p><h3>正文</h3><p>名古屋亞運帆船項目，港隊在女子快速艇49人FX級及男子快速艇49人級賽事，增添一銀一銅。</p><p>女子快速艇49人FX級賽事有4支隊伍參賽，港隊女子代表麥曉彤和普珺麗，在9輪賽事中，表現一直穩定，扣除最差一場成績後得到16分，不敵日本，得到亞軍，國家隊和印度代表分別奪得第三名及第四名。</p><p>男子快速艇49人級賽事有6隊角逐，港隊的阿輝和祥傑以第3名完成賽事，國家隊和印度得到冠亞軍。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872282-20261001.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：亞運帆船項目　港隊增添一銀一銅</li></ul>
