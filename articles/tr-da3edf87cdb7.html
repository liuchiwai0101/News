<h1>OpenAI 啓動新計劃，強化國家安全領域 AI 的民主監督</h1>
<div class="notice">內容機器翻譯自第三方媒體（OpenAI：官網動態（RSS · 排除企業/客户案例）），僅供參考，以原文為準。</div><p><img src="https://images.ctfassets.net/kftzwdyauwt9/6HEG4BoWGKBEoSJWCReHz0/1b1c0b24720bb3faec4a71e48e8ceef7/openai-democratic-oversight-page-seo-v004.png?w=1600&amp;amp;h=900&amp;amp;fit=fill" alt=""></p><h3>重點內容</h3><p>OpenAI 啓動新計劃，幫助民主監督機構發展專業能力與工具，以理解和監督政府將 AI 用於國家安全。未來一年，OpenAI 將提供 500 萬美元用於培訓、技術支持和 OpenAI 積分，並與監督機構試點工具，幫助授權審查員檢查 AI 輔助政府決策的相關記錄。OpenAI 強調 AI 應增強而非取代人類判斷，且不承擔對政府的監督角色。</p><p><a href="https://openai.com/index/strengthening-democratic-oversight-in-national-security" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
