<div class="notice">內容機器翻譯自第三方媒體（Databricks：Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://www.databricks.com/sites/default/files/blog_images/databricks-completes-acquisition-of-panther-accelerating-the-blog-img-og.png" alt=""></p><h3>重點內容</h3><p>Databricks 宣佈正式完成對安全數據平台 Panther 的收購，旨在加速安全湖倉（Security Lakehouse）時代。此次收購將 Panther 的安全分析能力整合進 Databricks 平台，幫助企業在統一的數據架構上運行安全運營與威脅檢測工作負載。具體交易條款未披露。</p><p><a href="https://www.databricks.com/blog/databricks-completes-acquisition-panther-accelerating-security-lakehouse-era" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
