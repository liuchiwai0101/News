<div class="notice">內容機器翻譯自第三方媒體（OpenRouter：Announcements（RSS）），僅供參考，以原文為準。</div><p><img src="https://openrouter.ai/blog/images/openrouter-stripe.png" alt=""></p><h3>重點內容</h3><p>OpenRouter 宣佈與 Stripe 合併，以加速推動全球經濟增長。OpenRouter 目前每日處理來自 400 多個 AI 模型的 10+ 萬億 token，服務超 1000 萬開發者與公司，自成立以來推理量每年至少增長 10 倍。合併後 OpenRouter 將繼續以原名、原使命獨立運營，產品與路線圖不變，路由決策仍以用户利益為先，交易預計在未來數週內完成。</p><p><a href="https://openrouter.ai/blog/announcements/openrouter-is-joining-stripe" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
