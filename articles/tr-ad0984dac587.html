<h1>千問開放平台上線：租房、寄快遞、查理財等十餘領域服務可對話辦理</h1>
<div class="notice">內容機器翻譯自第三方媒體（公眾號：千問APP（阿里）），僅供參考，以原文為準。</div><p><img src="https://api.openverse.org/v1/images/15e3a534-b721-4500-92c6-4b4bc8a2fbda/thumb/" alt=""></p><h3>重點內容</h3><p>千問開放平台今日上線，面向生態夥伴和開發者開放手機、PC和AI眼鏡三類終端的服務接入，首批覆蓋物流運輸、房產居住、本地生活、理財、汽車等十多個領域。用户可在對話中@相關服務或點擊“圓點角標”進入智能體，完成從諮詢、推薦到下單的完整流程。平台支持標準化協議接入、一鍵授權與端到端調測，並提供賬號、AI支付、訂單接入等基礎設施。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzYzNDE5MDEwMQ%3D%3D&amp;mid=2247488345&amp;idx=1&amp;sn=ef4e57c9c9350f9238d90211eb2dd453" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
