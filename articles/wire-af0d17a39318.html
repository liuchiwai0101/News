<h1>一名女嬰啟德簡約公屋昏迷　送院後不治</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869498_1_M_20260910094205.jpg" alt=""></p><h3>重點內容</h3><p>一名年約一歲女嬰在啟德簡約公屋被發現昏迷，送院後不治。</p><p>警方早上約5時半接報，女嬰的母親表示，女兒昏迷。她被送往廣華醫院後不治。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869498-20260910.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：一名女嬰啟德簡約公屋昏迷　送院後不治</li><li><a href="https://hk.news.yahoo.com/%E5%95%9F%E5%BE%B7%E7%B0%A1%E7%B4%84%E5%85%AC%E5%B1%8B%E5%A5%B3%E5%AC%B0%E5%AE%B6%E4%B8%AD%E6%98%8F%E8%BF%B7-%E9%80%81%E9%99%A2%E6%90%B6%E6%95%91%E5%BE%8C%E4%B8%8D%E6%B2%BB-002223035.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：啟德簡約公屋女嬰家中昏迷　送院搶救後不治</li></ul>
