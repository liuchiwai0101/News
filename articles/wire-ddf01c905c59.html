<h1>智利南部一間養老院發生大火　造成16人死亡</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869805_1_M_20260912213718.jpg" alt=""></p><h3>重點內容</h3><p>智利南部一間養老院發生大火，造成16人死亡、10人受傷。</p><p>根據當地傳媒發布的圖片，養老院部分結構被嚴重燒毀。</p><p>涉事養老院位於阿勞卡尼亞大區，當地星期五晚10時許起火。當地警方説，養老院內當時有26人，其中10人受傷送院治理。警方和檢方人員正調查火災原因。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869805-20260912.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：智利南部一間養老院發生大火　造成16人死亡</li></ul>
