<h1>特區政府大會堂花園舉行儀式　悼念為保衞香港捐軀人士</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/frontend_images/images/gh_btn_share.png" alt=""></p><h3>正文</h3><p>今日是重陽節，特區政府早上在香港大會堂紀念花園，舉行官方紀念儀式，悼念於1941至45年間，為保衞香港而捐軀的人士。</p><p>儀式早上8時開始，現場奏唱國歌，升旗禮後全場默哀兩分鐘，行政長官李家超致獻花圈。</p><p>全國政協副主席梁振英、前行政長官曾蔭權，多名司局長、及立法會主席李慧瓊等，都有出席。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874338-20261018.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：特區政府大會堂花園舉行儀式　悼念為保衞香港捐軀人士</li></ul>
