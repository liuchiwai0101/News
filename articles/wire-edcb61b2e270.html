<h1>消委會發現超市買一送一未必相當於五折</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869978_1_M_20260914193806.jpg" alt=""></p><h3>重點內容</h3><p>消委會説，超級市場就個別貨品提供促銷優惠，例如「買一送一」時實際折扣，可能只有約七折；又發現有大包裝貨品的每單位價格比小包裝高35%。</p><p>另外，消委會測試市面上36款不同長度、有護翼的衞生巾樣本，發現各樣本的吸收速度有參差，其中一款樣本超出內地推薦性國家標準；又發現5款樣本水分含量高於內地標準的10%。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869978-20260914.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：消委會發現超市買一送一未必相當於五折</li></ul>
