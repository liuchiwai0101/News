<h1>大角咀夾公仔店懷疑失竊　損失約1萬元</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871761_1_M_20260927204706.jpg" alt=""></p><h3>重點內容</h3><p>大角咀一間夾公仔店懷疑失竊，損失約1萬元。 警方早上11時許接報，報案人指懷疑有賊人進入大角咀道一間夾公仔店，並打開夾公仔機的錢箱，相信有4部機內的金錢被盜，案件交由旺角警區刑事調查隊跟進。 編輯：陳曉慶</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871761-20260927.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：大角咀夾公仔店懷疑失竊　損失約1萬元</li></ul>
