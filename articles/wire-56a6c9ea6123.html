<h1>天皇宣佈亞運會開幕  賽前折騰名古屋叫苦</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/8114/8657120528_e88bbb1cc5_b.jpg" alt=""></p><p>第20屆亞洲運動會週六在名古屋拉開帷幕。這場參賽規模宏大的體育盛會賽前卻風波不斷，令名古屋組織方應接不暇。亞洲各國各懷喜憂，各路新秀也將在此競相綻放。因為天氣原因和排名靠後，中國女子板球隊還未上場即被淘汰回家。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/天皇宣布亚运会开幕-赛前折腾名古屋叫苦/a-79339185?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：天皇宣佈亞運會開幕  賽前折騰名古屋叫苦</li></ul>
