<h1>Nvidia 以 129.3 億美元收購 Hugging Face　掌握主要 AI 模型分發平台</h1>
<p>Nvidia 宣佈已同意以 129.3 億美元收購 Hugging Face，這個平台主要用於分發及開發開放 AI 模型。交易完成後，Hugging Face 將保留原有品牌，並繼續向不同模型、框架、雲端、推理服務供應商及運算平台開放。 延續開放模型策略 Nvidia 表示，這宗交易將擴大公司對開放權重 AI 模型的投入，讓不同類型的開發者能夠選用合適的開放模型建立產品。雖然 Nvidia 希望藉此推動 AI…</p>
