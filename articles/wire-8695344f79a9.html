<h1>女子倒斃杏花邨單位　警方改列謀殺案拘捕死者丈夫</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870344_1_M_20260917000538.jpg" alt=""></p><h3>重點內容</h3><p>一名53歲女子在杏花邨一個單位倒斃，警方拘捕死者的52歲丈夫，並將案件改列作謀殺案處理。</p><p>警方晚上近8時接報，破門進入杏花邨2座一個單位，發現該名女子倒斃在單位內，頸部有刀傷，警方其後在另一處拘捕死者丈夫。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870344-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：女子倒斃杏花邨單位　警方改列謀殺案拘捕死者丈夫</li><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870337-20260916.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：女子倒斃杏花邨單位頸有刀傷　一名男子被捕</li></ul>
