<div class="notice">內容機器翻譯自第三方媒體（Anthropic：Research（發表成果 · 網頁）），僅供參考，以原文為準。</div><p><img src="https://cdn.sanity.io/images/4zrzovbb/website/ca772f1b34e5b58e38694538f017d63f5dd196d9-1200x630.jpg" alt=""></p><h3>重點內容</h3><p>Anthropic 員工讓 Claude 嘗試攻克黎曼猜想，雖未成功，但一個未發佈的研究版 Claude 在相關問題上取得突破：將滿足黎曼猜想的 zeta 函數零點比例下界從 41.6% 提升至 67.2%。</p><p><a href="https://www.anthropic.com/research/riemann-zeta" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
