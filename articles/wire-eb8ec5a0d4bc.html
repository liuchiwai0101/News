<h1>皮萊諾獎引發爭議 被指控“維吾爾種族滅絕的共犯”</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3828/9393336151_2e9c26ae54_b.jpg" alt=""></p><h3>正文</h3><p>2026年諾貝爾和平獎得主皮萊，曾在2010年擔任聯合國人權高專時謝絕出席劉曉波諾獎頒獎禮，被認為是“整體上令人欽佩的履歷中的一個污點”。更嚴厲的批評來自人權律師埃瑪·賴利（Emma Reilly），她指控皮萊“是維吾爾種族滅絕的共犯”。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/皮莱诺奖引发争议-被指控-维吾尔种族灭绝的共犯/a-79641904?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：皮萊諾獎引發爭議 被指控“維吾爾種族滅絕的共犯”</li></ul>
