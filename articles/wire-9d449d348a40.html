<h1>阿根廷外長：阿中關係處於非常好時期</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870351_1_M_20260917031131.jpg" alt=""></p><h3>重點內容</h3><p>阿根廷外長基爾諾表示，阿中兩國關係目前處於非常好的時期。</p><p>基爾諾當地星期二在首都布宜諾斯艾利斯，出席中國駐阿根廷使館舉辦的國慶招待會時表示，阿根廷政府正在努力擴大市場和貿易開放，在此期間，中國政府向阿根廷提供了續簽雙邊本幣互換協議等重要支持。</p><p>基爾諾強調，阿根廷政府恪守一個中國原則，感謝中方支持阿根廷對馬爾維納斯群島主權的正當要求。他表示，希望繼續深化兩國關係。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870351-20260917.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：阿根廷外長：阿中關係處於非常好時期</li></ul>
