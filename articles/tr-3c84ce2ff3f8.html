<h1>我寫了一本 AI 教科書——AI 還要多久才能寫得更好？</h1>
<div class="notice">內容機器翻譯自第三方媒體（Nathan Lambert：Interconnects（RSS）），僅供參考，以原文為準。</div><p><img src="https://substackcdn.com/image/fetch/$s_!ytKs!,w_1200,h_675,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F815ecb78-309c-4ca3-9ceb-a3329100ae64_3182x1790.png" alt=""></p><h3>重點內容</h3><p>作者在完成一本 RLHF 教科書後反思，LLM 在長文非虛構寫作上進展停滯，GPT 4.5 和 Kimi K2 等寫作強模型已顯老舊，而編碼、數學等任務已接近超人水平。模型能改錯字、做編輯，但組織整章內容時仍混亂且易出錯，作者認為這阻礙了模型自主解決開放科學問題。</p><p><a href="https://www.interconnects.ai/p/i-wrote-an-ai-textbook-how-long-until" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
