<h1>名古屋市長就亞運安排不善致歉　指涉人為失誤及溝通不足</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872193_1_M_20260930213004.jpg" alt=""></p><h3>正文</h3><p>日本名古屋市長廣澤一郎，就今屆亞運安排不善致歉。</p><p>身兼亞組委代理會長的廣澤一郎，在記者會向受影響運動員及相關人士道歉。他表示亞運安排出現問題，是由於人為失誤、及與各國代表團溝通不足，承諾深刻反省。</p><p>今屆名古屋亞運多項安排都引起爭議，包括不興建選手村、而是讓運動員入住貨櫃屋及郵輪；膳食、交通、賽程等也引起部分代表團不滿。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872193-20260930.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：名古屋市長就亞運安排不善致歉　指涉人為失誤及溝通不足</li></ul>
