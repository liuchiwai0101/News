<h1>馬鞍山有私家車撞向警署外欄杆　33歲司機涉醉駕被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870735_1_M_20260919161046.jpg" alt=""></p><h3>重點內容</h3><p>馬鞍山早上有私家車撞向警署外欄杆，一名33歲男司機涉嫌酒後駕駛被捕。</p><p>事發在早上八時許，涉事私家車沿馬鞍山路右轉入錦英路期間，懷疑失控撞向路邊約1.5米長的鐵欄，意外中無人受傷。</p><p>警員接報到場，發現男司機身上有酒氣，他未能通過酒精呼氣測試，現正被扣留調查。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870735-20260919.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：馬鞍山有私家車撞向警署外欄杆　33歲司機涉醉駕被捕</li></ul>
