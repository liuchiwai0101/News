<h1>阿富汗有民房爆炸　10人喪生過百人受傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1879617_1_M_20261128205231.jpg" alt=""></p><h3>正文</h3><p>阿富汗有民房爆炸，造成10人喪生、過百人受傷。</p><p>爆炸發生在東北部庫納爾省首府阿薩達巴德市，官員説，當地一間中學附近，有堆放炸藥的房屋爆炸，該批炸藥用於採礦和爆破工作。部分輕傷者接受治理後已經出院，其餘傷者仍然留院。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1879617-20261128.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：阿富汗有民房爆炸　10人喪生過百人受傷</li></ul>
