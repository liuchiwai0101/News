<h1>啟德七人車罔顧行人安全逆線駛過斑馬線　59歲司機涉危駕遭票控</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/7032/6536097779_a0e9213ae9_b.jpg" alt=""></p><p>執法部門留意到網上流傳一段短片，片段顯示一輛七人車9月14日傍晚約6時，沿啟德沐翠街行駛至一商場對開時，突然切線至對面行車線超車，逆線駛過斑馬線，事件中無人受傷。當時斑馬線上仍有行人正在橫過馬路，該車輛與行人擦身而過，對其他道路使用者構成嚴重威脅。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E5%95%9F%E5%BE%B7%E4%B8%83%E4%BA%BA%E8%BB%8A%E7%BD%94%E9%A1%A7%E8%A1%8C%E4%BA%BA%E5%AE%89%E5%85%A8%E9%80%86%E7%B7%9A%E9%A7%9B%E9%81%8E%E6%96%91%E9%A6%AC%E7%B7%9A-59%E6%AD%B2%E5%8F%B8%E6%A9%9F%E6%B6%89%E5%8D%B1%E9%A7%95%E9%81%AD%E7%A5%A8%E6%8E%A7-140039717.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：啟德七人車罔顧行人安全逆線駛過斑馬線　59歲司機涉危駕遭票控</li></ul>
