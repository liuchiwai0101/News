<h1>埃及開羅附近一條高速公路發生嚴重車禍　最少10死24傷</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1876099_1_M_20261101004834.jpg" alt=""></p><h3>正文</h3><p>埃及首都開羅附近一條高速公路發生嚴重車禍，最少10死24傷。</p><p>衞生和人口部表示，事發在星期六，吉薩省有貨車與小型巴士相撞，造成多人傷亡，其中10人傷勢較重。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1876099-20261101.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：埃及開羅附近一條高速公路發生嚴重車禍　最少10死24傷</li></ul>
