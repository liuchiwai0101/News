<h1>孫玉菡：外傭政策須公平　無意引入試用期</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873954_1_M_20261014195153.jpg" alt=""></p><h3>正文</h3><p>立法會大會討論外傭相關議題，有議員關注會否為即將試行的外籍家居照顧員，引入試用期或退換機制。</p><p>勞工及福利局局長孫玉菡表示，外傭政策涉及大量家庭及外傭，必須小心處理，原則是必須公平公正，認為無需引入試用期。</p><p>孫玉菡又表示，外籍家居照顧員必須於當地完成培訓和考核，會確保課程符合本港實際情況。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873954-20261014.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：孫玉菡：外傭政策須公平　無意引入試用期</li></ul>
