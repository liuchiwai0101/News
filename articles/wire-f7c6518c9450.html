<h1>韓軍：朝鮮向東部海域發射不明飛行器</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869748_1_M_20260912073710.jpg" alt=""></p><h3>重點內容</h3><p>韓國聯合參謀本部表示，朝鮮當地凌晨向東部海域發射不明飛行器，正分析飛行距離及具體參數。</p><p>韓聯社説，若朝方當天發射的是彈道導彈，這將是朝方時隔23日再次發射彈道導彈。朝鮮上月20日從平壤一帶向東部海域發射10多枚短程彈道導彈。據推測，朝方當時發射的可能是600毫米超大型火箭炮。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869748-20260912.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：韓軍：朝鮮向東部海域發射不明飛行器</li></ul>
