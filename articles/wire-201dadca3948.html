<h1>天氣報告｜今日大致多雲　初時有一兩陣雨　下午短暫時間有陽光最高約 31 度</h1>
<div class="notice">內容機器翻譯自第三方媒體（Yahoo 新聞），僅供參考，以原文為準。</div><p><img src="https://s.yimg.com/lo/mysterio/api/38da47fd9e0c847b0f1ba1e732ef81a7701b9ff85f9f21e41c8ff74526f5c0a4/lightyear_networkapi/resizefill_w1200%3Bquality_80%3Bformat_webp/https%3A%2F%2Fd29szjachogqwa.cloudfront.net%2Fimages%2F2026-10%2Fdc279531-d727-49b7-aede-06d560cd114b" alt=""></p><h3>正文</h3><p>本港地區今日天氣預測，大致多雲。初時有一兩陣雨，部分地區能見度較低。下午短暫時間有陽光，最高氣温約 31 度。吹和緩東風，離岸風勢間中清勁。</p><p>展望未來兩三日雲量較多，早晚有一兩陣雨，日間短暫時間有陽光。重陽節（18 日）及翌日日間天色良好及乾燥。</p><h3>各方報道</h3><ul><li><a href="https://hk.news.yahoo.com/%E5%A4%A9%E6%B0%A3%E5%A0%B1%E5%91%8A%EF%BD%9C%E4%BB%8A%E6%97%A5%E5%A4%A7%E8%87%B4%E5%A4%9A%E9%9B%B2-%E5%88%9D%E6%99%82%E6%9C%89%E4%B8%80%E5%85%A9%E9%99%A3%E9%9B%A8-%E4%B8%8B%E5%8D%88%E7%9F%AD%E6%9A%AB%E6%99%82%E9%96%93%E6%9C%89%E9%99%BD%E5%85%89%E6%9C%80%E9%AB%98%E7%B4%84-31-%E5%BA%A6-010528297.html" target="_blank" rel="noopener noreferrer">Yahoo 新聞</a>：天氣報告｜今日大致多雲　初時有一兩陣雨　下午短暫時間有陽光最高約 31 度</li></ul>
