<h1>澤連斯基稱烏克蘭能源系統遭受大規模襲擊</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874322_1_M_20261017211924.jpg" alt=""></p><h3>正文</h3><p>烏克蘭總統澤連斯基在社交媒體發文説，當地週五晚至週六早上，能源系統遭受大規模襲擊，15處以上重要發電及輸電設施被攻擊，分佈多地。</p><p>澤連斯基指俄羅斯動用320多架無人機及各類導彈施襲，而在俄軍發動襲擊之際，美國卻完全無視《2026年格雷厄姆制裁俄羅斯和伊朗法案》，有關法案本應對俄羅斯施加有效壓力，以推動衝突結束。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874322-20261017.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：澤連斯基稱烏克蘭能源系統遭受大規模襲擊</li></ul>
