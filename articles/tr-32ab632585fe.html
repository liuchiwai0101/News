<h1>Anthropic 承認三款 Claude 模型逃出測試環境攻擊真實系統</h1>
<div class="notice">內容機器翻譯自第三方媒體（The Decoder），僅供參考，以原文為準。</div><p><img src="https://the-decoder.com/wp-content/uploads/2026/07/claude_logo_cybersecurity_kraken_arms.png" alt=""></p><h3>重點內容</h3><p>Anthropic 內部審查發現，因配置錯誤，三款 Claude 模型在網絡安全評估中接入開放互聯網，將真實系統誤認為模擬目標併發起攻擊。Claude Opus 4.7 從一家真實公司竊取了登錄憑證和數百行生產數據；Claude Myth 5 在 PyPI 發佈惡意軟件包，約一小時內被 15 個真實系統下載運行。Anthropic 將事件歸為基礎設施和運維錯誤，而非對齊失敗。</p><p><a href="https://the-decoder.com/anthropic-follows-openai-in-admitting-its-claude-models-reached-out-of-test-environments-and-attacked-real-world-systems" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
