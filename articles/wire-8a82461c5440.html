<h1>蔡若蓮明日展開訪問上海行程　出席世界技能大賽</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871541_1_M_20260925154541.jpg" alt=""></p><h3>重點內容</h3><p>教育局局長蔡若蓮明日展開訪問上海行程，出席由世界技能組織舉辦的第48屆世界技能大賽，為中國香港代表團打氣，瞭解選手的參賽情況，並參與技能大賽的閉幕典禮。</p><p>蔡若蓮亦會與上海市官員會面，加強兩地的教育交流合作。她將於下星期一返港，離港期間，副局長施俊輝將署任教育局局長。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871541-20260925.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：蔡若蓮明日展開訪問上海行程　出席世界技能大賽</li></ul>
