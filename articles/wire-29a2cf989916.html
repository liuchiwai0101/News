<h1>欣陞有限公司因違反補充勞工優化計劃規定　未來一年被拒申請</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871073_1_M_20260922125417.jpg" alt=""></p><h3>重點內容</h3><p>​勞工處宣佈，欣陞有限公司違反「補充勞工優化計劃」規定被行政制裁。處方即時中止該公司已提交的「補充勞工優化計劃」輸入勞工申請，並由即日起拒絕處理隨後一年在優化計劃下提交的申請。</p><p>經調查後，勞工處確定有關公司沒有持續符合全職本地僱員與輸入勞工二比一的人手比例要求，違反優化計劃的規定，因此被施加行政制裁。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871073-20260922.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：欣陞有限公司因違反補充勞工優化計劃規定　未來一年被拒申請</li></ul>
