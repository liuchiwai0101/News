<h1>英媒指皇家空軍台風戰鬥機將派至沙特執行防禦性制空作戰任務</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874690_1_M_20261021011529.jpg" alt=""></p><h3>正文</h3><p>英國傳媒報道，英國將派遣皇家空軍「台風」戰鬥機，協助沙特阿拉伯抵禦也門胡塞武裝的襲擊。</p><p>報道引述英國國防大臣施卓添表示，「台風」戰鬥機將在沙特上空執行防禦性制空作戰任務，不會主動打擊胡塞武裝，以協助保護沙特的城市、居民及關鍵國家基礎設施，免受胡塞武裝襲擊。</p><p>報道又指，英國亦將向沙特派遣軍事顧問及一架A400M型運輸機。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874690-20261021.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：英媒指皇家空軍台風戰鬥機將派至沙特執行防禦性制空作戰任務</li></ul>
