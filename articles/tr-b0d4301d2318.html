<h1>持續學習時代的 8 個預測</h1>
<div class="notice">內容機器翻譯自第三方媒體（Dwarkesh Patel：Podcast & Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://substackcdn.com/image/fetch/$s_!aZV5!,w_1200,h_600,c_fill,f_jpg,q_auto:good,fl_progressive:steep,g_auto/https%3A%2F%2Fsubstack-video.s3.amazonaws.com%2Fvideo_upload%2Fpost%2F210233020%2F79db13aa-56cb-4436-a924-c35c854eab15%2Ftranscoded-1786122979.png" alt=""></p><h3>重點內容</h3><p>持續學習將顛覆現有 AI 監管與對齊範式：模型不再“訓練後部署”，而是每日基於數百萬次工作會話更新權重，因此監管應轉向月度或季度風險檢查，而非部署前一次性評估。技術對齊需解決權重持續更新下的越獄與惡意注入問題。個性化權重服務的算力經濟將偏向大型組織，個人以 batch size 1 服務自身可能面臨 100 倍以上的算力效率懲罰。</p><p><a href="https://www.dwarkesh.com/p/era-of-continual-learning" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
