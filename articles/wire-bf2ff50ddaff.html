<h1>俄方稱將很快公佈三方談判日期　不打算邀請歐洲參加</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1875691_1_M_20261029001513.jpg" alt=""></p><h3>正文</h3><p>俄羅斯總統助理烏沙科夫表示，俄美烏三方談判的日期將很快公佈，俄方不打算邀請歐洲方面參加烏克蘭問題談判。</p><p>克里姆林宮發言人佩斯科夫表示，一旦在阿布扎比舉行的烏克蘭問題三方談判日期確定，克里姆林宮將予以公佈。</p><p>烏克蘭總統澤連斯基較早時表示，烏方正在等待美方敲定三方會談的具體時間，他期待會晤能在11月10日前舉行，目前相關籌備工作仍在推進。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1875691-20261029.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：俄方稱將很快公佈三方談判日期　不打算邀請歐洲參加</li></ul>
