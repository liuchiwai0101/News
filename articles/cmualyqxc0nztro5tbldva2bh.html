<h1>數字生命卡茲克訪談漢化組：AI 時代字幕組與漫畫組的真實處境</h1>
<div class="notice">內容機器翻譯自第三方媒體（數字生命卡茲克），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/5720/21667172841_c459656c59_b.jpg" alt=""></p><h3>AI 導讀</h3><p>作者訪談多位字幕組與漫畫漢化組成員，發現他們並不牴觸AI。Eliza 的字幕組把聽寫、打軸交給AI後，原本需要3到5小時的打軸縮短到20分鐘到1小時；程序員陣雨為喜歡的主播自研AI工具，單人完成兩小時直播的中文字幕。漫畫漢化組則因嵌字質量等原因仍堅持人工製作，成員看重的是同好社群與愛好本身。</p><h3>推薦理由</h3><p>作者實地訪談字幕組和漫畫漢化組，呈現AI時代愛好者用自研工具做漢化的真實做法與心態。</p><p><a href="https://mp.weixin.qq.com/s?__biz=MzIyMzA5NjEyMA%3D%3D&amp;amp;mid=2647686509&amp;amp;idx=1&amp;amp;sn=1b5ee8ab30c5825eaff76083e1f8dbcc" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
