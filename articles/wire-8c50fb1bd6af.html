<h1>國家財政部透過香港金融管理局的債務工具中央結算系統發行人民幣國債</h1>
<div class="notice">內容機器翻譯自第三方媒體（政府新聞公報），僅供參考，以原文為準。</div><p><img src="https://www.info.gov.hk/gia/images/header_pressreleases_tc_x2.png" alt=""></p><h3>正文</h3><p>下稿代香港金融管理局發出︰ 國家財政部將會透過香港金融管理局（金管局）的債務工具中央結算系統發行人民幣國債。國家財政部的人民幣國債招標公告和招標章程以及發行和交存代理通過金管局提供關於招標的信息見附件。</p><h3>各方報道</h3><ul><li><a href="https://www.info.gov.hk/gia/general/202610/20/P2026101600549.htm" target="_blank" rel="noopener noreferrer">政府新聞公報</a>：國家財政部透過香港金融管理局的債務工具中央結算系統發行人民幣國債</li></ul>
