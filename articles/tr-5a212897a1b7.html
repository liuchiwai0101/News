<h1>蘋果研究：LLM 類人行為的多維度分析——模型行為、用户因素與系統提示詞的影響</h1>
<div class="notice">內容機器翻譯自第三方媒體（Apple Machine Learning Research（RSS）），僅供參考，以原文為準。</div><p><img src="https://mlr.cdn-apple.com/media/Home_1200x630_48225d82e9.png" alt=""></p><h3>重點內容</h3><p>蘋果機器學習研究團隊對 LLM 的類人行為（如表達想法與情緒、與用户建立關係、拒絕請求並保持邊界）進行了多維度分析，涵蓋其普遍性、潛在影響與可控性。研究採用 LLM-as-a-judge 與人工評估相結合的方法，樣本規模超過 21,000 條數據，旨在為研究者與實踐者提供關於何時及何種類型類人行為的決策依據。</p><p><a href="https://machinelearning.apple.com/research/human-like-behaviors-llms" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
