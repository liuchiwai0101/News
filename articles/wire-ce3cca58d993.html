<h1>內地首次在文化遺產保護領域　制定五年規劃</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1874655_1_M_20261020193354.jpg" alt=""></p><h3>正文</h3><p>中共中央辦公廳、國務院辦公廳近日印發《文化遺產保護傳承「十五五」規劃》，是首次在文化遺產保護領域制定五年規劃。</p><p>中央精神文明建設辦公室表示，將建立全國文化遺產資源總目錄，制定文化遺產保護法，強化文化遺產的法制保障。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1874655-20261020.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：內地首次在文化遺產保護領域　制定五年規劃</li></ul>
