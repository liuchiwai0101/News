<h1>韓國決定召回駐烏克蘭大使</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873220_1_M_20261009043917.jpg" alt=""></p><h3>重點內容</h3><p>韓國外交部表示，韓國政府期待韓烏兩國之間各項懸而未決的問題能夠得到妥善解決，並將繼續與烏克蘭方面保持磋商。</p><p>烏克蘭總統澤連斯基上月對外公佈向韓國移送兩名朝鮮戰俘的消息。韓國總統李在明本月初表示，烏方違反雙方達成的保密協議，要求烏方道歉。韓國外交部早前亦表達強烈遺憾，認為基輔單方面的行為嚴重破壞兩國政府之間的信任。烏克蘭外交部發言人日前表示，雙方對保密方式的理解存在差異，因此產生誤會。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873220-20261009.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：韓國決定召回駐烏克蘭大使</li></ul>
