<h1>粉嶺公路3車「串燒」 2司機受傷送院</h1>
<div class="notice">內容機器翻譯自第三方媒體（星島頭條 · 香港01），僅供參考，以原文為準。</div><p><img src="https://image.hkhl.hk/f/1200p0/0x0/100/none/1168ed0b02371d1d7bddba65541a5146/2026-11/page_204.jpg" alt=""></p><h3>正文</h3><p>今日（24日）清晨5時11分，一輛泥頭車沿粉嶺公路往上水方向行駛，當駛至近九龍坑時因應交通情況收慢車速，詎料尾隨的私家車和客貨車收掣不及，釀成3車相撞。事故中私家車和客貨車司機受輕傷，送院救治。警員正調查意外原因。</p><h3>各方報道</h3><ul><li><a href="https://www.stheadline.com/breaking-news/3640492/粉嶺公路3車串燒-2司機受傷送院" target="_blank" rel="noopener noreferrer">星島頭條</a>：粉嶺公路3車「串燒」 2司機受傷送院</li><li><a href="https://www.hk01.com/%E7%AA%81%E7%99%BC/60414195/%E7%B2%89%E5%B6%BA%E5%85%AC%E8%B7%AF3%E8%BB%8A%E4%B8%B2%E7%87%92%E7%9B%B8%E6%92%9E%E9%87%802%E5%82%B7-%E5%BE%80%E4%B8%8A%E6%B0%B4%E6%96%B9%E5%90%91%E9%83%A8%E4%BB%BD%E8%A1%8C%E8%BB%8A%E7%B7%9A%E5%B0%81%E9%96%89" target="_blank" rel="noopener noreferrer">香港01</a>：粉嶺公路3車串燒相撞釀2傷 往上水方向部份行車線封閉</li></ul>
