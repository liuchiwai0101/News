<h1>告別“只收現金” 德國擬強制商家提供電子支付選項</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p><img src="https://live.staticflickr.com/3524/3287512664_2e509ce910_b.jpg" alt=""></p><p>德國政府擬要求商家必須提供至少一種電子支付方式，在保留現金支付的同時推動無現金交易普及。新規旨在便利消費者並加強金融監管，但也引發零售業對成本上升和經營負擔加重的擔憂。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/告别-只收现金-德国拟强制商家提供电子支付选项/a-79244126?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：告別“只收現金” 德國擬強制商家提供電子支付選項</li></ul>
