<h1>德情報機關：俄羅斯特工參與對萊比錫機場的未遂襲擊</h1>
<div class="notice">內容機器翻譯自第三方媒體（德國之聲），僅供參考，以原文為準。</div><p>圍繞8月初針對萊比錫機場的無人機襲擊未遂事件，又有了最新進展。德情報機關的一份內部報告指出，一名俄羅斯籍特工和一名白俄羅斯公民在襲擊前就潛入了德國，炸藥也提早從保加利亞、塞爾維亞偷運入境。</p><h3>各方報道</h3><ul><li><a href="https://www.dw.com/zh/德情报机关：俄罗斯特工参与对莱比锡机场的未遂袭击/a-79245879?maca=chi-rss-chi-all-1127-rdf" target="_blank" rel="noopener noreferrer">德國之聲</a>：德情報機關：俄羅斯特工參與對萊比錫機場的未遂襲擊</li></ul>
