<h1>OpenAI 呼籲通過“反向聯邦主義”推動美國 AI 安全標準統一</h1>
<div class="notice">內容機器翻譯自第三方媒體（OpenAI：官網動態（RSS · 排除企業/客户案例）），僅供參考，以原文為準。</div><p><img src="https://images.ctfassets.net/kftzwdyauwt9/C8LVPcOuyeD3G5OalCrVN/16094efa3ff169506c97c14ec2b71f8a/Frame.png?w=1600&amp;amp;h=900&amp;amp;fit=fill" alt=""></p><h3>重點內容</h3><p>OpenAI 首席全球事務官 Chris Lehane 發文，主張通過“反向聯邦主義”——即各州先通過相似立法形成事實上的國家標準——來推動美國 AI 前沿安全治理。加州、紐約州和伊利諾伊州已通過相關立法，核心要素包括風險披露、安全事故報告和獨立審計。聯邦層面，特朗普政府正與專家合作制定針對最強大 AI 模型的網絡測試框架，預計 8 月初完成。</p><p><a href="https://openai.com/index/advancing-ai-safety-through-state-and-federal-action" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
