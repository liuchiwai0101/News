<h1>特朗普再次提到伊朗渴望達成協議　美方對談判持開放態度</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870009_1_M_20260915055301.jpg" alt=""></p><h3>重點內容</h3><p>美國總統特朗普在社交媒體連發多則帖文，提到美伊局勢，再次表示伊朗渴望達成協議，美方對談判持開放態度。</p><p>特朗普又將美國物價上漲歸咎前總統拜登政府，指除了油價暫時處於高位之外，其他物價正大幅回落，只要美伊戰事結束，油價也會暴跌。</p><p>特朗普又提到，美國幫助各國運油輪通過霍爾木茲海峽，各國應該在戰事結束後補償美國。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870009-20260915.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：特朗普再次提到伊朗渴望達成協議　美方對談判持開放態度</li></ul>
