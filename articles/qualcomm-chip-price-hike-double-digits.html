<h1>Qualcomm 明起調升晶片價格　幅度達雙位數百分比</h1>
<p>高通公司（Qualcomm）宣布，自明日開始將其晶片價格調升超過百分之十。該公司早於七月已預告此次漲價安排，並通知客戶，凡九月一日之後出貨的晶片均將適用新價格。 無法再吸收供應商成本上漲 高通表示，公司已無法繼續承擔日益增加的供應商成本。高通行政總裁 Cristiano Amon 在接受路透社訪問時指出：「我們只是將大幅上升的成本轉嫁出去。」 Apple 仍依賴 Qualcomm 供應 iPhone 17 調制解調器 雖然 Apple 正逐步過渡至自家研發的調制解調器晶片，但為 iPhone 17…</p>
