<h1>30歲男子涉嫌與元朗傷人案有關被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1870772_1_M_20260919231351.jpg" alt=""></p><h3>重點內容</h3><p>警方在上水拘捕一名30歲本地男子，涉嫌與昨日一宗傷人案有關，現正被扣留調查。</p><p>一名31歲女子昨晚在元朗豐年路20號對開，被一名男子以刀襲擊，手部受傷，男子其後逃去。傷者清醒被送往博愛醫院治理，其後轉送屯門醫院。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1870772-20260919.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：30歲男子涉嫌與元朗傷人案有關被捕</li></ul>
