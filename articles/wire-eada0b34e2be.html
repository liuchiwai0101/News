<h1>韓國持刀傷人事件增至8人受傷　涉嫌行兇男子被捕</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1873754_1_M_20261013151246.jpg" alt=""></p><h3>正文</h3><p>韓聯社報道，韓國仁川市一間大型超市發生持刀傷人事件，增至8人受傷，其中1人心臟驟停，涉嫌行兇男子被捕。</p><p>報道説，事發在當地時間下午2時前，消防部門接報，仁川市南洞區一間超市發生持刀傷人事件。當局正在調查事件具體經過。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1873754-20261013.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：韓國持刀傷人事件增至8人受傷　涉嫌行兇男子被捕</li></ul>
