<h1>名古屋亞運會下週六開幕　羅淑佩冀港隊展現出水平</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地 · RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1869794_1_M_20260912193043.jpg" alt=""></p><h3>重點內容</h3><p>名古屋亞運會將於下週六開鑼，文化體育及旅遊局局長羅淑佩接受本台專訪時表示，期望港隊可以在亞運展現出水平，又呼籲巿民為港隊打氣。她又表示，政府於亞運會後，檢討隊際運動項目發展計劃。 編輯：劉景輝</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1869794-20260912.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：名古屋亞運會下週六開幕　羅淑佩冀港隊展現出水平</li></ul>
