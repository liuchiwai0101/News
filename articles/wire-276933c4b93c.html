<h1>沙田有巴士與私家車相撞　4人送院</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 本地），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1871299_1_M_20260924030651.jpg" alt=""></p><h3>重點內容</h3><p>沙田新田圍邨發生交通意外，4人送院。 事發在凌晨近1時，一輛九巴沿沙田頭路落斜行駛，期間在一個彎位與對面行車線的一輛私家車相撞，私家車起火，消防到場救援，私家車司機和車上兩名乘客受傷，連同報稱不適的九巴司機，送往威爾斯醫院治理。 編輯：許敬...</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1871299-20260924.htm" target="_blank" rel="noopener noreferrer">RTHK 本地</a>：沙田有巴士與私家車相撞　4人送院</li></ul>
