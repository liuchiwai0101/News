<div class="notice">內容機器翻譯自第三方媒體（Google Developers Blog（RSS）），僅供參考，以原文為準。</div><p><img src="https://storage.googleapis.com/gweb-developer-goog-blog-assets/images/Gemini_Generated_Image_64bmkd64bm.2e16d0ba.fill-1200x600.jpg" alt=""></p><h3>重點內容</h3><p>Genkit Go 推出基於漸進式披露架構的 Agent Skills，將專用指令、腳本和參考資料打包為模塊化 SKILL.md 包，初始僅向系統提示暴露 frontmatter 元數據。當任務匹配技能描述時，Genkit 中間件動態加載完整指令和關聯資源，確保模型在需要時訪問精確工作流，以減少 token 消耗並防止上下文窗口膨脹。</p><p><a href="https://developers.googleblog.com/enable-on-demand-expertise-with-agent-skills-in-genkit-go" target="_blank" rel="noopener noreferrer">查看原文 ↗</a></p>
