<h1>俄羅斯據報有戰略轟炸機於遠東訓練時墜毀　6名機組人員死亡</h1>
<div class="notice">內容機器翻譯自第三方媒體（RTHK 國際），僅供參考，以原文為準。</div><p><img src="https://newsstatic.rthk.hk/images/mfile_1872063_1_M_20260930013208.jpg" alt=""></p><h3>重點內容</h3><p>塔斯社引述俄羅斯國防部消息報道，一架圖-95戰略轟炸機，在俄羅斯遠東地區阿穆爾州進行訓練飛行時墜毀，機上6名機組人員死亡、1人受傷。</p><p>報道指，飛機墜毀地點無人居住，當時並未攜帶彈藥。傷者已被送往醫院救治。當局正調查事故原因。</p><h3>各方報道</h3><ul><li><a href="https://news.rthk.hk/rthk/ch/component/k2/1872063-20260930.htm" target="_blank" rel="noopener noreferrer">RTHK 國際</a>：俄羅斯據報有戰略轟炸機於遠東訓練時墜毀　6名機組人員死亡</li></ul>
